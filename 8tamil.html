<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sundarraju TNPSC Kattral Ulagam</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f8f6; --card:#ffffff; --ink:#16231f; --muted:#5b6b66;
  --brand:#0f5c4d; --brand-ink:#ffffff; --accent:#e8a317; --line:#d7e2dd;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1714;--card:#16231f;--ink:#e7f0ec;--muted:#9bb0a8;--brand:#2fae94;--brand-ink:#08130f;--accent:#f0b43a;--line:#2a3c36;}
}
:root[data-theme="dark"]{--bg:#0e1714;--card:#16231f;--ink:#e7f0ec;--muted:#9bb0a8;--brand:#2fae94;--brand-ink:#08130f;--accent:#f0b43a;--line:#2a3c36;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;line-height:1.75}
header{background:var(--brand);color:var(--brand-ink);padding:28px 16px 22px;border-bottom:6px solid var(--accent)}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.25}
header p{margin:6px 0 0;opacity:.9}
.tools{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px;padding:10px 14px;border-radius:8px;border:2px solid transparent;font:inherit;background:#fff;color:#16231f}
.tools input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools button{padding:10px 16px;border-radius:8px;border:2px solid var(--brand-ink);background:transparent;color:var(--brand-ink);font:inherit;cursor:pointer}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
nav button{white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{padding:20px 0 60px}
h2{font-size:1.35rem;margin:6px 0 14px;color:var(--brand)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
details[open] summary{border-bottom:1px solid var(--line)}
.body{padding:10px 16px 14px}
.body ul{margin:0;padding-left:20px}
.body li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:6px}
.scroll{overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--bg)}
mark{background:var(--accent);color:#16231f;border-radius:3px;padding:0 2px}
.quiz .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.quiz .opts{display:grid;gap:8px;margin-top:8px}
.quiz .opts button{text-align:left;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.quiz .opts button.ok{background:#1f8a5b;color:#fff;border-color:#1f8a5b}
.quiz .opts button.bad{background:#c0392b;color:#fff;border-color:#c0392b}
.score{font-weight:700;margin:10px 0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.qa-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qa-bar select,.qa-bar input{flex:1;min-width:160px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.qa-bar button,.pager button{padding:9px 14px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;cursor:pointer}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.pager button:disabled{opacity:.4;cursor:default}
.meta{color:var(--muted);font-size:.9rem;margin:4px 0 12px}
details.qa summary{font-weight:500}
footer{text-align:center;color:var(--muted);padding:20px 16px 40px;font-size:.9rem}
</style>
</head>

<header>
  <div class="wrap">
    <h1>Sundarraju TNPSC Kattral Ulagam</h1>
    <p>சுந்தரராஜ் TNPSC கற்றல் உலகம் &mdash; குரூப் IV | 8ஆம் வகுப்பு தமிழ் குறிப்புகள் + 500 வினா-விடை</p>
    <div class="tools">
      <input id="search" type="search" placeholder="தேடுக… (எ.கா: கலிங்கத்துப்பரணி, திருக்கேதாரம்)" aria-label="குறிப்புகளைத் தேடுக">
      <button id="theme" type="button">🌓 Theme</button>
    </div>
  </div>
</header>
<nav><div class="wrap" id="tabs" role="group" aria-label="பிரிவுகள்"></div></nav>
<main class="wrap" id="content"></main>
<footer>&copy; <span id="yr"></span> Sundarraju TNPSC Kattral Ulagam &middot; தேர்வுக்கு முன் பாடநூலுடன் சரிபார்க்கவும்.</footer>

const SECTIONS = [{"id":"i1","name":"இயல் 1 – தமிழ் இன்பம்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: தமிழ்மொழி வாழ்த்து, தமிழ்மொழி மரபு</li><li>உரைநடை: தமிழ் வரிவடிவ வளர்ச்சி</li><li>துணைப்பாடம்: சொற்பூங்கா</li><li>இலக்கணம்: எழுத்துகளின் பிறப்பு</li></ul>"},{"t":"தமிழ்மொழி வாழ்த்து – பாரதியார்","html":"<ul><li>இயற்பெயர் சுப்பிரமணியன்; எட்டயபுரம்; 11.12.1882 – 11.09.1921; பெற்றோர் சின்னசாமி – இலக்குமி அம்மையார்; மனைவி செல்லம்மாள்.</li><li>நூல்கள்: கண்ணன் பாட்டு, குயில் பாட்டு, பாஞ்சாலி சபதம், பாப்பா பாட்டு. இதழ்கள்: இந்தியா, விஜயா, சுதேசமித்திரன்.</li><li>சொற்பொருள்: நிரந்தரம் – காலம் முழுமையும்; வண்மொழி – வளமிக்க மொழி; வைப்பு – நிலப்பகுதி; இசை – புகழ்.</li></ul>"},{"t":"தமிழ் வரிவடிவ வளர்ச்சி","html":"<ul><li>தமிழி (தமிழ் பிராமி) → வட்டெழுத்து → தற்கால எழுத்து; தமிழி ஆய்வு: ஐராவதம் மகாதேவன்.</li><li>வீரமாமுனிவர் – எ, ஒ குறில் சீர்திருத்தம்; பெரியார் வலியுறுத்திய எழுத்துச் சீர்திருத்தம் 1978-இல் அரசால் ஏற்கப்பட்டது.</li><li>எழுதுபொருள்: கல், செப்பேடு, ஓலைச்சுவடி; கருவி: எழுத்தாணி.</li></ul>"},{"t":"எழுத்துகளின் பிறப்பு","html":"<ul><li>எழுத்தொலி பிறக்கும் இடங்கள் எட்டு: மார்பு, கழுத்து, தலை, மூக்கு, பல், இதழ், நா, அண்ணம்.</li><li>பிறப்பு 2 வகை: இடப்பிறப்பு, முயற்சிப் பிறப்பு; அ, ஆ – வாய் திறத்தல்; உ, ஊ, ஒ, ஓ, ஔ – இதழ் குவிதல்.</li><li>தொல்காப்பியம், நன்னூல் (பவணந்தி முனிவர்) எழுத்துகளின் பிறப்பைக் கூறும்.</li></ul>"}]},{"id":"i2","name":"இயல் 2 – ஈடில்லா இயற்கை","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: ஓடை, கோணக்காத்துப் பாட்டு</li><li>உரைநடை: நிலம் பொது</li><li>துணைப்பாடம்: வெட்டுக்கிளியும் சருகுமானும்</li><li>இலக்கணம்: வினைமுற்று</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"ஓடை – வாணிதாசன்","html":"<ul><li>இயற்பெயர் அரங்கசாமி; புதுவை வில்லியனூர்; பாரதிதாசன் மாணவர்; தமிழ்நாட்டு வோர்ட்ஸ்வொர்த்; பாவலர்மணி.</li><li>நூல்கள்: தொடுவானம், எழிலோவியம், கொடிமுல்லை.</li></ul>"},{"t":"கோணக்காத்துப் பாட்டு","html":"<ul><li>நாட்டுப்புறக் கும்மிப் பாடல்; ஆசிரியர் வெங்கம்பூர் சாமிநாதன்; கோணக்காத்து – சூறைக்காற்று.</li></ul>"},{"t":"நிலம் பொது","html":"<ul><li>சுகுவாமிஷ் பழங்குடியினர்; தலைவர் சியாட்டில்; நிலம் அனைத்து உயிர்களுக்கும் பொது என்பது கருத்து.</li></ul>"},{"t":"வினைமுற்று","html":"<ul><li>தெரிநிலை வினைமுற்று (காலம் காட்டும்; 6 கூறுகள்: செய்பவன், கருவி, நிலம், செயல், காலம், செய்பொருள்), குறிப்பு வினைமுற்று (காலம் காட்டாது).</li><li>ஏவல்: வா, நட; வியங்கோள்: வாழ்க.</li><li>இடைநிலை: இறந்தகாலம் – த், ட், ற், இன்; நிகழ்காலம் – கிறு, கின்று, ஆநின்று; எதிர்காலம் – ப், வ்.</li></ul>"}]},{"id":"i3","name":"இயல் 3 – உடலை ஓம்புமின்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: நோயும் மருந்தும், வருமுன் காப்போம்</li><li>உரைநடை: தமிழர் மருத்துவம்</li><li>துணைப்பாடம்: தலைக்குள் ஓர் உலகம்</li><li>இலக்கணம்: எச்சம்</li></ul>"},{"t":"தமிழர் மருத்துவம்","html":"<ul><li>சித்த மருத்துவம்; முக்குற்றம்: வாதம், பித்தம், கபம்; சித்தர்கள்: அகத்தியர், தேரையர்.</li><li>உணவே மருந்து; திருக்குறள் ‘மருந்து’ அதிகாரம் – 95 (பொருட்பால், அங்கவியல்).</li></ul>"},{"t":"எச்சம்","html":"<ul><li>பெயரெச்சம் (பெயரைக் கொண்டு முடியும்): படித்த மாணவன்; வினையெச்சம் (வினையைக் கொண்டு முடியும்): படித்துச் சென்றான்.</li><li>தெரிநிலைப் பெயரெச்சம் காலம் காட்டும்; குறிப்புப் பெயரெச்சம் காலம் காட்டாது (பெரிய, நல்ல).</li></ul>"}]},{"id":"i4","name":"இயல் 4 – கல்வி கரையில்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: கல்வி அழகே அழகு, புத்தியைத் தீட்டு</li><li>உரைநடை: பல்துறைக் கல்வி</li><li>துணைப்பாடம்: ஆன்ற குடிப்பிறத்தல்</li><li>இலக்கணம்: வேற்றுமை</li></ul>"},{"t":"கல்வி அழகே அழகு – நாலடியார்","html":"<ul><li>நாலடியார்: சமண முனிவர்கள்; வெண்பா; 400 பாடல்; பதினெண்கீழ்க்கணக்கு; வேளாண் வேதம்; “நாலும் இரண்டும் சொல்லுக்கு உறுதி” (நாலடியார், திருக்குறள்).</li></ul>"},{"t":"வேற்றுமை","html":"<ul><li>8 வேற்றுமைகள்: பெயர், ஐ, ஆல், கு, இன், அது, கண், விளி.</li><li>உருபுகள்: 2 – ஐ; 3 – ஆல், ஆன், ஓடு, ஒடு; 4 – கு; 5 – இன், இல்; 6 – அது, அ; 7 – கண், இல், இடம்.</li><li>பொருள்: 2 – செயப்படுபொருள்; 3 – கருவி, கருத்தா; 4 – கொடை, பகை, நேர்ச்சி, தகுதி; 6 – உடைமை; 7 – இடம்.</li></ul>"}]},{"id":"i5","name":"இயல் 5 – குழலினிது யாழினிது","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: திருக்கேதாரம், பாடறிந்து ஒழுகுதல்</li><li>உரைநடை: நாட்டுப்புறக் கைவினைக்கலைகள்</li><li>துணைப்பாடம்: தமிழர் இசைக்கருவிகள்</li><li>இலக்கணம்: தொகைநிலை, தொகாநிலைத் தொடர்கள்</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"திருக்கேதாரம் – சுந்தரர்","html":"<ul><li>தேவாரம் பாடிய மூவர்: திருஞானசம்பந்தர் (1, 2, 3), திருநாவுக்கரசர் (4, 5, 6), சுந்தரர் (7 ஆம் திருமுறை).</li><li>சுந்தரர்: இயற்பெயர் நம்பியாரூரர்; திருநாவலூர்; தம்பிரான் தோழர். திருநாவுக்கரசர்: மருள்நீக்கியார்; அப்பர், வாகீசர், தாண்டக வேந்தர்.</li><li>பதிகம் = பத்துப் பாடல்; தேவாரம் தொகுத்தவர் நம்பியாண்டார் நம்பி; தே + ஆரம் (இறைவன் மாலை), தே + வாரம் (இசைப்பாடல்).</li></ul>"},{"t":"பாடறிந்து ஒழுகுதல்","html":"<ul><li>கலித்தொகைப் பாடல்; கலித்தொகை – 150 பாடல், கலிப்பா, தொகுத்தவர் நல்லந்துவனார்.</li></ul>"},{"t":"தமிழர் இசைக்கருவிகள்","html":"<ul><li>4 வகை: தோற்கருவி (பறை, முழவு, தவில்), துளைக்கருவி (குழல், நாதசுவரம்), நரம்புக்கருவி (யாழ், வீணை), கஞ்சக்கருவி (தாளம்).</li><li>யாழ் வகை: பேரியாழ், சீறியாழ், மகரயாழ், சகோடயாழ்.</li></ul>"},{"t":"தொகைநிலை, தொகாநிலைத் தொடர்கள்","html":"<ul><li>தொகைநிலை 6: வேற்றுமை, வினை, பண்பு, உவமை, உம்மை, அன்மொழித்தொகை.</li><li>தொகாநிலை 9: எழுவாய், விளி, வினைமுற்று, பெயரெச்சம், வினையெச்சம், வேற்றுமை, இடைச்சொல், உரிச்சொல், அடுக்குத்தொடர்.</li></ul>"}]},{"id":"i6","name":"இயல் 6 – வையம்புகழ் வணிகம்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: வளம் பெருகுக, மழைச்சோறு</li><li>உரைநடை: கொங்குநாட்டு வணிகம்</li><li>துணைப்பாடம்: காலம் உடன் வரும்</li><li>இலக்கணம்: புணர்ச்சி</li></ul>"},{"t":"மழைச்சோறு","html":"<ul><li>‘பழந்தமிழர் வழிபாட்டு மரபுகள்’ நூலில் உள்ள ‘கொங்குநாட்டு மழைச்சோற்று வழிபாடு’ கட்டுரையிலிருந்து; மழை வேண்டி நடத்தப்படும் வழிபாடு.</li></ul>"},{"t":"கொங்குநாட்டு வணிகம்","html":"<ul><li>கொடுமணம் – நொய்யல் ஆற்றங்கரை (ஈரோடு); பண்டமாற்று; உமணர் (உப்பு வணிகர்); வணிகக் குழுக்கள்: நானாதேசிகள், ஐநூற்றுவர்.</li></ul>"},{"t":"புணர்ச்சி","html":"<ul><li>நிலைமொழி + வருமொழி; இயல்பு, விகாரம் (தோன்றல், திரிதல், கெடுதல்).</li><li>பூ+கொடி=பூங்கொடி; பொன்+குடம்=பொற்குடம்; மரம்+வேர்=மரவேர்; திரு+அடி=திருவடி; உடம்படுமெய்: ய், வ்.</li></ul>"}]},{"id":"i7","name":"இயல் 7 – பாருக்குள்ளே நல்ல நாடு","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: படை வேழம், விடுதலைத் திருநாள்</li><li>உரைநடை: பாரத ரத்னா எம்.ஜி. இராமச்சந்திரன்</li><li>துணைப்பாடம்: அறிவுசால் ஔவையார்</li><li>இலக்கணம்: வல்லினம் மிகும் இடங்களும் மிகா இடங்களும்</li></ul>"},{"t":"படை வேழம் – கலிங்கத்துப்பரணி","html":"<ul><li>ஆசிரியர் செயங்கொண்டார் (தீபங்குடி; பரணிக்கோர் செயங்கொண்டார்); பாட்டுடைத் தலைவன் முதலாம் குலோத்துங்கன்; தளபதி கருணாகரத் தொண்டைமான்.</li><li>பரணி – 96 சிற்றிலக்கியங்களுள் ஒன்று; ஆயிரம் யானைகளை வென்ற வீரனைப் பாடுவது.</li><li>சொற்பொருள்: மறலி – காலன்; கரி, வேழம் – யானை; பிலம் – மலைக்குகை; தூறு – புதர்; மண்டுதல் – நெருங்குதல்; முழை – குகை.</li></ul>"},{"t":"விடுதலைத் திருநாள் – மீரா","html":"<ul><li>இயற்பெயர் மீ. இராசேந்திரன்; சிவகங்கை; அன்னம் பதிப்பகம்; நூல்கள்: கனவுகள்+கற்பனைகள்=காகிதங்கள், ஊசிகள்.</li></ul>"},{"t":"எம்.ஜி. இராமச்சந்திரன்","html":"<ul><li>17.01.1917, கண்டி (இலங்கை); தந்தை கோபாலமேனன், தாய் சத்தியபாமா; அ.தி.மு.க. (1972); முதலமைச்சர் 1977–1987; பாரத ரத்னா 1988; மறைவு 24.12.1987.</li><li>சத்துணவுத் திட்டம்; தமிழ்ப் பல்கலைக்கழகம் (தஞ்சை, 1981).</li></ul>"},{"t":"அறிவுசால் ஔவையார்","html":"<ul><li>நூல்கள்: ஆத்திசூடி (109 தொடர்), கொன்றை வேந்தன், மூதுரை (31), நல்வழி (40).</li><li>அதியமான் நெல்லிக்கனி தந்தான்; தொண்டைமானிடம் தூது சென்றவர்.</li></ul>"},{"t":"வல்லினம் மிகும் / மிகா இடங்கள்","html":"<ul><li>மிகும்: அந்தப் பையன், எந்தக் கதை, இப்படிச் செய், பாடத்தைப் படி, ஊருக்குச் செல்.</li><li>மிகா: எழுவாய்த்தொடர், விளித்தொடர், வினைத்தொகை, உம்மைத்தொகை, வியங்கோள், அது/இது/எது.</li></ul>"}]},{"id":"i8","name":"இயல் 8 – அறத்தால் வருவதே இன்பம்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: ஒன்றே குலம், மெய்ஞ்ஞான ஒளி</li><li>உரைநடை: அயோத்திதாசர் சிந்தனைகள்</li><li>துணைப்பாடம்: மனித யந்திரம்</li><li>இலக்கணம்: யாப்பு இலக்கணம்</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"ஒன்றே குலம் – திருமந்திரம்","html":"<ul><li>திருமூலர்; 10ஆம் திருமுறை; 3000 பாடல்; ஒன்பது தந்திரம்; மூவாயிரம் தமிழ்; “ஒன்றே குலம் ஒருவனே தேவன்”.</li></ul>"},{"t":"அயோத்திதாசர் சிந்தனைகள்","html":"<ul><li>இயற்பெயர் காத்தவராயன்; 1845–1914; ‘ஒருபைசாத் தமிழன்’ இதழ் (1907); சாக்கிய பௌத்த சங்கம்; பௌத்தம் தழுவினார்.</li></ul>"},{"t":"யாப்பு இலக்கணம்","html":"<ul><li>உறுப்புகள் 6: எழுத்து, அசை, சீர், தளை, அடி, தொடை; அசை: நேர், நிரை.</li><li>அடி 5: குறளடி (2 சீர்), சிந்தடி (3), அளவடி (4), நெடிலடி (5), கழிநெடிலடி (5க்கு மேல்).</li><li>பா 4: வெண்பா (செப்பலோசை), ஆசிரியப்பா (அகவல்), கலிப்பா (துள்ளல்), வஞ்சிப்பா (தூங்கல்); பாவினம் 3; தளை 7; தொடை 8.</li></ul>"}]},{"id":"i9","name":"இயல் 9 – குன்றென நிமிர்ந்துநில்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: உயிர்க்குணங்கள், இளைய தோழனுக்கு</li><li>உரைநடை: சட்டமேதை அம்பேத்கர்</li><li>துணைப்பாடம்: பால் மனம்</li><li>இலக்கணம்: அணி இலக்கணம்</li></ul>"},{"t":"உயிர்க்குணங்கள் – கன்னிப்பாவை","html":"<ul><li>ஆண்டாளின் திருப்பாவையைத் தழுவி எழுதப்பட்ட கன்னிப்பாவை நூலிலிருந்து.</li></ul>"},{"t":"இளைய தோழனுக்கு – மு. மேத்தா","html":"<ul><li>கல்லூரிப் பேராசிரியர்; நூல்கள்: கண்ணீர்ப் பூக்கள், ஊர்வலம், சோழநிலா, மகுடநிலா, ஆகாயத்துக்கு அடுத்த வீடு.</li></ul>"},{"t":"சட்டமேதை அம்பேத்கர்","html":"<ul><li>14.04.1891, மோவ் (ம.பி.); மறைவு 06.12.1956; அரசமைப்பு வரைவுக் குழுத் தலைவர்; முதல் சட்ட அமைச்சர்; ‘மூக் நாயக்’ இதழ்; பௌத்தம் 1956; பாரத ரத்னா 1990.</li></ul>"},{"t":"அணி இலக்கணம்","html":"<ul><li>உவமை (உவமானம், உவமேயம், உவம உருபு, பொதுத்தன்மை); உருவகம்; தற்குறிப்பேற்றம்; வேற்றுமை; பிறிதுமொழிதல்; சிலேடை; வஞ்சப்புகழ்ச்சி.</li><li>உவம உருபுகள்: போல, போன்ற, புரைய, ஒப்ப, அன்ன.</li></ul>"}]}];

const QUIZ = [{"q":"தமிழ்மொழி வாழ்த்துப் பாடலின் ஆசிரியர்?","o":["பாரதிதாசன்","பாரதியார்","வாணிதாசன்","மீரா"],"a":1},{"q":"“ஓடை” பாடலின் ஆசிரியர்?","o":["வாணிதாசன்","மு. மேத்தா","சுந்தரர்","செயங்கொண்டார்"],"a":0},{"q":"கலிங்கத்துப்பரணியின் ஆசிரியர்?","o":["கம்பர்","ஒட்டக்கூத்தர்","செயங்கொண்டார்","சேக்கிழார்"],"a":2},{"q":"தேவாரத்தைத் தொகுத்தவர்?","o":["சேக்கிழார்","நம்பியாண்டார் நம்பி","திருமூலர்","ஆண்டாள்"],"a":1},{"q":"எம்.ஜி.ஆருக்குப் பாரத ரத்னா வழங்கப்பட்ட ஆண்டு?","o":["1977","1982","1988","1990"],"a":2}];

},{"n":25,"c":"இயல் 1","q":"எகர, ஒகரக் குறில்களை நெடில்களிலிருந்து வேறுபடுத்தியவர்?","a":"வீரமாமுனிவர்"},{"n":26,"c":"இயல் 1","q":"தமிழ் எழுத்துச் சீர்திருத்தத்தை வலியுறுத்தியவர்?","a":"தந்தை பெரியார்"},{"n":27,"c":"இயல் 1","q":"எழுத்துச் சீர்திருத்தத்தைத் தமிழக அரசு ஏற்ற ஆண்டு?","a":"1978"},{"n":28,"c":"இயல் 1","q":"பழங்காலத்தில் எழுதப் பயன்பட்ட பொருள்கள் மூன்று?","a":"கல், செப்பேடு, ஓலைச்சுவடி"},{"n":29,"c":"இயல் 1","q":"ஓலையில் எழுதப் பயன்படும் கருவி?","a":"எழுத்தாணி"},{"n":30,"c":"இயல் 1","q":"தொல்காப்பியம் கூறும் எழுத்துகள் எத்தனை?","a":"30 (முப்பது)"},{"n":31,"c":"இயல் 1","q":"எழுத்தொலிகள் பிறக்கும் இடங்கள் எத்தனை?","a":"எட்டு"},{"n":32,"c":"இயல் 1","q":"எழுத்தொலிகள் பிறக்கும் எட்டு இடங்கள் யாவை?","a":"மார்பு, கழுத்து, தலை, மூக்கு, பல், இதழ், நா, அண்ணம்"},{"n":33,"c":"இயல் 1","q":"எழுத்துகளின் பிறப்பு எத்தனை வகைப்படும்?","a":"2 (இடப்பிறப்பு, முயற்சிப் பிறப்பு)"},{"n":34,"c":"இயல் 1","q":"‘அ, ஆ’ ஒலிக்கும்போது வாயின் நிலை?","a":"வாய் திறத்தல் (அங்காப்பு)"},{"n":35,"c":"இயல் 1","q":"‘உ, ஊ, ஒ, ஓ, ஔ’ ஒலிக்கும்போது?","a":"இதழ் குவிதல்"},{"n":36,"c":"இயல் 1","q":"எழுத்துகளின் பிறப்பைக் கூறும் இலக்கண நூல்கள் இரண்டு?","a":"தொல்காப்பியம், நன்னூல்"},{"n":37,"c":"இயல் 1","q":"நன்னூலின் ஆசிரியர்?","a":"பவணந்தி முனிவர்"},{"n":38,"c":"இயல் 1","q":"தொல்காப்பியத்தின் ஆசிரியர்?","a":"தொல்காப்பியர்"},{"n":39,"c":"இயல் 1","q":"உயிரெழுத்துகள் எத்தனை?","a":"12"},{"n":40,"c":"இயல் 1","q":"மெய்யெழுத்துகள் எத்தனை?","a":"18"},{"n":41,"c":"இயல் 1","q":"முதலெழுத்துகள் எத்தனை?","a":"30"},{"n":42,"c":"இயல் 1","q":"தமிழ் எழுத்துகளின் மொத்த எண்ணிக்கை?","a":"247"},{"n":43,"c":"இயல் 2","q":"8ஆம் வகுப்பு இயல் 2-இன் தலைப்பு?","a":"ஈடில்லா இயற்கை"},{"n":44,"c":"இயல் 2","q":"இயல் 2-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"ஓடை, கோணக்காத்துப் பாட்டு"},{"n":45,"c":"இயல் 2","q":"இயல் 2-இன் உரைநடைப் பாடம்?","a":"நிலம் பொது"},{"n":46,"c":"இயல் 2","q":"இயல் 2-இன் துணைப்பாடம்?","a":"வெட்டுக்கிளியும் சருகுமானும்"},{"n":47,"c":"இயல் 2","q":"இயல் 2-இன் இலக்கணப் பகுதி?","a":"வினைமுற்று"},{"n":48,"c":"இயல் 2","q":"இயல் 2-இன் வாழ்வியல் பகுதி?","a":"திருக்குறள்"},{"n":49,"c":"இயல் 2","q":"“ஓடை” பாடலின் ஆசிரியர்?","a":"வாணிதாசன்"},{"n":50,"c":"இயல் 2","q":"வாணிதாசனின் இயற்பெயர்?","a":"அரங்கசாமி"},{"n":51,"c":"இயல் 2","q":"வாணிதாசன் பிறந்த ஊர்?","a":"புதுவை வில்லியனூர்"},{"n":52,"c":"இயல் 2","q":"வாணிதாசன் யாரின் மாணவர்?","a":"பாரதிதாசன்"},{"n":53,"c":"இயல் 2","q":"வாணிதாசனுக்கு வழங்கும் சிறப்புப் பெயர்?","a":"தமிழ்நாட்டு வோர்ட்ஸ்வொர்த்"},{"n":54,"c":"இயல் 2","q":"வாணிதாசன் பெற்ற பட்டம்?","a":"பாவலர்மணி"},{"n":55,"c":"இயல் 2","q":"வாணிதாசனின் நூல்கள் மூன்று?","a":"தொடுவானம், எழிலோவியம், கொடிமுல்லை"},{"n":56,"c":"இயல் 2","q":"“கோணக்காத்துப் பாட்டு” எவ்வகைப் பாடல்?","a":"நாட்டுப்புறப் பாடல் (கும்மிப் பாடல்)"},{"n":57,"c":"இயல் 2","q":"கோணக்காத்துப் பாட்டின் ஆசிரியர்?","a":"வெங்கம்பூர் சாமிநாதன்"},{"n":58,"c":"இயல் 2","q":"“கோணக்காத்து” என்பதன் பொருள்?","a":"சூறைக்காற்று (புயல்)"},{"n":59,"c":"இயல் 2","q":"“நிலம் பொது” பாடத்தில் இடம்பெறும் பழங்குடியினர்?","a":"சுகுவாமிஷ் பழங்குடியினர்"},{"n":60,"c":"இயல் 2","q":"நிலம் பொது பாடத்தில் வரும் பழங்குடித் தலைவர்?","a":"சியாட்டில்"},{"n":61,"c":"இயல் 2","q":"நிலம் பொது பாடத்தின் மையக்கருத்து?","a":"நிலம் அனைத்து உயிர்களுக்கும் பொது"},{"n":62,"c":"இயல் 2","q":"வினைமுற்று எத்தனை வகைப்படும்?","a":"தெரிநிலை வினைமுற்று, குறிப்பு வினைமுற்று"},{"n":63,"c":"இயல் 2","q":"தெரிநிலை வினைமுற்றில் வெளிப்படும் கூறுகள் எத்தனை?","a":"6"},{"n":64,"c":"இயல் 2","q":"தெரிநிலை வினைமுற்றின் ஆறு கூறுகள்?","a":"செய்பவன், கருவி, நிலம், செயல், காலம், செய்பொருள்"},{"n":65,"c":"இயல் 2","q":"“படித்தான்” – எவ்வகை வினைமுற்று?","a":"தெரிநிலை வினைமுற்று"},{"n":66,"c":"இயல் 2","q":"“நல்லன்” – எவ்வகை வினைமுற்று?","a":"குறிப்பு வினைமுற்று"},{"n":67,"c":"இயல் 2","q":"“வாழ்க” – எவ்வகை வினைமுற்று?","a":"வியங்கோள் வினைமுற்று"},{"n":68,"c":"இயல் 2","q":"“வா”, “நட” – எவ்வகை வினைமுற்று?","a":"ஏவல் வினைமுற்று"},{"n":69,"c":"இயல் 2","q":"காலம் காட்டாது பண்பு முதலியவற்றால் வினை முடிப்பது?","a":"குறிப்பு வினைமுற்று"},{"n":70,"c":"இயல் 2","q":"வினைமுற்றின் ஈற்றில் வரும் உறுப்பு?","a":"விகுதி"},{"n":71,"c":"இயல் 2","q":"“கண்டான்” – இறந்த காலத்தைக் காட்டும் இடைநிலை?","a":"ட்"},{"n":72,"c":"இயல் 2","q":"“செல்கிறான்” – நிகழ்கால இடைநிலை?","a":"கிறு"},{"n":73,"c":"இயல் 2","q":"“பாடுவாள்” – எதிர்கால இடைநிலை?","a":"வ்"},{"n":74,"c":"இயல் 3","q":"8ஆம் வகுப்பு இயல் 3-இன் தலைப்பு?","a":"உடலை ஓம்புமின்"},{"n":75,"c":"இயல் 3","q":"இயல் 3-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"நோயும் மருந்தும், வருமுன் காப்போம்"},{"n":76,"c":"இயல் 3","q":"இயல் 3-இன் உரைநடைப் பாடம்?","a":"தமிழர் மருத்துவம்"},{"n":77,"c":"இயல் 3","q":"இயல் 3-இன் துணைப்பாடம்?","a":"தலைக்குள் ஓர் உலகம்"},{"n":78,"c":"இயல் 3","q":"இயல் 3-இன் இலக்கணப் பகுதி?","a":"எச்சம்"},{"n":79,"c":"இயல் 3","q":"தமிழர் மருத்துவம் எனப்படுவது?","a":"சித்த மருத்துவம்"},{"n":80,"c":"இயல் 3","q":"சித்த மருத்துவத்தின் மூன்று குற்றங்கள் (முக்குற்றம்)?","a":"வாதம், பித்தம், கபம்"},{"n":81,"c":"இயல் 3","q":"சித்த மருத்துவத்தோடு தொடர்புடைய சித்தர்கள் இருவர்?","a":"அகத்தியர், தேரையர்"},{"n":82,"c":"இயல் 3","q":"உடலைக் காக்கும் உணவே மருந்தாக அமைவதைக் குறிக்கும் தொடர்?","a":"உணவே மருந்து"},{"n":83,"c":"இயல் 3","q":"திருக்குறளில் மருத்துவம் பற்றிய அதிகாரம்?","a":"மருந்து (95ஆம் அதிகாரம்)"},{"n":84,"c":"இயல் 3","q":"திருக்குறள் ‘மருந்து’ அதிகாரம் எப்பாலில் உள்ளது?","a":"பொருட்பால் (அங்கவியல்)"},{"n":85,"c":"இயல் 3","q":"நோய் வராமல் தடுத்தல் எவ்வாறு அழைக்கப்படும்?","a":"வருமுன் காத்தல்"},{"n":86,"c":"இயல் 3","q":"எச்சம் எத்தனை வகைப்படும்?","a":"2 (பெயரெச்சம், வினையெச்சம்)"},{"n":87,"c":"இயல் 3","q":"பெயரெச்சம் என்றால் என்ன?","a":"பெயரைக் கொண்டு முடியும் முற்றுப்பெறாத வினை"},{"n":88,"c":"இயல் 3","q":"வினையெச்சம் என்றால் என்ன?","a":"வினையைக் கொண்டு முடியும் முற்றுப்பெறாத வினை"},{"n":89,"c":"இயல் 3","q":"“படித்த மாணவன்” – இதில் எச்சம்?","a":"பெயரெச்சம் (படித்த)"},{"n":90,"c":"இயல் 3","q":"“படித்துச் சென்றான்” – இதில் எச்சம்?","a":"வினையெச்சம் (படித்து)"},{"n":91,"c":"இயல் 3","q":"காலம் காட்டும் பெயரெச்சம்?","a":"தெரிநிலைப் பெயரெச்சம்"},{"n":92,"c":"இயல் 3","q":"காலம் காட்டாத பெயரெச்சம்?","a":"குறிப்புப் பெயரெச்சம் (எ.கா: நல்ல, பெரிய)"},{"n":93,"c":"இயல் 3","q":"“பெரிய” என்பது எவ்வகைப் பெயரெச்சம்?","a":"குறிப்புப் பெயரெச்சம்"},{"n":94,"c":"இயல் 3","q":"“ஓடிய குதிரை” – எவ்வகை எச்சம்?","a":"தெரிநிலைப் பெயரெச்சம் (இறந்தகாலம்)"},{"n":95,"c":"இயல் 3","q":"“பாடும் பறவை” – எவ்வகைக் காலம்?","a":"நிகழ்கால / எதிர்காலப் பெயரெச்சம்"},{"n":96,"c":"இயல் 4","q":"8ஆம் வகுப்பு இயல் 4-இன் தலைப்பு?","a":"கல்வி கரையில்"},{"n":97,"c":"இயல் 4","q":"இயல் 4-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"கல்வி அழகே அழகு, புத்தியைத் தீட்டு"},{"n":98,"c":"இயல் 4","q":"இயல் 4-இன் உரைநடைப் பாடம்?","a":"பல்துறைக் கல்வி"},{"n":99,"c":"இயல் 4","q":"இயல் 4-இன் துணைப்பாடம்?","a":"ஆன்ற குடிப்பிறத்தல்"},{"n":100,"c":"இயல் 4","q":"இயல் 4-இன் இலக்கணப் பகுதி?","a":"வேற்றுமை"},{"n":101,"c":"இயல் 4","q":"“கல்வி அழகே அழகு” என்னும் தொடர் இடம்பெறும் நூல்?","a":"நாலடியார்"},{"n":102,"c":"இயல் 4","q":"நாலடியார் எச்சமயத்தாரால் பாடப்பட்டது?","a":"சமண முனிவர்களால்"},{"n":103,"c":"இயல் 4","q":"நாலடியாரின் பாவகை?","a":"வெண்பா"},{"n":104,"c":"இயல் 4","q":"நாலடியார் எந்தத் தொகுப்பைச் சேர்ந்தது?","a":"பதினெண்கீழ்க்கணக்கு"},{"n":105,"c":"இயல் 4","q":"நாலடியாரில் உள்ள பாடல்கள் எத்தனை?","a":"400"},{"n":106,"c":"இயல் 4","q":"நாலடியாருக்கு வழங்கும் வேறு பெயர்?","a":"வேளாண் வேதம்"},{"n":107,"c":"இயல் 4","q":"“நாலும் இரண்டும் சொல்லுக்கு உறுதி” – நாலும் இரண்டும் எவை?","a":"நாலடியார், திருக்குறள்"},{"n":108,"c":"இயல் 4","q":"“கல்வி கரையில, கற்பவர் நாள் சில” என்னும் கருத்தைக் கூறும் நூல்?","a":"நாலடியார்"},{"n":109,"c":"இயல் 4","q":"கல்வியின் சிறப்பைக் கூறும் திருக்குறள் அதிகாரம்?","a":"கல்வி (40ஆம் அதிகாரம்)"},{"n":110,"c":"இயல் 4","q":"கற்றலின் இன்றியமையாமையை வலியுறுத்தும் ஔவையார் தொடர்?","a":"கற்றது கைம்மண் அளவு"},{"n":111,"c":"இயல் 4","q":"கல்வி எவ்வாறு அழைக்கப்படுகிறது? (அழிவற்ற செல்வம்)","a":"கேடில் விழுச்செல்வம்"},{"n":112,"c":"இயல் 4","q":"வேற்றுமை எத்தனை வகைப்படும்?","a":"8"},{"n":113,"c":"இயல் 4","q":"முதல் வேற்றுமையின் பெயர்?","a":"எழுவாய் (பெயர்) வேற்றுமை"},{"n":114,"c":"இயல் 4","q":"இரண்டாம் வேற்றுமை உருபு?","a":"ஐ"},{"n":115,"c":"இயல் 4","q":"மூன்றாம் வேற்றுமை உருபுகள்?","a":"ஆல், ஆன், ஓடு, ஒடு"},{"n":116,"c":"இயல் 4","q":"நான்காம் வேற்றுமை உருபு?","a":"கு"},{"n":117,"c":"இயல் 4","q":"ஐந்தாம் வேற்றுமை உருபுகள்?","a":"இன், இல்"},{"n":118,"c":"இயல் 4","q":"ஆறாம் வேற்றுமை உருபுகள்?","a":"அது, அ"},{"n":119,"c":"இயல் 4","q":"ஏழாம் வேற்றுமை உருபுகள்?","a":"கண், இல், இடம் முதலியன"},{"n":120,"c":"இயல் 4","q":"எட்டாம் வேற்றுமை?","a":"விளி வேற்றுமை"},{"n":121,"c":"இயல் 4","q":"“கண்ணனைக் கண்டேன்” – வேற்றுமை?","a":"இரண்டாம் வேற்றுமை (ஐ)"},{"n":122,"c":"இயல் 4","q":"“வாளால் வெட்டினான்” – வேற்றுமை?","a":"மூன்றாம் வேற்றுமை (ஆல்)"},{"n":123,"c":"இயல் 4","q":"“தம்பிக்குக் கொடுத்தான்” – வேற்றுமை?","a":"நான்காம் வேற்றுமை (கு)"},{"n":124,"c":"இயல் 4","q":"“மலையின் வீழ் அருவி” – வேற்றுமை?","a":"ஐந்தாம் வேற்றுமை (இன்)"},{"n":125,"c":"இயல் 4","q":"“கண்ணனது புத்தகம்” – வேற்றுமை?","a":"ஆறாம் வேற்றுமை (அது)"},{"n":126,"c":"இயல் 4","q":"“மலைக்கண் வாழ்ந்தான்” – வேற்றுமை?","a":"ஏழாம் வேற்றுமை (கண்)"},{"n":127,"c":"இயல் 4","q":"“தம்பி வா” – வேற்றுமை?","a":"எட்டாம் வேற்றுமை (விளி)"},{"n":128,"c":"இயல் 4","q":"இரண்டாம் வேற்றுமையின் பொருள்?","a":"செயப்படுபொருள்"},{"n":129,"c":"இயல் 4","q":"மூன்றாம் வேற்றுமையின் பொருள்?","a":"கருவி, கருத்தா"},{"n":130,"c":"இயல் 4","q":"நான்காம் வேற்றுமையின் பொருள்?","a":"கொடை, பகை, நேர்ச்சி, தகுதி"},{"n":131,"c":"இயல் 4","q":"ஆறாம் வேற்றுமையின் பொருள்?","a":"உடைமை"},{"n":132,"c":"இயல் 4","q":"ஏழாம் வேற்றுமையின் பொருள்?","a":"இடம்"},{"n":133,"c":"இயல் 4","q":"வேற்றுமை உருபுகள் மறைந்து நின்று பொருள் தருவது?","a":"வேற்றுமைத் தொகை"},{"n":134,"c":"இயல் 5","q":"8ஆம் வகுப்பு இயல் 5-இன் தலைப்பு?","a":"குழலினிது யாழினிது"},{"n":135,"c":"இயல் 5","q":"இயல் 5-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"திருக்கேதாரம், பாடறிந்து ஒழுகுதல்"},{"n":136,"c":"இயல் 5","q":"இயல் 5-இன் உரைநடைப் பாடம்?","a":"நாட்டுப்புறக் கைவினைக்கலைகள்"},{"n":137,"c":"இயல் 5","q":"இயல் 5-இன் துணைப்பாடம்?","a":"தமிழர் இசைக்கருவிகள்"},{"n":138,"c":"இயல் 5","q":"இயல் 5-இன் இலக்கணப் பகுதி?","a":"தொகைநிலை, தொகாநிலைத் தொடர்கள்"},{"n":139,"c":"இயல் 5","q":"திருக்கேதாரம் பாடலின் ஆசிரியர்?","a":"சுந்தரர்"},{"n":140,"c":"இயல் 5","q":"சுந்தரர் பாடிய பாடல்கள் எத்தனையாவது திருமுறை?","a":"7ஆம் திருமுறை"},{"n":141,"c":"இயல் 5","q":"சுந்தரரின் இயற்பெயர்?","a":"நம்பியாரூரர்"},{"n":142,"c":"இயல் 5","q":"சுந்தரர் பிறந்த ஊர்?","a":"திருநாவலூர்"},{"n":143,"c":"இயல் 5","q":"சுந்தரருக்கு வழங்கும் சிறப்புப் பெயர்?","a":"தம்பிரான் தோழர்"},{"n":144,"c":"இயல் 5","q":"தேவாரம் பாடிய மூவர் யாவர்?","a":"திருஞானசம்பந்தர், திருநாவுக்கரசர், சுந்தரர்"},{"n":145,"c":"இயல் 5","q":"திருஞானசம்பந்தர் பாடியவை எத்தனையாவது திருமுறைகள்?","a":"1, 2, 3"},{"n":146,"c":"இயல் 5","q":"திருநாவுக்கரசர் பாடியவை எத்தனையாவது திருமுறைகள்?","a":"4, 5, 6"},{"n":147,"c":"இயல் 5","q":"திருநாவுக்கரசரின் இயற்பெயர்?","a":"மருள்நீக்கியார்"},{"n":148,"c":"இயல் 5","q":"திருநாவுக்கரசரின் சிறப்புப் பெயர்கள் மூன்று?","a":"அப்பர், வாகீசர், தாண்டக வேந்தர் (ஆளுடைய அரசு, தருமசேனர்)"},{"n":149,"c":"இயல் 5","q":"திருநாவுக்கரசர் பிறந்த ஊர்?","a":"திருவாமூர்"},{"n":150,"c":"இயல் 5","q":"திருஞானசம்பந்தர் பிறந்த ஊர்?","a":"சீர்காழி"},{"n":151,"c":"இயல் 5","q":"தேவாரத்தைத் தொகுத்தவர்?","a":"நம்பியாண்டார் நம்பி"},{"n":152,"c":"இயல் 5","q":"பதிகம் என்பது எத்தனை பாடல்களைக் கொண்டது?","a":"பத்து"},{"n":153,"c":"இயல் 5","q":"தேவாரம் – பெயர்க்காரணம் (தே + ஆரம்) என்பதன் பொருள்?","a":"இறைவனுக்குச் சூட்டப்படும் மாலை"},{"n":154,"c":"இயல் 5","q":"தேவாரம் – பெயர்க்காரணம் (தே + வாரம்) என்பதன் பொருள்?","a":"இனிய இசை பொருந்திய பாடல்"},{"n":155,"c":"இயல் 5","q":"திருக்கேதாரம் எங்குள்ள சிவத்தலம்?","a":"இமயமலைப் பகுதி"},{"n":156,"c":"இயல் 5","q":"பன்னிரு திருமுறைகளில் தேவாரம் எத்தனை திருமுறைகள்?","a":"7 (1–7)"},{"n":157,"c":"இயல் 5","q":"“பாடறிந்து ஒழுகுதல்” பாடல் இடம்பெறும் நூல்?","a":"கலித்தொகை"},{"n":158,"c":"இயல் 5","q":"கலித்தொகை எத்தனை பாடல்களைக் கொண்டது?","a":"150"},{"n":159,"c":"இயல் 5","q":"கலித்தொகை எந்தப் பாவகையால் ஆனது?","a":"கலிப்பா"},{"n":160,"c":"இயல் 5","q":"கலித்தொகையைத் தொகுத்தவர்?","a":"நல்லந்துவனார்"},{"n":161,"c":"இயல் 5","q":"‘பாடறிந்து ஒழுகுதல்’ என்பதன் பொருள்?","a":"பிறர் தேவை அறிந்து நடத்தல்"},{"n":162,"c":"இயல் 5","q":"பத்தமடை எதற்குப் புகழ்பெற்றது?","a":"பாய்"},{"n":163,"c":"இயல் 5","q":"காஞ்சிபுரம் எதற்குப் புகழ்பெற்றது?","a":"பட்டு"},{"n":164,"c":"இயல் 5","q":"தஞ்சாவூர் எவ்வகைக் கைவினைக்குப் புகழ்பெற்றது?","a":"தலையாட்டி பொம்மை, தட்டு"},{"n":165,"c":"இயல் 5","q":"பனை ஓலையால் செய்யப்படும் கைவினைப் பொருள்கள் இரண்டு?","a":"கூடை, விசிறி (பெட்டி)"},{"n":166,"c":"இயல் 5","q":"மண்ணால் செய்யப்படும் கைவினை?","a":"மண்பாண்டம்"},{"n":167,"c":"இயல் 5","q":"கோரைப் புல்லால் நெய்யப்படுவது?","a":"கோரைப் பாய்"},{"n":168,"c":"இயல் 5","q":"தமிழர் இசைக்கருவிகள் எத்தனை வகைப்படும்?","a":"4"},{"n":169,"c":"இயல் 5","q":"தமிழர் இசைக்கருவிகளின் நான்கு வகைகள்?","a":"தோற்கருவி, துளைக்கருவி, நரம்புக்கருவி, கஞ்சக்கருவி"},{"n":170,"c":"இயல் 5","q":"தோற்கருவிகளுக்கு எடுத்துக்காட்டு?","a":"பறை, முழவு, தவில், மத்தளம்"},{"n":171,"c":"இயல் 5","q":"துளைக்கருவிகளுக்கு எடுத்துக்காட்டு?","a":"குழல், நாதசுவரம், புல்லாங்குழல்"},{"n":172,"c":"இயல் 5","q":"நரம்புக்கருவிகளுக்கு எடுத்துக்காட்டு?","a":"யாழ், வீணை"},{"n":173,"c":"இயல் 5","q":"கஞ்சக்கருவிகளுக்கு எடுத்துக்காட்டு?","a":"தாளம், சேமக்கலம்"},{"n":174,"c":"இயல் 5","q":"யாழ் வகைகள் நான்கு?","a":"பேரியாழ், சீறியாழ், மகரயாழ், சகோடயாழ்"},{"n":175,"c":"இயல் 5","q":"“குழலினிது யாழினிது என்பர்” எனத் தொடங்கும் குறள் எந்த அதிகாரம்?","a":"மக்கட்பேறு (66ஆம் குறள்)"},{"n":176,"c":"இயல் 5","q":"தொகைநிலைத் தொடர்கள் எத்தனை?","a":"6"},{"n":177,"c":"இயல் 5","q":"தொகாநிலைத் தொடர்கள் எத்தனை?","a":"9"},{"n":178,"c":"இயல் 5","q":"தொகைநிலைத் தொடர்கள் யாவை?","a":"வேற்றுமைத்தொகை, வினைத்தொகை, பண்புத்தொகை, உவமைத்தொகை, உம்மைத்தொகை, அன்மொழித்தொகை"},{"n":179,"c":"இயல் 5","q":"தொகாநிலைத் தொடர்கள் யாவை?","a":"எழுவாய், விளி, வினைமுற்று, பெயரெச்சம், வினையெச்சம், வேற்றுமை, இடைச்சொல், உரிச்சொல், அடுக்கு"},{"n":180,"c":"இயல் 5","q":"“கண்ணன் வந்தான்” – தொடர் வகை?","a":"எழுவாய்த் தொடர்"},{"n":181,"c":"இயல் 5","q":"“கண்ணா வா” – தொடர் வகை?","a":"விளித்தொடர்"},{"n":182,"c":"இயல் 5","q":"“வந்த கண்ணன்” – தொடர் வகை?","a":"பெயரெச்சத் தொடர்"},{"n":183,"c":"இயல் 5","q":"“வந்து போனான்” – தொடர் வகை?","a":"வினையெச்சத் தொடர்"},{"n":184,"c":"இயல் 5","q":"“பாம்பு பாம்பு” – தொடர் வகை?","a":"அடுக்குத் தொடர்"},{"n":185,"c":"இயல் 5","q":"“மாநகர்” – தொடர் வகை?","a":"உரிச்சொல் தொடர்"},{"n":186,"c":"இயல் 5","q":"“செந்தாமரை” – தொகை வகை?","a":"பண்புத்தொகை"},{"n":187,"c":"இயல் 5","q":"“ஊறுகாய்” – தொகை வகை?","a":"வினைத்தொகை"},{"n":188,"c":"இயல் 5","q":"“மதிமுகம்” – தொகை வகை?","a":"உவமைத்தொகை"},{"n":189,"c":"இயல் 5","q":"“இரவு பகல்” – தொகை வகை?","a":"உம்மைத்தொகை"},{"n":190,"c":"இயல் 5","q":"“தமிழ்ப்பற்று” (தமிழின்கண் பற்று) – தொகை வகை?","a":"வேற்றுமைத்தொகை"},{"n":191,"c":"இயல் 6","q":"8ஆம் வகுப்பு இயல் 6-இன் தலைப்பு?","a":"வையம்புகழ் வணிகம்"},{"n":192,"c":"இயல் 6","q":"இயல் 6-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"வளம் பெருகுக, மழைச்சோறு"},{"n":193,"c":"இயல் 6","q":"இயல் 6-இன் உரைநடைப் பாடம்?","a":"கொங்குநாட்டு வணிகம்"},{"n":194,"c":"இயல் 6","q":"இயல் 6-இன் துணைப்பாடம்?","a":"காலம் உடன் வரும்"},{"n":195,"c":"இயல் 6","q":"இயல் 6-இன் இலக்கணப் பகுதி?","a":"புணர்ச்சி"},{"n":196,"c":"இயல் 6","q":"“மழைச்சோறு” பாடல் எந்நூலிலுள்ள கட்டுரையிலிருந்து எடுக்கப்பட்டது?","a":"பழந்தமிழர் வழிபாட்டு மரபுகள் (கொங்குநாட்டு மழைச்சோற்று வழிபாடு)"},{"n":197,"c":"இயல் 6","q":"மழைச்சோறு எதற்காக நடத்தப்படும் வழிபாடு?","a":"மழை வேண்டி"},{"n":198,"c":"இயல் 6","q":"நாட்டின் வளத்திற்கு அடிப்படையாக விளங்குவது?","a":"மழை"},{"n":199,"c":"இயல் 6","q":"கொடுமணம் எந்த ஆற்றங்கரையில் உள்ளது?","a":"நொய்யல்"},{"n":200,"c":"இயல் 6","q":"கொடுமணம் எம்மாவட்டத்தில் உள்ளது?","a":"ஈரோடு"},{"n":201,"c":"இயல் 6","q":"பண்டைக் காலத்தில் பொருள்களை மாற்றிக் கொள்ளும் முறை?","a":"பண்டமாற்று"},{"n":202,"c":"இயல் 6","q":"உப்பு வணிகர்களைக் குறிக்கும் சங்க காலச் சொல்?","a":"உமணர்"},{"n":203,"c":"இயல் 6","q":"பழங்கால வணிகக் குழுக்கள் இரண்டு?","a":"நானாதேசிகள், ஐநூற்றுவர்"},{"n":204,"c":"இயல் 6","q":"கொங்கு நாட்டின் நகரங்கள் இரண்டு?","a":"கோயம்புத்தூர், ஈரோடு"},{"n":205,"c":"இயல் 6","q":"புணர்ச்சி என்றால் என்ன?","a":"இரு சொற்கள் இணைதல்"},{"n":206,"c":"இயல் 6","q":"புணர்ச்சியில் முதலில் நிற்கும் சொல்?","a":"நிலைமொழி"},{"n":207,"c":"இயல் 6","q":"புணர்ச்சியில் பின்வரும் சொல்?","a":"வருமொழி"},{"n":208,"c":"இயல் 6","q":"புணர்ச்சி எத்தனை வகை?","a":"2 (இயல்பு, விகாரம்)"},{"n":209,"c":"இயல் 6","q":"விகாரப் புணர்ச்சி வகைகள் மூன்று?","a":"தோன்றல், திரிதல், கெடுதல்"},{"n":210,"c":"இயல் 6","q":"“பூ + கொடி” – புணர்ந்தால்?","a":"பூங்கொடி (தோன்றல்)"},{"n":211,"c":"இயல் 6","q":"“பொன் + குடம்” – புணர்ந்தால்?","a":"பொற்குடம் (திரிதல்)"},{"n":212,"c":"இயல் 6","q":"“மரம் + வேர்” – புணர்ந்தால்?","a":"மரவேர் (கெடுதல்)"},{"n":213,"c":"இயல் 6","q":"“திரு + அடி” – புணர்ந்தால்?","a":"திருவடி (வ் – உடம்படுமெய்)"},{"n":214,"c":"இயல் 6","q":"“மணி + அடி” – புணர்ந்தால்?","a":"மணியடி (ய் – உடம்படுமெய்)"},{"n":215,"c":"இயல் 6","q":"உடம்படுமெய் எவை?","a":"ய், வ்"},{"n":216,"c":"இயல் 7","q":"8ஆம் வகுப்பு இயல் 7-இன் தலைப்பு?","a":"பாருக்குள்ளே நல்ல நாடு"},{"n":217,"c":"இயல் 7","q":"இயல் 7-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"படை வேழம், விடுதலைத் திருநாள்"},{"n":218,"c":"இயல் 7","q":"இயல் 7-இன் உரைநடைப் பாடம்?","a":"பாரத ரத்னா எம்.ஜி. இராமச்சந்திரன்"},{"n":219,"c":"இயல் 7","q":"இயல் 7-இன் துணைப்பாடம்?","a":"அறிவுசால் ஔவையார்"},{"n":220,"c":"இயல் 7","q":"இயல் 7-இன் இலக்கணப் பகுதி?","a":"வல்லினம் மிகும் இடங்களும் மிகா இடங்களும்"},{"n":221,"c":"இயல் 7","q":"“படை வேழம்” பாடல் இடம்பெறும் நூல்?","a":"கலிங்கத்துப்பரணி"},{"n":222,"c":"இயல் 7","q":"கலிங்கத்துப்பரணியின் ஆசிரியர்?","a":"செயங்கொண்டார்"},{"n":223,"c":"இயல் 7","q":"செயங்கொண்டார் பிறந்த ஊர்?","a":"தீபங்குடி"},{"n":224,"c":"இயல் 7","q":"செயங்கொண்டாருக்கு வழங்கும் பட்டம்?","a":"பரணிக்கோர் செயங்கொண்டார்"},{"n":225,"c":"இயல் 7","q":"கலிங்கத்துப்பரணியின் பாட்டுடைத் தலைவன்?","a":"முதலாம் குலோத்துங்க சோழன்"},{"n":226,"c":"இயல் 7","q":"கலிங்கப் போரில் சோழப் படைத்தளபதி?","a":"கருணாகரத் தொண்டைமான்"},{"n":227,"c":"இயல் 7","q":"பரணி என்பது எத்தனை சிற்றிலக்கிய வகைகளில் ஒன்று?","a":"96 வகைகளில் ஒன்று"},{"n":228,"c":"இயல் 7","q":"பரணி இலக்கியம் யாரைப் பாடுவது?","a":"ஆயிரம் யானைகளைப் போரில் வென்ற வீரனை"},{"n":229,"c":"இயல் 7","q":"பரணி என்ற சொல்லின் ஒரு பொருள்?","a":"ஒரு நட்சத்திரம் (பரணி நாள்)"},{"n":230, ":300,"c":"இயல் 8","q":"நேரசையின் அமைப்பு?","a":"குறில் அல்லது நெடில் தனித்தோ ஒற்றடுத்தோ வருவது"},{"n":301,"c":"இயல் 8","q":"நிரையசையின் அமைப்பு?","a":"இரு குறில் அல்லது குறில்–நெடில் தனித்தோ ஒற்றடுத்தோ வருவது"},{"n":302,"c":"இயல் 8","q":"ஓரசைச் சீர்கள்?","a":"நாள், மலர், காசு, பிறப்பு"},{"n":303,"c":"இயல் 8","q":"ஈரசைச் சீர்கள் எத்தனை?","a":"4 (தேமா, புளிமா, கருவிளம், கூவிளம்)"},{"n":304,"c":"இயல் 8","q":"தளை எத்தனை வகை?","a":"7"},{"n":305,"c":"இயல் 8","q":"அடி எத்தனை வகை?","a":"5"},{"n":306,"c":"இயல் 8","q":"இரு சீர் அடி?","a":"குறளடி"},{"n":307,"c":"இயல் 8","q":"மூன்று சீர் அடி?","a":"சிந்தடி"},{"n":308,"c":"இயல் 8","q":"நான்கு சீர் அடி?","a":"அளவடி"},{"n":309,"c":"இயல் 8","q":"ஐந்து சீர் அடி?","a":"நெடிலடி"},{"n":310,"c":"இயல் 8","q":"ஐந்துக்கு மேற்பட்ட சீர் அடி?","a":"கழிநெடிலடி"},{"n":311,"c":"இயல் 8","q":"தொடை எத்தனை வகை?","a":"8"},{"n":312,"c":"இயல் 8","q":"முதல் எழுத்து ஒன்றி வருவது?","a":"மோனை"},{"n":313,"c":"இயல் 8","q":"இரண்டாம் எழுத்து ஒன்றி வருவது?","a":"எதுகை"},{"n":314,"c":"இயல் 8","q":"இறுதி எழுத்து அல்லது சீர் ஒன்றி வருவது?","a":"இயைபு"},{"n":315,"c":"இயல் 8","q":"பாக்கள் எத்தனை?","a":"4 (வெண்பா, ஆசிரியப்பா, கலிப்பா, வஞ்சிப்பா)"},{"n":316,"c":"இயல் 8","q":"வெண்பாவின் ஓசை?","a":"செப்பலோசை"},{"n":317,"c":"இயல் 8","q":"ஆசிரியப்பாவின் ஓசை?","a":"அகவலோசை"},{"n":318,"c":"இயல் 8","q":"கலிப்பாவின் ஓசை?","a":"துள்ளலோசை"},{"n":319,"c":"இயல் 8","q":"வஞ்சிப்பாவின் ஓசை?","a":"தூங்கலோசை"},{"n":320,"c":"இயல் 8","q":"பாவினங்கள் எத்தனை?","a":"3 (தாழிசை, துறை, விருத்தம்)"},{"n":321,"c":"இயல் 9","q":"8ஆம் வகுப்பு இயல் 9-இன் தலைப்பு?","a":"குன்றென நிமிர்ந்துநில்"},{"n":322,"c":"இயல் 9","q":"இயல் 9-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"உயிர்க்குணங்கள், இளைய தோழனுக்கு"},{"n":323,"c":"இயல் 9","q":"இயல் 9-இன் உரைநடைப் பாடம்?","a":"சட்டமேதை அம்பேத்கர்"},{"n":324,"c":"இயல் 9","q":"இயல் 9-இன் துணைப்பாடம்?","a":"பால் மனம்"},{"n":325,"c":"இயல் 9","q":"இயல் 9-இன் இலக்கணப் பகுதி?","a":"அணி இலக்கணம்"},{"n":326,"c":"இயல் 9","q":"“உயிர்க்குணங்கள்” பாடல் இடம்பெறும் நூல்?","a":"கன்னிப்பா அது"},{"n":398,"c":"இலக்கணப் பயிற்சி","q":"காலம் எத்தனை வகை?","a":"3 (இறந்தகாலம், நிகழ்காலம், எதிர்காலம்)"},{"n":399,"c":"இலக்கணப் பயிற்சி","q":"குறில் எழுத்துகள்?","a":"அ, இ, உ, எ, ஒ"},{"n":400,"c":"இலக்கணப் பயிற்சி","q":"நெடில் எழுத்துகள்?","a":"ஆ, ஈ, ஊ, ஏ, ஐ, ஓ, ஔ"},{"n":401,"c":"இலக்கணப் பயிற்சி","q":"வல்லின மெய்கள்?","a":"க், ச், ட், த், ப், ற்"},{"n":402,"c":"இலக்கணப் பயிற்சி","q":"மெல்லின மெய்கள்?","a":"ங், ஞ், ண், ந், ம், ன்"},{"n":403,"c":"இலக்கணப் பயிற்சி","q":"இடையின மெய்கள்?","a":"ய், ர், ல், வ், ழ், ள்"},{"n":404,"c":"இலக்கணப் பயிற்சி","q":"உயிர்மெய் எழுத்துகள் எத்தனை?","a":"216"},{"n":405,"c":"இலக்கணப் பயிற்சி","q":"பகுபதம் என்றால் என்ன?","a":"பகுதி, விகுதி முதலிய உறுப்புகளாகப் பிரிக்கக்கூடிய சொல்"},{"n":406,"c":"இலக்கணப் பயிற்சி","q":"பகுபத உறுப்புகள் எத்தனை?","a":"6"},{"n":407,"c":"இலக்கணப் பயிற்சி","q":"பகுபத உறுப்புகள் யாவை?","a":"பகுதி, விகுதி, இடைநிலை, சாரியை, சந்தி, விகாரம்"},{"n":408,"c":"இலக்கணப் பயிற்சி","q":"பகாப்பதம் என்றால் என்ன?","a":"பகுதி, விகுதி எனப் பிரிக்க இயலாத சொல்"},{"n":409,"c":"இலக்கணப் பயிற்சி","q":"பகுதி என்பது?","a":"சொல்லின் முதலில் நின்று பொருள் தரும் உறுப்பு"},{"n":410,"c":"இலக்கணப் பயிற்சி","q":"விகுதி என்பது?","a":"சொல்லின் இறுதியில் நின்று திணை, பால், எண், இடம் காட்டும் உறுப்பு"},{"n":411,"c":"இலக்கணப் பயிற்சி","q":"இடைநிலை என்பது?","a":"பகுதிக்கும் விகுதிக்கும் இடையே நின்று காலம் காட்டும் உறுப்பு"},{"n":412,"c":"இலக்கணப் பயிற்சி","q":"“நடந்தான்” – பகுபத உறுப்புகள்?","a":"நட + த்(ந்) + த் + ஆன் (நட – பகுதி, த் – சந்தி, ந் – விகாரம், த் – இறந்தகால இடைநிலை, ஆன் – விகுதி)"},{"n":413,"c":"இலக்கணப் பயிற்சி","q":"“வாழ்ந்தனர்” – பகுபத உறுப்புகள்?","a":"வாழ் + த்(ந்) + த் + அன் + அர்"},{"n":414,"c":"இலக்கணப் பயிற்சி","q":"“உண்டான்” – பகுபத உறுப்பு பிரிப்பு?","a":"உண் + ட் + ஆன் (ட் – இறந்தகால இடைநிலை)"},{"n":415,"c":"இலக்கணப் பயிற்சி","q":"இறந்தகால இடைநிலைகள் எவை?","a":"த், ட், ற், இன்"},{"n":416,"c":"இலக்கணப் பயிற்சி","q":"நிகழ்கால இடைநிலைகள் எவை?","a":"கிறு, கின்று, ஆநின்று"},{"n":417,"c":"இலக்கணப் பயிற்சி","q":"எதிர்கால இடைநிலைகள் எவை?","a":"ப், வ்"},{"n":418,"c":"இலக்கணப் பயிற்சி","q":"“செய்வான்” – பிரிக்க.","a":"செய் + வ் + ஆன் (வ் – எதிர்கால இடைநிலை)"},{"n":419,"c":"இலக்கணப் பயிற்சி","q":"“பாடுகிறாள்” – பிரிக்க.","a":"பாடு + கிறு + ஆள்"},{"n":420,"c":"இலக்கணப் பயிற்சி","q":"வினைமுற்று என்றால் என்ன?","a":"பொருள் முற்றுப்பெற்று நிற்கும் வினைச்சொல்"},{"n":421,"c":"இலக்கணப் பயிற்சி","q":"பெயரெச்சம் என்றால் என்ன?","a":"எச்சமாக நின்று பெயரைக் கொண்டு முடியும் வினை (எ.கா: வந்த பையன்)"},{"n":422,"c":"இலக்கணப் பயிற்சி","q":"வினையெச்சம் என்றால் என்ன?","a":"எச்சமாக நின்று வினையைக் கொண்டு முடியும் வினை (எ.கா: வந்து போனான்)"},{"n":423,"c":"இலக்கணப் பயிற்சி","q":"வினைச்சொல் எத்தனை வகைப்படும்?","a":"தெரிநிலை வினை, குறிப்பு வினை"},{"n":424,"c":"இலக்கணப் பயிற்சி","q":"காலம் காட்டும் வினை?","a":"தெரிநிலை வினை"},{"n":425,"c":"இலக்கணப் பயிற்சி","q":"காலம் காட்டாமல் பண்பு முதலியன காட்டும் வினை?","a":"குறிப்பு வினை"},{"n":426,"c":"இலக்கணப் பயிற்சி","q":"தன்வினை என்றால் என்ன?","a":"எழுவாய் தானே செய்யும் வினை (எ.கா: கதவு திறந்தது)"},{"n":427,"c":"இலக்கணப் பயிற்சி","q":"பிறவினை என்றால் என்ன?","a":"எழுவாய் பிறரைக் கொண்டு செய்விக்கும் வினை (எ.கா: கதவைத் திறந்தான்)"},{"n":428,"c":"இலக்கணப் பயிற்சி","q":"செய்வினை என்றால் என்ன?","a":"எழுவாய் செயலைச் செய்யும் வாக்கியம் (ராமன் பாடம் படித்தான்)"},{"n":429,"c":"இலக்கணப் பயிற்சி","q":"செயப்பாட்டு வினை என்றால் என்ன?","a":"செயப்படுபொருள் எழுவாயாக வரும் வாக்கியம் (பாடம் படிக்கப்பட்டது)"},{"n":430,"c":"இலக்கணப் பயிற்சி","q":"பெயர்ச்சொற்கள் எத்தனை வகை?","a":"6"},{"n":431,"c":"இலக்கணப் பயிற்சி","q":"“வெண்மை” என்பது எவ்வகைப் பெயர்?","a":"பண்புப்பெயர்"},{"n":432,"c":"இலக்கணப் பயிற்சி","q":"“ஆடல்” என்பது எவ்வகைப் பெயர்?","a":"தொழிற்பெயர்"},{"n":433,"c":"இலக்கணப் பயிற்சி","q":"“மதுரை” என்பது எவ்வகைப் பெயர்?","a":"இடப்பெயர்"},{"n":434,"c":"இலக்கணப் பயிற்சி","q":"“கண்” என்பது எவ்வகைப் பெயர்?","a":"சினைப்பெயர்"},{"n":435,"c":"இலக்கணப் பயிற்சி","q":"“தை” என்பது எவ்வகைப் பெயர்?","a":"காலப்பெயர்"},{"n":436,"c":"இலக்கணப் பயிற்சி","q":"சுட்டெழுத்துகள் எவை?","a":"அ, இ, உ"},{"n":437,"c": let active = SECTIONS[0].id;

function renderTabs(){
  const all = [...SECTIONS.map(s => [s.id, s.name]), ["qa","500 வினா-விடை"], ["quiz","பயிற்சி வினாக்கள்"]];
  tabs.innerHTML = "";
  all.forEach(([id,name]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name;
    b.setAttribute("aria-pressed", String(id === active && !search.value.trim()));
    b.onclick = () => { active = id; search.value = ""; render(); };
    tabs.appendChild(b);
  });
}

function topicHTML(t, open, q){
  let html = t.html;
  if(q){ // highlight text only, not tags
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
    html = html.replace(/>([^<]+)</g, (m, txt) => ">" + txt.replace(re, "<mark>$1</mark>") + "<");
  }
  return `<details ${open ? "open" : ""}><summary>${t.t}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  let score = 0, done = 0;
  content.innerHTML = `<h2>பயிற்சி வினாக்கள்</h2><div class="quiz" id="qz"></div><div class="score" id="score" aria-live="polite"></div>`;
  const qz = $("#qz");
  QUIZ.forEach((item, i) => {
    const box = document.createElement("div"); box.className = "q";
    box.innerHTML = `<div>${i+1}. ${item.q}</div><div class="opts"></div>`;
    const opts = box.querySelector(".opts");
    item.o.forEach((txt, j) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = txt;
      b.onclick = () => {
        if(opts.dataset.done) return;
        opts.dataset.done = 1; done++;
        const btns = opts.children;
        btns[item.a].classList.add("ok");
        if(j === item.a) score++; else b.classList.add("bad");
        if(done === QUIZ.length) $("#score").textContent = `உங்கள் மதிப்பெண்: ${score} / ${QUIZ.length}`;
      };
      opts.appendChild(b);
    });
    qz.appendChild(box);
  });
}

let qaPage=0, qaCat="all", qaText="", qaAll=false;
const PER=25;
function renderQA(focusSearch){
  const cats=[...new Set(QA.map(x=>x.c))];
  const t=qaText.toLowerCase();
  const list=QA.filter(x=>(qaCat==="all"||x.c===qaCat)&&(!t||(x.q+" "+x.a).toLowerCase().includes(t)));
  const pages=Math.max(1,Math.ceil(list.length/PER));
  qaPage=Math.min(qaPage,pages-1);
  const slice=list.slice(qaPage*PER,(qaPage+1)*PER);
  content.innerHTML=`<h2>500 வினா-விடை</h2>
  <div class="qa-bar">
    <select id="qaCat" aria-label="பிரிவு"><option value="all">அனைத்துப் பிரிவுகள் (${QA.length})</option>${cats.map(c=>`<option value="${c}" ${c===qaCat?"selected":""}>${c} (${QA.filter(x=>x.c===c).length})</option>`).join("")}</select>
    <input id="qaText" type="search" placeholder="இப்பிரிவில் தேடுக…" aria-label="வினா தேடல்">
    <button id="qaToggle" type="button">${qaAll?"விடைகளை மறை":"விடைகளைக் காட்டு"}</button>
  </div>
  <p class="meta">${list.length} வினாக்கள் · பக்கம் ${qaPage+1} / ${pages}</p>
  ${slice.length?slice.map(x=>`<details class="qa" ${qaAll?"open":""}><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join(""):'<p class="empty">வினாக்கள் இல்லை.</p>'}
  <div class="pager"><button id="qaPrev" type="button" ${qaPage===0?"disabled":""}>« முந்தையது</button><button id="qaNext" type="button" ${qaPage>=pages-1?"disabled":""}>அடுத்தது »</button></div>`;
  const ti=$("#qaText"); ti.value=qaText;
  if(focusSearch){ ti.focus(); ti.setSelectionRange(ti.value.length,ti.value.length); }
  $("#qaCat").onchange=e=>{qaCat=e.target.value;qaPage=0;renderQA();};
  ti.oninput=e=>{qaText=e.target.value;qaPage=0;renderQA(true);};
  $("#qaToggle").onclick=()=>{qaAll=!qaAll;renderQA();};
  $("#qaPrev").onclick=()=>{qaPage--;renderQA();window.scrollTo(0,0);};
  $("#qaNext").onclick=()=>{qaPage++;renderQA();window.scrollTo(0,0);};
}

function render(){
  renderTabs();
  const q = search.value.trim();
  if(q){
    const hits = [];
    SECTIONS.forEach(s => s.topics.forEach(t => {
      const plain = (t.t + " " + t.html.replace(/<[^>]+>/g," ")).toLowerCase();
      if(plain.includes(q.toLowerCase())) hits.push(t);
    }));
    const qh = QA.filter(x => (x.q + " " + x.a).toLowerCase().includes(q.toLowerCase())).slice(0, 40);
    const qhtml = qh.map(x => `<details class="qa"><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join("");
    content.innerHTML = `<h2>தேடல் முடிவுகள்</h2>` + ((hits.length || qh.length) ? hits.map(t => topicHTML(t, true, q)).join("") + (qh.length ? `<h2>வினா-விடை</h2>` + qhtml : "") : `<p class="empty">முடிவுகள் இல்லை. வேறு சொல்லில் தேடுக.</p>`);
    return;
  }
  if(active === "qa") return renderQA();
  if(active === "quiz") return renderQuiz();
  const s = SECTIONS.find(x => x.id === active);
  content.innerHTML = `<h2>${s.name}</h2>` + s.topics.map((t,i) => topicHTML(t, i === 0)).join("");
}

search.addEventListener("input", render);
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0e1714";
  const next = dark ? "light" : "dark";
  root.dataset.theme = next;
  try{ localStorage.setItem("skg-theme", next); }catch(e){}
};
try{ const t = localStorage.getItem("skg-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#yr").textContent = new Date().getFullYear();
render();
</script>
