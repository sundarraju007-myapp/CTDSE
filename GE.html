<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sundarraju TNPSC Kattral Ulagam</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f8f6; --card:#ffffff; --ink:#16231f; --muted:#5b6b66;
  --brand:#0f5c4d; --brand-ink:#ffffff; --accent:#e8a317; --line:#d7e2dd;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1714;--card:#16231f;--ink:#e7f0ec;--muted:#9bb0a8;--brand:#2fae94;--brand-ink:#08130f;--accent:#f0b43a;--line:#2a3c36;}
}
:root[data-theme="dark"]{--bg:#0e1714;--card:#16231f;--ink:#e7f0ec;--muted:#9bb0a8;--brand:#2fae94;--brand-ink:#08130f;--accent:#f0b43a;--line:#2a3c36;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;line-height:1.75}
header{background:var(--brand);color:var(--brand-ink);padding:28px 16px 22px;border-bottom:6px solid var(--accent)}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.25}
header p{margin:6px 0 0;opacity:.9}
.tools{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px;padding:10px 14px;border-radius:8px;border:2px solid transparent;font:inherit;background:#fff;color:#16231f}
.tools input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools button{padding:10px 16px;border-radius:8px;border:2px solid var(--brand-ink);background:transparent;color:var(--brand-ink);font:inherit;cursor:pointer}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
nav button{white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{padding:20px 0 60px}
h2{font-size:1.35rem;margin:6px 0 14px;color:var(--brand)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
details[open] summary{border-bottom:1px solid var(--line)}
.body{padding:10px 16px 14px}
.body ul{margin:0;padding-left:20px}
.body li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:6px}
.scroll{overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--bg)}
mark{background:var(--accent);color:#16231f;border-radius:3px;padding:0 2px}
.quiz .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.quiz .opts{display:grid;gap:8px;margin-top:8px}
.quiz .opts button{text-align:left;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.quiz .opts button.ok{background:#1f8a5b;color:#fff;border-color:#1f8a5b}
.quiz .opts button.bad{background:#c0392b;color:#fff;border-color:#c0392b}
.score{font-weight:700;margin:10px 0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.qa-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qa-bar select,.qa-bar input{flex:1;min-width:160px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.qa-bar button,.pager button{padding:9px 14px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;cursor:pointer}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.pager button:disabled{opacity:.4;cursor:default}
.meta{color:var(--muted);font-size:.9rem;margin:4px 0 12px}
details.qa summary{font-weight:500}
footer{text-align:center;color:var(--muted);padding:20px 16px 40px;font-size:.9rem}
</style>
</head>

<header>
  <div class="wrap">
    <h1>Sundarraju TNPSC Kattral Ulagam</h1>
    <p>சுந்தரராஜ் TNPSC கற்றல் உலகம் &mdash; குரூப் IV 2026 | பொதுத்தமிழ் முழு பாடத்திட்டம் (அலகு I – VII) + 500 வினா-விடை</p>

      <button id="theme" type="button">🌓 Theme</button>
    </div>
  </div>
</header>

<footer>&copy; <span id="yr"></span> Sundarraju TNPSC Kattral Ulagam &middot; தேர்வுக்கு முன் பாடநூலுடன் சரிபார்க்கவும்.</footer>

<script>

const SECTIONS = [{"id":"syl","name":"📋 பொதுத்தமிழ் – முழுப் பாடத்திட்டம்","topics":[{"t":"தேர்வு அமைப்பு","html":"<ul><li>ஒரே தாள் (OMR): 200 வினாக்கள் – 300 மதிப்பெண் – 3 மணி நேரம்; SSLC தரம்.</li><li>பகுதி அ – தமிழ் தகுதி மற்றும் மதிப்பீட்டுத் தேர்வு: 100 வினாக்கள் = 150 மதிப்பெண் (சரியான விடைக்கு 1.5); தமிழில் மட்டும்.</li><li>பகுதி ஆ – பொது அறிவு 75 + திறனறிவு & மனக்கணக்கு 25. பகுதி அ-வில் குறைந்தது 40% (60/150) பெற்றால் மட்டுமே பகுதி ஆ மதிப்பிடப்படும்; மொத்தம் குறைந்தபட்சம் 90/300; எதிர்மறை மதிப்பெண் இல்லை.</li><li>அறிவிக்கை எண் 11/2026 (06.10.2026); தேர்வு 10.01.2027; பணியிடங்கள் 6,574 (ஆதாரம்: வலைத்தளச் செய்திகள் – tnpsc.gov.in-இல் உறுதிசெய்க).</li></ul>"},{"t":"பகுதி அ – அலகுகள்","html":"<ul><li>அலகு I – இலக்கணம் (எழுத்து, சொல்); அலகு II – சொல்லகராதி; அலகு III – எழுதும் திறன் (தொடர், மரபு, குறியீடு).</li><li>அலகு IV – கலைச்சொற்கள்; அலகு V – வாசித்தல் (பழமொழி, மரபுத்தொடர், உவமைத்தொடர்); அலகு VI – மொழிபெயர்ப்பு.</li><li>அலகு VII – இலக்கியம்: திருக்குறள், அறநூல்கள், சங்க இலக்கியம், காப்பியங்கள், பக்தி, சிற்றிலக்கியம், நவீன இலக்கியம், சான்றோர், தமிழ்த்தொண்டு, தமிழ்நாடு பண்பாடு.</li></ul>"},{"t":"இலக்கியப் பகுதியில் கேட்கப்படுபவை","html":"<ul><li>மேற்கோள்கள் & ஆசிரியர்கள்; நூல்–ஆசிரியர் பொருத்துக; சிறப்புப் பெயர்கள்; அகர வரிசை; பிழை திருத்தம்; தமிழ்ச்சொல் தருக; ஒலி வேறுபாடு; ஓரெழுத்து ஒருமொழி; வேர்ச்சொல்; எதுகை, மோனை, இயைபு; உவமை; பழமொழி.</li><li>தமிழின் தொன்மையும் சிறப்பும்; திராவிட மொழிகள்; தமிழில் அறிவியல் கருத்துகள்; சிறுகதை, நாடகம், கலைகள்; பெண்களின் பங்களிப்பு; உலகத் தமிழர்.</li></ul>"},{"t":"எச்சரிக்கை – திருக்குறள் அதிகாரப் பட்டியல்","html":"<ul><li>இரு இணையதளங்கள் வெவ்வேறு பட்டியல்களைத் தருகின்றன (ஒன்று 25 அதிகாரங்கள், மற்றொன்று 20). இரண்டையும் ‘திருக்குறள்’ பகுதியில் தந்துள்ளேன்; அதிகாரப்பூர்வ PDF-உடன் ஒப்பிட்டு உறுதிசெய்க.</li></ul>"}]},{"id":"ez","name":"அலகு I – எழுத்து இலக்கணம்","topics":[{"t":"எழுத்து வகைகள்","html":"<ul><li>முதலெழுத்து 30 (உயிர் 12, மெய் 18); சார்பெழுத்து 10; மொத்தம் 247 (உயிர்மெய் 216 + ஆய்தம் 1 + உயிர் 12 + மெய் 18).</li><li>சார்பெழுத்து 10: உயிர்மெய், ஆய்தம், உயிரளபெடை, ஒற்றளபெடை, குற்றியலுகரம், குற்றியலிகரம், ஐகாரக்குறுக்கம், ஔகாரக்குறுக்கம், மகரக்குறுக்கம், ஆய்தக்குறுக்கம்.</li><li>குறில் 5 (அ இ உ எ ஒ); நெடில் 7; வல்லினம், மெல்லினம், இடையினம் – தலா 6.</li></ul>"},{"t":"மாத்திரை","html":"<ul><li>குறில் 1; நெடில் 2; மெய் ½; ஆய்தம் ½; உயிரளபெடை 3; ஒற்றளபெடை 1; குற்றியலுகரம், குற்றியலிகரம் ½; ஐகாரக்குறுக்கம் (முதல் 1½, இடை/கடை 1); ஔகாரக்குறுக்கம் 1½; மகரக்குறுக்கம் ¼; ஆய்தக்குறுக்கம் ¼.</li><li>மாத்திரை = கண் இமைக்கும் / கை நொடிக்கும் நேரம்.</li></ul>"},{"t":"இன எழுத்துகள் – சுட்டு – வினா","html":"<ul><li>க–ங, ச–ஞ, ட–ண, த–ந, ப–ம, ற–ன; அ–ஆ, இ–ஈ, உ–ஊ, எ–ஏ, ஒ–ஓ; ஐ, ஔ-க்கு இனம் இல்லை.</li><li>சுட்டு: அ (சேய்மை), இ (அண்மை), உ (இடைப்பட்டது). வினா: எ, யா (முதல்); ஆ, ஓ, ஏ (இறுதி).</li><li>மொழிமுதல் எழுத்துகள் 22 (உயிர் 12 + க, ச, த, ந, ப, ம, வ, ய, ஞ, ங); மொழி இறுதி மெய்கள் 11.</li></ul>"},{"t":"குறுக்கம் – அளபெடை – குற்றியலுகரம்","html":"<ul><li>குற்றியலுகரம் 6: நெடிற்றொடர் (நாடு), ஆய்தத்தொடர் (எஃகு), உயிர்த்தொடர் (அரசு), வன்றொடர் (பாக்கு), மென்றொடர் (பங்கு), இடைத்தொடர் (மார்பு).</li><li>குற்றியலிகரம்: நாடு + யாது = நாடியாது; மியா (கேள்மியா).</li><li>அளபெடை: உயிரளபெடை (ஓஒதல்), ஒற்றளபெடை (எஃஃகு).</li></ul>"},{"t":"மயங்கொலிகள் – வேறுபாடுகள்","html":"<ul><li>ண–ன–ந, ல–ள–ழ, ர–ற. தமிழுக்கே உரிய சிறப்பு எழுத்து ‘ழ’.</li><li>பணம் – பனம்; கனி – கணி; அரி – அறி; இரை – இறை; குரை – குறை; பரவை – பறவை; கரி – கறி; வலி – வளி – வழி; கலை – களை – கழை; அரம் – அறம்; மரம் – மறம்; கரை – கறை.</li><li>குறில்–நெடில்: அடி – ஆடி; மலை – மாலை; கலை – காலை; கொடி – கோடி; கல் – கால்; நிலம் – நீலம்; துளி – தூளி; சிலை – சீலை.</li></ul>"},{"t":"ஒருமை – பன்மை","html":"<ul><li>மரம் – மரங்கள்; ஆடு – ஆடுகள்; கல் – கற்கள்; சொல் – சொற்கள்; புல் – புற்கள்; பூ – பூக்கள்; கண் – கண்கள்; நூல் – நூல்கள்.</li></ul>"}]},{"id":"sandhi","name":"அலகு I – சந்தி & புணர்ச்சி","topics":[{"t":"வல்லினம் மிகும் இடங்கள்","html":"<ul><li>அ, இ, உ சுட்டு; எ வினா: அந்தப் பையன், இந்தக் கடை, எந்தப் பொருள்.</li><li>அப்படி, இப்படி, எப்படி: இப்படிச் செய்தான்.</li><li>இரண்டாம் வேற்றுமை (ஐ): பாடத்தைப் படித்தான்; நான்காம் வேற்றுமை (கு): ஊருக்குச் சென்றான்.</li><li>இ ஈற்று வினையெச்சம்: ஓடிப் போனான்; அ ஈற்று வினையெச்சம்: மெல்லச் சென்றான்.</li></ul>"},{"t":"வல்லினம் மிகா இடங்கள்","html":"<ul><li>எழுவாய்த்தொடர் (மாணவர் படித்தனர்); விளித்தொடர் (தம்பி கொடு); வினைத்தொகை (ஊறுகாய்); உம்மைத்தொகை (தாய் தந்தை); வியங்கோள் (வாழ்க தமிழ்); அது, இது, எது (அது கண்டான்).</li></ul>"},{"t":"புணர்ச்சி","html":"<ul><li>நிலைமொழி + வருமொழி; இயல்புப் புணர்ச்சி (மண்குடம்), விகாரப் புணர்ச்சி: தோன்றல் (வாழைப்பழம், தமிழ்க்கடல்), திரிதல் (பொற்குடம், மரங்கள்), கெடுதல் (மரவேர்).</li><li>உடம்படுமெய் ய், வ்: வாழையிலை, மாவிலை, திருவடி.</li></ul>"}]},{"id":"sol","name":"அலகு I – சொல் இலக்கணம்","topics":[{"t":"நால்வகைச் சொற்கள் – பெயர்ச்சொல்","html":"<ul><li>பெயர், வினை, இடை, உரி. பெயர்ச்சொல் 6: பொருட்பெயர், இடப்பெயர், காலப்பெயர், சினைப்பெயர், பண்புப்பெயர், தொழிற்பெயர்.</li><li>தொழிற்பெயர் விகுதிகள்: தல், அல், கை (படித்தல், பாடல், அழுகை).</li></ul>"},{"t":"வேர்ச்சொல்","html":"<ul><li>நடந்தான் – நட; ஓடினான் – ஓடு; கற்றான் – கல்; வந்தான் – வா; சென்றான் – செல்; தந்தான் – தா; கண்டான் – காண்; உண்டான் – உண்; நின்றான் – நில்; வென்றான் – வெல்; கொன்றான் – கொல்; தின்றான் – தின்.</li></ul>"},{"t":"வினைமுற்று – எச்சம் – வினையாலணையும் பெயர்","html":"<ul><li>வினைமுற்று: தெரிநிலை (படித்தான்), குறிப்பு (நல்லன்); ஏவல் (வா), வியங்கோள் (வாழ்க).</li><li>பெயரெச்சம் – பெயரைக் கொண்டு முடியும் (படித்த மாணவன்); வினையெச்சம் – வினையைக் கொண்டு முடியும் (படித்துச் சென்றான்); எதிர்மறை: படிக்காத.</li><li>வினையாலணையும் பெயர்: வந்தவன், படித்தவர்.</li></ul>"},{"t":"பகுபதம் – இடைநிலை","html":"<ul><li>பகுபத உறுப்புகள் 6: பகுதி, விகுதி, இடைநிலை, சாரியை, சந்தி, விகாரம்; நடந்தான் = நட + த்(ந்) + த் + ஆன்.</li><li>இடைநிலை: இறந்தகாலம் – த், ட், ற், இன்; நிகழ்காலம் – கிறு, கின்று, ஆநின்று; எதிர்காலம் – ப், வ்.</li></ul>"},{"t":"வேற்றுமை – தொகை – ஆகுபெயர்","html":"<ul><li>வேற்றுமை 8: பெயர், ஐ, ஆல், கு, இன், அது, கண், விளி.</li><li>தொகைநிலை 6: வேற்றுமை, வினை, பண்பு, உவமை, உம்மை, அன்மொழித்தொகை; தொகாநிலை 9: எழுவாய், விளி, வினைமுற்று, பெயரெச்சம், வினையெச்சம், வேற்றுமை, இடைச்சொல், உரிச்சொல், அடுக்கு.</li><li>ஆகுபெயர் 16: பொருளாகு (மல்லிகை சூடினாள்), இடவாகு (இந்தியா வென்றது), காலவாகு (டிசம்பர் வந்தது), சினையாகு (தலைக்கு நூறு), பண்பாகு (வெள்ளை அடித்தான்) முதலியன.</li></ul>"},{"t":"திணை – பால் – இடம் – காலம்","html":"<ul><li>திணை 2: உயர்திணை, அஃறிணை; பால் 5: ஆண், பெண், பலர், ஒன்றன், பலவின்; இடம் 3: தன்மை, முன்னிலை, படர்க்கை; காலம் 3.</li><li>இலக்கியவகைச் சொல்: இயற்சொல், திரிசொல், திசைச்சொல், வடசொல்; இடைச்சொல், உரிச்சொல் (உறு, தவ, நனி – மிகுதி).</li></ul>"}]},{"id":"vocab","name":"அலகு II – சொல்லகராதி","topics":[{"t":"எதிர்ச்சொற்கள்","html":"<ul><li>இன்பம் – துன்பம்; அன்பு – வெறுப்பு; உயர்வு – தாழ்வு; வெற்றி – தோல்வி; நட்பு – பகை; ஆக்கம் – அழிவு; பகல் – இரவு; இளமை – முதுமை; நன்மை – தீமை; உண்மை – பொய்மை; ஈதல் – ஏற்றல்; புகழ் – இகழ்; தொடக்கம் – முடிவு; அறிவு – அறியாமை; கல்வி – கல்லாமை; முன் – பின்; அகம் – புறம்; ஆதி – அந்தம்.</li></ul>"},{"t":"ஒருபொருள் பன்மொழி","html":"<ul><li>கடல் – ஆழி, வாரி, முந்நீர்; மலை – குன்று, வெற்பு, அடுக்கல்; சூரியன் – ஞாயிறு, கதிரவன், பரிதி; சந்திரன் – திங்கள், மதி; வானம் – விண், ஆகாயம்; நீர் – புனல், தண்ணீர்; மேகம் – முகில், கார்; அரசன் – வேந்தன், மன்னன், கோ.</li></ul>"},{"t":"ஓரெழுத்து ஒருமொழி (42)","html":"<ul><li>ஆ – பசு; ஈ – கொடு; கா – சோலை; கை – உறுப்பு; கோ – அரசன்; தீ – நெருப்பு; நா – நாக்கு; பூ – மலர்; மா – மாமரம்; மீ – மேலே; வா – அழை; நொ – துன்பம்; ஐ – தலைவன்; ஏ – அம்பு; ஊ – இறைச்சி; தே – கடவுள்.</li></ul>"},{"t":"தூய தமிழ் – மரூஉ – பலபொருள்","html":"<ul><li>சந்தோஷம் – மகிழ்ச்சி; வருஷம் – ஆண்டு; ஜனங்கள் – மக்கள்; வித்தியாசம் – வேறுபாடு; விஷயம் – செய்தி; அவசரம் – விரைவு; பிரயாணம் – பயணம்; சரீரம் – உடல்; ஜன்னல் – சாளரம்.</li><li>மரூஉ: தஞ்சாவூர் – தஞ்சை; திருநெல்வேலி – நெல்லை; புதுச்சேரி – புதுவை; கோயம்புத்தூர் – கோவை; உதகமண்டலம் – ஊட்டி.</li><li>பலபொருள்: ஆறு – நதி, எண் 6, வழி; கண் – விழி, துளை, இடம்; மா – மாமரம், பெரிய.</li></ul>"}]},{"id":"write","name":"அலகு III – எழுதும் திறன் & மரபு","topics":[{"t":"தன்வினை – பிறவினை; செய்வினை – செயப்பாட்டு","html":"<ul><li>தன்வினை → பிறவினை: ஓடினான் – ஓட்டினான்; நடந்தான் – நடத்தினான்; படித்தான் – படிப்பித்தான்; செய்தான் – செய்வித்தான்; வளர்ந்தது – வளர்த்தான்.</li><li>செய்வினை: கண்ணன் பாடம் படித்தான். செயப்பாட்டு: பாடம் கண்ணனால் படிக்கப்பட்டது (‘படு’ துணை).</li></ul>"},{"t":"இளமைப் பெயர்","html":"<ul><li>ஆடு – குட்டி, மறி; மாடு – கன்று; யானை – கன்று; புலி – பறழ்; சிங்கம் – குருளை; கோழி – குஞ்சு; பறவை – பார்ப்பு; கிளி – பிள்ளை; மான் – மறி.</li></ul>"},{"t":"ஒலிமரபு – வினைமரபு – தொகை மரபு","html":"<ul><li>காகம் கரையும்; குயில் கூவும்; ஆந்தை அலறும்; மயில் அகவும்; யானை பிளிறும்; சிங்கம் முழங்கும்; குதிரை கனைக்கும்; நாய் குரைக்கும்; புறா குனுகும்.</li><li>வினைமரபு: பூப் பறித்தான்; மாலை தொடுத்தான்; கோலம் இட்டாள்; பால் குடித்தான்; சோறு உண்டான்.</li><li>தொகை மரபு: முத்தமிழ், நாற்படை (தேர், யானை, குதிரை, காலாள்), ஐம்பொறி, அறுசுவை, முக்கனி (மா, பலா, வாழை).</li></ul>"},{"t":"நிறுத்தல் குறியீடுகள்","html":"<ul><li>காற்புள்ளி (,), அரைப்புள்ளி (;), முக்காற்புள்ளி (:), முற்றுப்புள்ளி (.), வினாக்குறி (?), உணர்ச்சிக்குறி (!), மேற்கோள் குறி (“ ”).</li><li>தொடரில் எழுவாய் தொடக்கத்திலும் பயனிலை இறுதியிலும் வரும்.</li></ul>"}]},{"id":"u4","name":"அலகு IV – கலைச்சொற்கள்","topics":[{"t":"கணினி – இணையம்","html":"<ul><li>Computer – கணினி; Internet – இணையம்; Website – இணையதளம்; E-mail – மின்னஞ்சல்; Software – மென்பொருள்; Hardware – வன்பொருள்; Keyboard – விசைப்பலகை; Mouse – சுட்டி; Printer – அச்சுப்பொறி; Scanner – வருடி; Search engine – தேடுபொறி; Download – பதிவிறக்கம்; Upload – பதிவேற்றம்; Password – கடவுச்சொல்.</li></ul>"},{"t":"ஊடகம் – போக்குவரத்து","html":"<ul><li>Mobile phone – கைபேசி; Telephone – தொலைபேசி; Television – தொலைக்காட்சி; Radio – வானொலி; Newspaper – செய்தித்தாள்; Editorial – தலையங்கம்.</li><li>Bus – பேருந்து; Train – தொடர்வண்டி; Cycle – மிதிவண்டி; Aeroplane – வானூர்தி; Airport – வானூர்தி நிலையம்.</li></ul>"},{"t":"அறிவியல் – சூழல் – மருத்துவம்","html":"<ul><li>Satellite – செயற்கைக்கோள்; Telescope – தொலைநோக்கி; Microscope – நுண்ணோக்கி; Thermometer – வெப்பமானி; Battery – மின்கலம்; Gene – மரபணு; Migration – வலசை.</li><li>Environment – சுற்றுச்சூழல்; Pollution – மாசு; Earthquake – நிலநடுக்கம்; Flood – வெள்ளம்; Drought – வறட்சி.</li><li>Allergy – ஒவ்வாமை; Vaccine – தடுப்பூசி; Hospital – மருத்துவமனை.</li></ul>"},{"t":"நிர்வாகம் – சட்டம் – நிதி – கல்வி","html":"<ul><li>Collector – ஆட்சியர்; Governor – ஆளுநர்; Chief Minister – முதலமைச்சர்; Assembly – சட்டமன்றம்; Court – நீதிமன்றம்; Judge – நீதிபதி; Census – மக்கள்தொகைக் கணக்கெடுப்பு.</li><li>Budget – வரவு செலவுத் திட்டம்; Tax – வரி; Export – ஏற்றுமதி; Import – இறக்குமதி; Bank – வங்கி; Cheque – காசோலை; Loan – கடன்; Insurance – காப்பீடு; Pension – ஓய்வூதியம்.</li><li>Scholarship – உதவித்தொகை; Certificate – சான்றிதழ்; Library – நூலகம்; Principal – முதல்வர்.</li></ul>"}]},{"id":"u5","name":"அலகு V – வாசித்தல் (பழமொழி – மரபுத்தொடர் – உவமை)","topics":[{"t":"பழமொழிகள்","html":"<ul><li>அடிமேல் அடி வைத்தால் அம்மியும் நகரும் – விடாமுயற்சி; ஆழம் தெரியாமல் காலை விடாதே – அறியாமல் இறங்காதே; இளமையில் கல்; உப்பில்லாப் பண்டம் குப்பையிலே – சுவையற்றது பயனற்றது.</li><li>கற்றது கைம்மண் அளவு, கல்லாதது உலகளவு; சிறு துளி பெருவெள்ளம்; நுணலும் தன் வாயால் கெடும்; பழகப் பழகப் பாலும் புளிக்கும்; எறும்பு ஊரக் கல்லும் தேயும்; ஒற்றுமையே பலம்.</li></ul>"},{"t":"மரபுத்தொடர்கள்","html":"<ul><li>கண்ணும் கருத்துமாக – மிகுந்த கவனம்; கை கொடுத்தல் – உதவுதல்; காற்றில் பறக்கவிடுதல் – புறக்கணித்தல்; நீர்மேல் எழுத்து – நிலையற்றது; ஆகாயத் தாமரை – இல்லாதது; கானல் நீர் – பொய்த்தோற்றம்.</li><li>அத்திப் பூத்தாற்போல – அரிதாக; எட்டாக்கனி – அடைய முடியாதது; முதலைக் கண்ணீர் – போலிக் கண்ணீர்; கண்ணில் மண்ணைத் தூவுதல் – ஏமாற்றுதல்; மூக்கை நுழைத்தல் – தேவையின்றித் தலையிடுதல்.</li></ul>"},{"t":"உவமைத் தொடர்கள்","html":"<ul><li>தாமரை இலை நீர் போல – ஒட்டாமல்; மின்னலைப் போல – விரைவாக; பாலும் தேனும் போல – இனிமை; நகமும் சதையும் போல – பிரிக்க முடியாத உறவு; கண்ணும் இமையும் போல – காத்தல்; ஆமை போல – மெதுவாக; தேனீ போல – சுறுசுறுப்பு; நரி போல – தந்திரம்.</li></ul>"},{"t":"வாசித்தல் உத்திகள்","html":"<ul><li>பத்தியை முழுதும் படித்து மையக்கருத்தைக் கண்டறிக; தலைப்புக்கும் பத்தியின் தொடக்கம், முடிவுக்கும் தொடர்பு உண்டு.</li><li>விடை எப்போதும் பத்தியிலிருந்தே; பத்தியில் இல்லாத கருத்தை விடையாக்காதீர்.</li><li>தலையங்கம் – பத்திரிகையின் கருத்து; முகப்புச் செய்தி – முதல் பக்கச் செய்தி.</li></ul>"}]},{"id":"u6","name":"அலகு VI – மொழிபெயர்ப்பு","topics":[{"t":"கடிதப் பகுதிகள்","html":"<ul><li>Sender – அனுப்புநர்; Receiver (To) – பெறுநர்; Subject – பொருள்; Date – நாள்; Signature – கையொப்பம்; Enclosure – இணைப்பு; Respected Sir – மதிப்பிற்குரிய ஐயா; Yours faithfully – இப்படிக்கு.</li></ul>"},{"t":"பொதுச் சொற்கள்","html":"<ul><li>Pendrive – விரலி; File – கோப்பு; Folder – அடைவு; Document – ஆவணம்; Application – விண்ணப்பம்; Letter – கடிதம்.</li></ul>"},{"t":"எளிய தொடர்கள்","html":"<ul><li>I am going to school – நான் பள்ளிக்குச் செல்கிறேன்; Water is essential for life – நீர் வாழ்வுக்கு இன்றியமையாதது; Knowledge is power – அறிவே ஆற்றல்; Honesty is the best policy – நேர்மையே சிறந்த கொள்கை; Education is the key to success – கல்வியே வெற்றிக்கான திறவுகோல்.</li><li>உத்தி: எழுவாய் – செயப்படுபொருள் – பயனிலை வரிசையில் தமிழில் அமைக்க; பயனிலை இறுதியில் வரும்.</li></ul>"}]},{"id":"u7k","name":"அலகு VII – திருக்குறள் (அதிகார எண்களுடன்)","topics":[{"t":"பட்டியல் 1 – 20 அதிகாரங்கள் (தமிழ் இணையச் செய்தி)","html":"<ul><li>அறத்துப்பால்: அறன் வலியுறுத்தல் (4), அன்புடைமை (8), விருந்தோம்பல் (9), நடுவு நிலைமை (12), ஒழுக்கமுடைமை (14), பொறையுடைமை (16), புறங்கூறாமை (19), ஈகை (23), அருளுடைமை (25), கூடா ஒழுக்கம் (28).</li><li>பொருட்பால்: கல்வி (40), கல்லாமை (41), பெரியாரைத் துணைக்கோடல் (45), செங்கோன்மை (55), கண்ணோட்டம் (58), ஊக்கமுடைமை (60), வினை செயல்வகை (68), அவையஞ்சாமை (73), நட்பாராய்தல் (80), பண்புடைமை (100).</li></ul>"},{"t":"பட்டியல் 2 – 25 அதிகாரங்கள் (மற்றொரு செய்தி)","html":"<ul><li>அறத்துப்பால்: அன்புடைமை (8), இனியவை கூறல் (10), செய்ந்நன்றி அறிதல் (11), அடக்கமுடைமை (13), ஒழுக்கமுடைமை (14), பொறையுடைமை (16), ஒப்புரவறிதல் (22), ஈகை (23), வாய்மை (30), இன்னா செய்யாமை (32).</li><li>பொருட்பால்: கல்வி (40), கேள்வி (42), அறிவுடைமை (43), பெரியாரைத் துணைக்கோடல் (45), தெரிந்து செயல்வகை (47), வலியறிதல் (48), காலமறிதல் (49), ஊக்கமுடைமை (60), வினைத்திட்பம் (67), பொருள் செயல்வகை (76), நட்பு (79), கூடா நட்பு (83), சான்றாண்மை (99), பண்புடைமை (100), உழவு (104).</li></ul>"},{"t":"திருக்குறள் – அடிப்படை","html":"<ul><li>திருவள்ளுவர்; 133 அதிகாரம்; 1330 குறள்; அறம் 38, பொருள் 70, இன்பம் 25; குறள் வெண்பா; ஆண்டு = கி.பி. + 31; தை 2 – திருவள்ளுவர் தினம்.</li><li>பாயிரவியல் 4, இல்லறவியல் 20, துறவறவியல் 13, ஊழியல் 1; அரசியல் 25, அங்கவியல் 32, ஒழிபியல் 13; களவியல் 7, கற்பியல் 18.</li><li>உரையாசிரியர்கள் பத்து; சிறந்த உரை – பரிமேலழகர்; மொழிபெயர்ப்பு – ஜி.யு. போப் (1886); இலத்தீன் – வீரமாமுனிவர்.</li></ul>"}]},{"id":"u7a","name":"அலகு VII – அறநூல்கள் (பதினெண்கீழ்க்கணக்கு)","topics":[{"t":"அறநூல்களும் ஆசிரியர்களும்","html":"<ul><li>நாலடியார் – சமண முனிவர்கள்; வெண்பா; 400; வேளாண் வேதம்; தொகுத்தவர் பதுமனார்.</li><li>நான்மணிக்கடிகை – விளம்பிநாகனார்; பழமொழி நானூறு – முன்றுறை அரையனார்; முதுமொழிக்காஞ்சி – கூடலூர் கிழார்.</li><li>திரிகடுகம் – நல்லாதனார் (சுக்கு, மிளகு, திப்பிலி); சிறுபஞ்சமூலம் – காரியாசான் (ஐந்து வேர்கள்); ஏலாதி – கணிமேதாவியார்.</li><li>இன்னா நாற்பது – கபிலர்; இனியவை நாற்பது – பூதஞ்சேந்தனார்; ஆசாரக்கோவை – பெருவாயின் முள்ளியார்.</li><li>ஔவையார்: ஆத்திசூடி (109), கொன்றை வேந்தன், மூதுரை (31), நல்வழி (40).</li><li>பதினெண்கீழ்க்கணக்கு: நீதி நூல்கள் 11, அகம் 6 (ஐந்திணை ஐம்பது, ஐந்திணை எழுபது, திணைமொழி ஐம்பது, திணைமாலை நூற்றைம்பது, கைந்நிலை, கார் நாற்பது), புறம் 1 (களவழி நாற்பது).</li></ul>"}]},{"id":"u7s","name":"அலகு VII – சங்க இலக்கியம்","topics":[{"t":"எட்டுத்தொகை","html":"<ul><li>நற்றிணை (400; 9–12 அடி), குறுந்தொகை (401; 4–8 அடி; பூரிக்கோ), ஐங்குறுநூறு (500; 3–6 அடி; கூடலூர் கிழார்), பதிற்றுப்பத்து (சேர மன்னர்), பரிபாடல் (22 கிடைத்தன), கலித்தொகை (150; நல்லந்துவனார்), அகநானூறு (400; ஆசிரியப்பா), புறநானூறு (400).</li><li>ஐங்குறுநூறு: மருதம் – ஓரம்போகியார், நெய்தல் – அம்மூவனார், குறிஞ்சி – கபிலர், பாலை – ஓதலாந்தையார், முல்லை – பேயனார்.</li><li>அகம் 5, புறம் 2, அகமும் புறமும் – பரிபாடல்.</li></ul>"},{"t":"பத்துப்பாட்டு","html":"<ul><li>திருமுருகாற்றுப்படை – நக்கீரர் (317); பொருநராற்றுப்படை – முடத்தாமக் கண்ணியார் (கரிகாலன்); சிறுபாணாற்றுப்படை – நல்லூர் நத்தத்தனார் (நல்லியக்கோடன்); பெரும்பாணாற்றுப்படை – கடியலூர் உருத்திரங்கண்ணனார் (தொண்டைமான் இளந்திரையன்).</li><li>முல்லைப்பாட்டு – நப்பூதனார் (103 அடி, சிறியது); மதுரைக்காஞ்சி – மாங்குடி மருதனார் (782 அடி, நீண்டது); நெடுநல்வாடை – நக்கீரர்; குறிஞ்சிப்பாட்டு – கபிலர்; பட்டினப்பாலை – உருத்திரங்கண்ணனார்; மலைபடுகடாம் – பெருங்கௌசிகனார் (கூத்தராற்றுப்படை).</li><li>ஆற்றுப்படை நூல்கள் 5.</li></ul>"}]},{"id":"u7e","name":"அலகு VII – காப்பியம் – பக்தி – சிற்றிலக்கியம்","topics":[{"t":"காப்பியங்கள்","html":"<ul><li>ஐம்பெருங்காப்பியம்: சிலப்பதிகாரம் (இளங்கோவடிகள்; 3 காண்டம், 30 காதை), மணிமேகலை (சீத்தலைச் சாத்தனார்), சீவகசிந்தாமணி (திருத்தக்கதேவர்; 13 இலம்பகம்), வளையாபதி, குண்டலகேசி (நாதகுத்தனார்).</li><li>ஐஞ்சிறுகாப்பியம்: நாககுமார காவியம், உதயணகுமார காவியம், யசோதர காவியம், நீலகேசி, சூளாமணி (தோலாமொழித் தேவர்).</li><li>கம்பராமாயணம் – கம்பர் (சடையப்ப வள்ளல்; 6 காண்டம்); இராவண காவியம் – புலவர் குழந்தை (1946; 5 காண்டம்).</li></ul>"},{"t":"பக்தி இலக்கியம்","html":"<ul><li>பெரியபுராணம் – சேக்கிழார் (12ஆம் திருமுறை; 63 நாயன்மார்; 13 சருக்கம்; 4286 பாடல்).</li><li>நாலாயிர திவ்வியப் பிரபந்தம் – நாதமுனிகள் தொகுத்தது (12 ஆழ்வார்); திருவிளையாடற் புராணம் – பரஞ்சோதி முனிவர்.</li><li>தேம்பாவணி – வீரமாமுனிவர் (தலைவர் சூசையப்பர்); சீறாப்புராணம் – உமறுப்புலவர் (சீதக்காதி ஆதரவு); இரட்சணிய யாத்திரிகம் – எச்.ஏ. கிருட்டிணப்பிள்ளை.</li></ul>"},{"t":"சிற்றிலக்கியமும் பிறவும்","html":"<ul><li>குற்றாலக் குறவஞ்சி – திரிகூடராசப்பக் கவிராயர்; கலிங்கத்துப்பரணி – செயங்கொண்டார் (முதலாம் குலோத்துங்கன்); முத்தொள்ளாயிரம் – ஆசிரியர் தெரியவில்லை (மூவேந்தர் பற்றிய வெண்பாக்கள்).</li><li>தமிழ்விடு தூது – 268 கண்ணி, மதுரை சொக்கநாதர்; நந்திக் கலம்பகம் – மூன்றாம் நந்திவர்மன்; மூவருலா – ஒட்டக்கூத்தர்; முத்துக்குமாரசுவாமி பிள்ளைத்தமிழ் – குமரகுருபரர்.</li><li>மனோன்மணீயம் – பெ. சுந்தரம் பிள்ளை (தமிழ்த்தாய் வாழ்த்து); பாஞ்சாலி சபதம், குயில் பாட்டு – பாரதியார்; சிற்றிலக்கியங்கள் 96 வகை.</li></ul>"}]},{"id":"u7p","name":"அலகு VII – சமய முன்னோடிகள் & கவிஞர்கள்","topics":[{"t":"சமயப் பெரியோர்","html":"<ul><li>அப்பர் (திருநாவுக்கரசர், மருள்நீக்கியார்) – 4, 5, 6 திருமுறை; சம்பந்தர் – 1, 2, 3 (சீர்காழி); சுந்தரர் – 7 (திருநாவலூர்; தம்பிரான் தோழர்).</li><li>மாணிக்கவாசகர் – திருவாசகம், திருக்கோவையார் (8ஆம் திருமுறை); திருமூலர் – திருமந்திரம் (10ஆம் திருமுறை; 3000 பாடல்).</li><li>குலசேகர ஆழ்வார் – பெருமாள் திருமொழி; ஆண்டாள் – திருப்பாவை (30), நாச்சியார் திருமொழி (143).</li><li>தாயுமானவர் – தாயுமானவர் பாடல்கள்; வள்ளலார் இராமலிங்க அடிகள் – திருவருட்பா (ஆறு திருமுறை); சமரச சுத்த சன்மார்க்க சங்கம் (1865), சத்திய தருமசாலை (1867), சத்திய ஞானசபை (1872).</li></ul>"},{"t":"நவீன கவிஞர்கள்","html":"<ul><li>பாரதியார் (மகாகவி), பாரதிதாசன் (புரட்சிக்கவிஞர்), நாமக்கல் கவிஞர் (காந்தியக் கவிஞர்), கவிமணி (மலரும் மாலையும், ஆசிய ஜோதி), முடியரசன் (பூங்கொடி), வாணிதாசன் (தமிழ்நாட்டு வோர்ட்ஸ்வொர்த்), சுரதா (உவமைக் கவிஞர்), கண்ணதாசன் (கவியரசு; சேரமான் காதலி), உடுமலை நாராயண கவி (பகுத்தறிவுக் கவிராயர்), பட்டுக்கோட்டை கல்யாணசுந்தரம் (மக்கள் கவிஞர்), மருதகாசி.</li></ul>"},{"t":"புதுக்கவிதை","html":"<ul><li>ந. பிச்சமூர்த்தி (புதுக்கவிதையின் தந்தை), சி.சு. செல்லப்பா (‘எழுத்து’ இதழ்), தருமு சிவராமு, பசுவய்யா (சுந்தர ராமசாமி), ரா. மீனாட்சி, சி. மணி, சிற்பி, மு. மேத்தா (கண்ணீர்ப் பூக்கள்), ஈரோடு தமிழன்பன் (வணக்கம் வள்ளுவ), அப்துல் ரகுமான் (கவிக்கோ), கலாப்ரியா, கல்யாண்ஜி, ஞானக்கூத்தன்.</li></ul>"}]},{"id":"u7r","name":"அலகு VII – உரைநடை & மொழிப்பணிச் சான்றோர்","topics":[{"t":"தமிழ் அறிஞர்கள்","html":"<ul><li>உ.வே.சா. (தமிழ்த்தாத்தா; உத்தமதானபுரம்; 19.02.1855; பதிப்பு: சீவகசிந்தாமணி 1887, பத்துப்பாட்டு 1889, சிலப்பதிகாரம் 1892, புறநானூறு 1894, மணிமேகலை 1898; என் சரித்திரம்).</li><li>மறைமலையடிகள் (வேதாசலம்; தனித்தமிழ் இயக்கம் 1916; ஞானசாகரம்); பரிதிமாற்கலைஞர் (சூரியநாராயண சாஸ்திரி; தமிழைச் செம்மொழி என்றவர்); திரு.வி.க. (தமிழ்த்தென்றல்; தேசபக்தன், நவசக்தி).</li><li>ரா.பி. சேதுப்பிள்ளை (சொல்லின் செல்வர்; ஊரும் பேரும்); தேவநேயப் பாவாணர் (மொழி ஞாயிறு; ஒப்பியன் மொழிநூல்); தனிநாயக அடிகள் (Tamil Culture); சி. இலக்குவனார் (குறள்நெறி); செய்குத்தம்பி பாவலர் (சதாவதானி); பெருஞ்சித்திரனார் (பாவலரேறு; தென்மொழி).</li><li>ஜி.யு. போப் (திருக்குறள் 1886, திருவாசகம் 1900; ‘தமிழ் மாணவன்’); வீரமாமுனிவர் (இத்தாலி; தேம்பாவணி, சதுரகராதி, தொன்னூல் விளக்கம், பரமார்த்த குரு கதை); கால்டுவெல் (திராவிட மொழிகளின் ஒப்பிலக்கணம் 1856).</li></ul>"},{"t":"தமிழின் தொன்மையும் சிறப்பும்","html":"<ul><li>தமிழி (தமிழ் பிராமி) – மிகப் பழைய வரிவடிவம்; தொல்காப்பியம் – கிடைக்கும் பழமையான இலக்கணம்; செம்மொழி அறிவிப்பு 2004.</li><li>திராவிட மொழிகள்: தென்திராவிடம் (தமிழ், மலையாளம், கன்னடம், துளு…), நடுத்திராவிடம் (தெலுங்கு…), வடதிராவிடம் (பிராகுய்…).</li><li>அறிவியல் சிந்தனை: தொல்காப்பியம் – ஓரறிவு முதல் ஆறறிவு உயிர்வகை; பெரும்பாணாற்றுப்படை – கலங்கரை விளக்கம்.</li></ul>"}]},{"id":"u7t","name":"அலகு VII – சீர்திருத்தவாதிகள் – பெண்கள் – தமிழ்நாடு – உலகத் தமிழர்","topics":[{"t":"சீர்திருத்தவாதிகள்","html":"<ul><li>பெரியார் ஈ.வெ.ரா. (17.09.1879; சுயமரியாதை இயக்கம் 1925; குடியரசு, விடுதலை; வைக்கம் வீரர்; மறைவு 24.12.1973).</li><li>அண்ணா (காஞ்சிபுரம்; முதலமைச்சர் 1967; ‘தமிழ்நாடு’ பெயர் 1969; மறைவு 03.02.1969); அம்பேத்கர் (14.04.1891; அரசமைப்பு வரைவுக் குழு); காமராசர் (15.07.1903; கல்விக்கண் திறந்தவர்; பாரத ரத்னா 1976).</li><li>முத்துராமலிங்கத் தேவர் (30.10.1908; தேசியம் காத்த செம்மல்); ம.பொ. சிவஞானம் (சிலம்புச் செல்வர்); காயிதே மில்லத் (முகமது இஸ்மாயில்).</li></ul>"},{"t":"பெண்கள் பங்களிப்பு","html":"<ul><li>மூவலூர் இராமாமிர்தம் – தேவதாசி ஒழிப்பு இயக்கம்; டாக்டர் முத்துலட்சுமி (ரெட்டி) – முதல் பெண் மருத்துவர், அவ்வை இல்லம், அடையாறு புற்றுநோய் நிறுவனம்.</li><li>வேலுநாச்சியார் (சிவகங்கை; 1780); தில்லையாடி வள்ளியம்மை (தென்னாப்பிரிக்கா; 1914); இராணி மங்கம்மாள் (மதுரை நாயக்க அரசி); அன்னி பெசன்ட் (தன்னாட்சி இயக்கம் 1916).</li></ul>"},{"t":"தமிழ்நாடு – உலகத் தமிழர்","html":"<ul><li>பழைய கடல்வழி வணிகம்: புகார், கொற்கை, முசிறி; யவனர் பொன்னுடன் வந்து மிளகுடன் திரும்பினர்; அகழாய்வு: கீழடி, ஆதிச்சநல்லூர், கொடுமணல், அரிக்கமேடு.</li><li>ஓலைச்சுவடிகள்: எழுத்தாணி; தஞ்சை சரசுவதி மகால்; உணவே மருந்து – சித்த மருத்துவம் (வாதம், பித்தம், கபம்); மூலிகை: துளசி, வேம்பு, கற்றாழை, மஞ்சள், இஞ்சி.</li><li>உலகத் தமிழர்: இலங்கை, மலேசியா, சிங்கப்பூர் (தமிழ் ஆட்சி மொழிகளுள் ஒன்று), மொரிஷியஸ், தென்னாப்பிரிக்கா.</li></ul>"}]}];

const $ = s => document.querySelector(s);
const tabs = $("#tabs"), content = $("#content"), search = $("#search");
let active = SECTIONS[0].id;

function renderTabs(){
  const all = [...SECTIONS.map(s => [s.id, s.name]), ["qa","500 வினா-விடை"], ["quiz","பயிற்சி வினாக்கள்"]];
  tabs.innerHTML = "";
  all.forEach(([id,name]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name;
    b.setAttribute("aria-pressed", String(id === active && !search.value.trim()));
    b.onclick = () => { active = id; search.value = ""; render(); };
    tabs.appendChild(b);
  });
}

function topicHTML(t, open, q){
  let html = t.html;
  if(q){ // highlight text only, not tags
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
    html = html.replace(/>([^<]+)</g, (m, txt) => ">" + txt.replace(re, "<mark>$1</mark>") + "<");
  }
  return `<details ${open ? "open" : ""}><summary>${t.t}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  let score = 0, done = 0;
  content.innerHTML = `<h2>பயிற்சி வினாக்கள்</h2><div class="quiz" id="qz"></div><div class="score" id="score" aria-live="polite"></div>`;
  const qz = $("#qz");
  QUIZ.forEach((item, i) => {
    const box = document.createElement("div"); box.className = "q";
    box.innerHTML = `<div>${i+1}. ${item.q}</div><div class="opts"></div>`;
    const opts = box.querySelector(".opts");
    item.o.forEach((txt, j) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = txt;
      b.onclick = () => {
        if(opts.dataset.done) return;
        opts.dataset.done = 1; done++;
        const btns = opts.children;
        btns[item.a].classList.add("ok");
        if(j === item.a) score++; else b.classList.add("bad");
        if(done === QUIZ.length) $("#score").textContent = `உங்கள் மதிப்பெண்: ${score} / ${QUIZ.length}`;
      };
      opts.appendChild(b);
    });
    qz.appendChild(box);
  });
}

let qaPage=0, qaCat="all", qaText="", qaAll=false;
const PER=25;
function renderQA(focusSearch){
  const cats=[...new Set(QA.map(x=>x.c))];
  const t=qaText.toLowerCase();
  const list=QA.filter(x=>(qaCat==="all"||x.c===qaCat)&&(!t||(x.q+" "+x.a).toLowerCase().includes(t)));
  const pages=Math.max(1,Math.ceil(list.length/PER));
  qaPage=Math.min(qaPage,pages-1);
  const slice=list.slice(qaPage*PER,(qaPage+1)*PER);
  content.innerHTML=`<h2>500 வினா-விடை</h2>
  <div class="qa-bar">
    <select id="qaCat" aria-label="பிரிவு"><option value="all">அனைத்துப் பிரிவுகள் (${QA.length})</option>${cats.map(c=>`<option value="${c}" ${c===qaCat?"selected":""}>${c} (${QA.filter(x=>x.c===c).length})</option>`).join("")}</select>
    <input id="qaText" type="search" placeholder="இப்பிரிவில் தேடுக…" aria-label="வினா தேடல்">
    <button id="qaToggle" type="button">${qaAll?"விடைகளை மறை":"விடைகளைக் காட்டு"}</button>
  </div>
  <p class="meta">${list.length} வினாக்கள் · பக்கம் ${qaPage+1} / ${pages}</p>
  ${slice.length?slice.map(x=>`<details class="qa" ${qaAll?"open":""}><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join(""):'<p class="empty">வினாக்கள் இல்லை.</p>'}
  <div class="pager"><button id="qaPrev" type="button" ${qaPage===0?"disabled":""}>« முந்தையது</button><button id="qaNext" type="button" ${qaPage>=pages-1?"disabled":""}>அடுத்தது »</button></div>`;
  const ti=$("#qaText"); ti.value=qaText;
  if(focusSearch){ ti.focus(); ti.setSelectionRange(ti.value.length,ti.value.length); }
  $("#qaCat").onchange=e=>{qaCat=e.target.value;qaPage=0;renderQA();};
  ti.oninput=e=>{qaText=e.target.value;qaPage=0;renderQA(true);};
  $("#qaToggle").onclick=()=>{qaAll=!qaAll;renderQA();};
  $("#qaPrev").onclick=()=>{qaPage--;renderQA();window.scrollTo(0,0);};
  $("#qaNext").onclick=()=>{qaPage++;renderQA();window.scrollTo(0,0);};
}

function render(){
  renderTabs();
  const q = search.value.trim();
  if(q){
    const hits = [];
    SECTIONS.forEach(s => s.topics.forEach(t => {
      const plain = (t.t + " " + t.html.replace(/<[^>]+>/g," ")).toLowerCase();
      if(plain.includes(q.toLowerCase())) hits.push(t);
    }));
    const qh = QA.filter(x => (x.q + " " + x.a).toLowerCase().includes(q.toLowerCase())).slice(0, 40);
    const qhtml = qh.map(x => `<details class="qa"><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join("");
    content.innerHTML = `<h2>தேடல் முடிவுகள்</h2>` + ((hits.length || qh.length) ? hits.map(t => topicHTML(t, true, q)).join("") + (qh.length ? `<h2>வினா-விடை</h2>` + qhtml : "") : `<p class="empty">முடிவுகள் இல்லை. வேறு சொல்லில் தேடுக.</p>`);
    return;
  }
  if(active === "qa") return renderQA();
  if(active === "quiz") return renderQuiz();
  const s = SECTIONS.find(x => x.id === active);
  content.innerHTML = `<h2>${s.name}</h2>` + s.topics.map((t,i) => topicHTML(t, i === 0)).join("");
}

search.addEventListener("input", render);
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0e1714";
  const next = dark ? "light" : "dark";
  root.dataset.theme = next;
  try{ localStorage.setItem("skg-theme", next); }catch(e){}
};
try{ const t = localStorage.getItem("skg-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#yr").textContent = new Date().getFullYear();
render();
</script>
</body>
