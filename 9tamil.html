<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sundarraju TNPSC Kattral Ulagam</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f8f6; --card:#ffffff; --ink:#16231f; --muted:#5b6b66;
  --brand:#0f5c4d; --brand-ink:#ffffff; --accent:#e8a317; --line:#d7e2dd;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1714;--card:#16231f;--ink:#e7f0ec;--muted:#9bb0a8;--brand:#2fae94;--brand-ink:#08130f;--accent:#f0b43a;--line:#2a3c36;}
}
:root[data-theme="dark"]{--bg:#0e1714;--card:#16231f;--ink:#e7f0ec;--muted:#9bb0a8;--brand:#2fae94;--brand-ink:#08130f;--accent:#f0b43a;--line:#2a3c36;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;line-height:1.75}
header{background:var(--brand);color:var(--brand-ink);padding:28px 16px 22px;border-bottom:6px solid var(--accent)}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.25}
header p{margin:6px 0 0;opacity:.9}
.tools{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px;padding:10px 14px;border-radius:8px;border:2px solid transparent;font:inherit;background:#fff;color:#16231f}
.tools input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools button{padding:10px 16px;border-radius:8px;border:2px solid var(--brand-ink);background:transparent;color:var(--brand-ink);font:inherit;cursor:pointer}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
nav button{white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{padding:20px 0 60px}
h2{font-size:1.35rem;margin:6px 0 14px;color:var(--brand)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
details[open] summary{border-bottom:1px solid var(--line)}
.body{padding:10px 16px 14px}
.body ul{margin:0;padding-left:20px}
.body li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:6px}
.scroll{overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--bg)}
mark{background:var(--accent);color:#16231f;border-radius:3px;padding:0 2px}
.quiz .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.quiz .opts{display:grid;gap:8px;margin-top:8px}
.quiz .opts button{text-align:left;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.quiz .opts button.ok{background:#1f8a5b;color:#fff;border-color:#1f8a5b}
.quiz .opts button.bad{background:#c0392b;color:#fff;border-color:#c0392b}
.score{font-weight:700;margin:10px 0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.qa-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qa-bar select,.qa-bar input{flex:1;min-width:160px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.qa-bar button,.pager button{padding:9px 14px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;cursor:pointer}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.pager button:disabled{opacity:.4;cursor:default}
.meta{color:var(--muted);font-size:.9rem;margin:4px 0 12px}
details.qa summary{font-weight:500}
footer{text-align:center;color:var(--muted);padding:20px 16px 40px;font-size:.9rem}
</style>
</head>

    <p>சுந்தரராஜ் TNPSC கற்றல் உலகம் &mdash; குரூப் IV | 9ஆம் வகுப்பு தமிழ் குறிப்புகள் + 500 வினா-விடை</p>
    <div class="tools">
      <input id="search" type="search" placeholder="தேடுக… (எ.கா: பெரியபுராணம், தமிழ்விடு தூது)" aria-label="குறிப்புகளைத் தேடுக">
      <button id="theme" type="button">🌓 Theme</button>
    </div>
  </div>
</header>

const SECTIONS = [{"id":"i1","name":"இயல் 1 – அமுதென்று பேர்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>உரைநடை: திராவிட மொழிக்குடும்பம்</li><li>கவிதைப்பேழை: தமிழோவியம், தமிழ்விடு தூது</li><li>துணைப்பாடம்: வளரும் செல்வம்</li><li>இலக்கணம்: தொடர் இலக்கணம்</li></ul>"},{"t":"திராவிட மொழிக்குடும்பம்","html":"<ul><li>கால்டுவெல் – “திராவிட மொழிகளின் ஒப்பிலக்கணம்” (1856); இடையன்குடி (திருநெல்வேலி) யில் பணி; “திருநெல்வேலி சரித்திரம்” எழுதினார்.</li><li>தென்திராவிடம்: தமிழ், மலையாளம், கன்னடம், துளு, கொடகு, தோடா, கோத்தா.</li><li>நடுத்திராவிடம்: தெலுங்கு முதலியன. வடதிராவிடம்: பிராகுய் (பலுசிஸ்தான்), குரூக், மால்தோ.</li></ul>"},{"t":"தமிழோவியம் – ஈரோடு தமிழன்பன்","html":"<ul><li>இயற்பெயர் ஜெகதீசன்; ஹைக்கூ, சென்ரியு, லிமரைக்கூ வடிவங்களைத் தமிழில் தந்தவர்.</li><li>“வணக்கம் வள்ளுவ” நூலுக்குச் சாகித்திய அகாதெமி விருது.</li></ul>"},{"t":"தமிழ்விடு தூது","html":"<ul><li>சிற்றிலக்கியம் (தூது); கலிவெண்பா; 268 கண்ணிகள்; ஆசிரியர் தெரியவில்லை.</li><li>பாட்டுடைத் தலைவன்: மதுரை சொக்கநாதர்; தூது செல்பவர் தமிழ்; தூது விடுபவர் தலைவி.</li><li>தூதாகும் பொருள்கள் 10: அன்னம், மயில், கிளி, குயில், வண்டு, நெஞ்சம், முகில், தென்றல், தமிழ், மான்.</li><li>சிற்றிலக்கியங்கள் 96 (பிரபந்தம்); பாவினம் 3: தாழிசை, துறை, விருத்தம்; நவரசம் 9; நாவின் சுவை 6.</li></ul>"},{"t":"தொடர் இலக்கணம்","html":"<ul><li>தொடர் உறுப்புகள்: எழுவாய், பயனிலை, செயப்படுபொருள்.</li><li>கருத்துப்படி வாக்கியம்: செய்தி, வினா, விழைவு, உணர்ச்சி.</li><li>அமைப்புப்படி: தனி, தொடர், கூட்டு, கலவை.</li></ul>"}]},{"id":"i2","name":"இயல் 2 – உயிருக்கு வேர்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>உரைநடை: நீரின்றி அமையாது உலகு</li><li>கவிதைப்பேழை: பட்டமரம், பெரியபுராணம், புறநானூறு</li><li>துணைப்பாடம்: தண்ணீர்</li><li>இலக்கணம்: துணைவினைகள்</li></ul>"},{"t":"பட்டமரம் – தமிழ்ஒளி","html":"<ul><li>இயற்பெயர் விஜயரங்கம்; ஊர் புதுச்சேரி; நூல் “தமிழ்ஒளியின் கவிதைகள்”.</li><li>படைப்புகள்: நிலைபெற்ற சிலை, வீராயி.</li></ul>"},{"t":"பெரியபுராணம் – சேக்கிழார்","html":"<ul><li>இயற்பெயர் அருண்மொழித்தேவர்; ஊர் குன்றத்தூர்; பட்டம் உத்தமசோழப் பல்லவன்; இரண்டாம் குலோத்துங்கன் காலம்.</li><li>நூலின் பெயர் திருத்தொண்டர் மாக்கதை; பன்னிரண்டாம் திருமுறை; 13 சருக்கங்கள்; 4286 பாடல்கள்; 63 நாயன்மார்.</li><li>முதல்நூல்: சுந்தரரின் திருத்தொண்டத் தொகை; வழிநூல் துணை: நம்பியாண்டார் நம்பியின் திருத்தொண்டர் திருவந்தாதி.</li></ul>"},{"t":"புறநானூறு – குடபுலவியனார் பாடல்","html":"<ul><li>“நீரின்றி அமையா யாக்கைக்கு” எனத் தொடங்கும் பாடலைப் பாடியவர் குடபுலவியனார்; நீர்நிலைகளைப் பெருக்கி உணவு விளைவிப்பதன் இன்றியமையாமை கூறுகிறது.</li></ul>"},{"t":"துணைவினைகள்","html":"<ul><li>முதன்மை வினையோடு சேர்ந்து காலம், செயல்நிலை முதலியவற்றைக் காட்டும் வினை.</li><li>எ.கா: விடு, கொள், இரு, போ, வா, இடு – “எழுதிக்கொண்டிருக்கிறான்”, “சாப்பிட்டு விட்டான்”.</li></ul>"}]},{"id":"i3","name":"இயல் 3 – உள்ளத்தின் சீர்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>உரைநடை: ஏறுதழுவுதல்</li><li>கவிதைப்பேழை: மணிமேகலை</li><li>துணைப்பாடம்: அகழாய்வுகள்</li><li>இலக்கணம்: வல்லினம் மிகும் இடங்கள்</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"ஏறுதழுவுதல்","html":"<ul><li>கலித்தொகை முல்லைக்கலியில் (சோழன் நல்லுருத்திரன்) இடம்பெறுகிறது; முல்லை நில ஆயர்களின் வீர விளையாட்டு; ஏறுகோள் என்றும் பெயர்.</li><li>இன்றைய ஜல்லிக்கட்டு: அலங்காநல்லூர், பாலமேடு, அவனியாபுரம்.</li></ul>"},{"t":"மணிமேகலை","html":"<ul><li>ஆசிரியர் சீத்தலைச் சாத்தனார் (கூலவாணிகன்); 30 காதைகள்; பௌத்தக் காப்பியம்; மணிமேகலைத் துறவு.</li><li>சிலப்பதிகாரத்துடன் சேர்த்து இரட்டைக் காப்பியங்கள்; அமுதசுரபி மணிபல்லவத் தீவில் கிடைத்தது.</li></ul>"},{"t":"அகழாய்வுகள்","html":"<ul><li>கீழடி – வைகை, சிவகங்கை; ஆதிச்சநல்லூர் – தாமிரபரணி, தூத்துக்குடி; அரிக்கமேடு – புதுச்சேரி; கொடுமணல் – நொய்யல், ஈரோடு; அழகன்குளம் – இராமநாதபுரம்.</li><li>துறைமுகங்கள்: புகார் (சோழர்), கொற்கை (பாண்டியர்), முசிறி (சேரர்).</li></ul>"},{"t":"வல்லினம் மிகும் இடங்கள்","html":"<ul><li>அ, இ, உ சுட்டுகள் மற்றும் எ வினா: அந்தப் பையன், எந்தப் பொருள்.</li><li>அப்படி, இப்படி, எப்படி: அப்படிக் கூறினான்.</li><li>இரண்டாம், நான்காம் வேற்றுமைத் தொடர்கள்: பாடத்தைப் படித்தான், ஊருக்குச் சென்றான்.</li><li>இ ஈற்று வினையெச்சம்: ஓடிப் பார்த்தான்.</li></ul>"}]},{"id":"i4","name":"இயல் 4 – எட்டுத்திக்கும் சென்றிடுவீர்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>உரைநடை: இயந்திரங்களும் இணையவழிப் பயன்பாடும்</li><li>கவிதைப்பேழை: ஓ, என் சமகாலத் தோழர்களே!, உயிர்வகை</li><li>துணைப்பாடம்: விண்ணையும் சாடுவோம்</li><li>இலக்கணம்: வல்லினம் மிகா இடங்கள்</li></ul>"},{"t":"ஓ, என் சமகாலத் தோழர்களே! – வைரமுத்து","html":"<ul><li>பிறந்த ஊர் மெட்டூர் (தேனி); “கள்ளிக்காட்டு இதிகாசம்” நூலுக்குச் சாகித்திய அகாதெமி விருது; சிறப்புப் பெயர் கவிப்பேரரசு.</li><li>நூல்கள்: வைகறை மேகங்கள், கருவாச்சி காவியம், தண்ணீர் தேசம்.</li></ul>"},{"t":"உயிர்வகை (தொல்காப்பியம் – மரபியல்)","html":"<ul><li>ஓரறிவு: உற்றறிதல் – புல், மரம்; ஈரறிவு: + சுவை – சிப்பி, நத்தை; மூவறிவு: + மணம் – கரையான், எறும்பு.</li><li>நான்கறிவு: + கண் – நண்டு, தும்பி, வண்டு; ஐந்தறிவு: + செவி – பறவை, விலங்கு; ஆறறிவு: + மனம் – மனிதர்.</li></ul>"},{"t":"வல்லினம் மிகா இடங்கள்","html":"<ul><li>எழுவாய்த்தொடர், விளித்தொடர், வினைத்தொகை, வியங்கோள் வினைமுற்று, அது/இது/எது பின்.</li></ul>"}]},{"id":"i5","name":"இயல் 5 – கசடற மொழிதல்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>உரைநடை: கல்வியிற் சிறந்த பெண்கள்</li><li>கவிதைப்பேழை: குடும்ப விளக்கு, சிறுபஞ்சமூலம்</li><li>துணைப்பாடம்: வீட்டிற்கோர் புத்தகசாலை</li><li>இலக்கணம்: இடைச்சொல் – உரிச்சொல்</li></ul>"},{"t":"குடும்ப விளக்கு – பாரதிதாசன்","html":"<ul><li>இயற்பெயர் கனகசுப்புரத்தினம்; ஊர் புதுச்சேரி; பாரதியார் மீதுள்ள பற்றால் பாரதிதாசன்.</li><li>“குயில்” இதழ்; பிசிராந்தையார் நாடகத்துக்குச் சாகித்திய அகாதெமி; குடும்ப விளக்கு ஐந்து பகுதிகள்.</li></ul>"},{"t":"சிறுபஞ்சமூலம் – காரியாசான்","html":"<ul><li>பதினெண்கீழ்க்கணக்கு; வெண்பா; சமணம்; ஐந்து சிறு வேர்கள்: சிறுவழுதுணை, சிறுமல்லி, பெருமல்லி, நெருஞ்சி, கண்டங்கத்தரி.</li></ul>"},{"t":"இடைச்சொல் – உரிச்சொல்","html":"<ul><li>இடைச்சொல்: தனித்து இயங்காமல் பெயர், வினையைச் சார்ந்து வரும் (வேற்றுமை உருபு, உவம உருபு, விகுதி, சாரியை).</li><li>உரிச்சொல்: உறு, தவ, நனி, சாலவும் – மிகுதிப் பொருள்; மா – பெருமை; கடி – காவல், கூர்மை, விரைவு, மணம்.</li></ul>"}]},{"id":"i6","name":"இயல் 6 – கலை பல வளர்த்தல்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>உரைநடை: சிற்பக்கலை</li><li>கவிதைப்பேழை: இராவண காவியம், நாச்சியார் திருமொழி</li><li>துணைப்பாடம்: செய்தி</li><li>இலக்கணம்: புணர்ச்சி</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"சிற்பக்கலை","html":"<ul><li>மாமல்லபுரம் – முதலாம் நரசிம்மவர்மன் (மாமல்லன்); ஐந்து ரதங்கள்; அர்ச்சுனன் தபசு; யுனெஸ்கோ 1984.</li><li>தஞ்சைப் பெரிய கோயில் – முதலாம் இராசராசன்; யுனெஸ்கோ 1987; சிற்பி குஞ்சரமல்லன் இராசராசப் பெருந்தச்சன்.</li><li>ஐம்பொன்: பொன், வெள்ளி, செம்பு, இரும்பு, ஈயம்; சுவாமிமலை வெண்கலச் சிலைகள்; மெழுகு உருவ முறை.</li></ul>"},{"t":"இராவண காவியம் – புலவர் குழந்தை","html":"<ul><li>ஓலவலசு (ஈரோடு); 1946; ஐந்து காண்டங்கள்; இராவணனைத் தலைவனாகக் கொண்ட காப்பியம்.</li></ul>"},{"t":"நாச்சியார் திருமொழி – ஆண்டாள்","html":"<ul><li>இயற்பெயர் கோதை; பெரியாழ்வார் வளர்ப்பு மகள்; ஸ்ரீவில்லிபுத்தூர்; 143 பாடல்கள்; திருப்பாவை 30 பாடல்கள்; ஒரே பெண் ஆழ்வார்.</li></ul>"},{"t":"புணர்ச்சி","html":"<ul><li>நிலைமொழி + வருமொழி; இயல்புப் புணர்ச்சி, விகாரப் புணர்ச்சி (தோன்றல், திரிதல், கெடுதல்).</li><li>மரம்+வேர்=மரவேர் (கெடுதல்); பொன்+குடம்=பொற்குடம் (திரிதல்); பூ+கொடி=பூங்கொடி (தோன்றல்); திரு+அடி=திருவடி (வ் உடம்படுமெய்).</li></ul>"}]},{"id":"i7","name":"இயல் 7 – வாழிய நிலனே","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>உரைநடை: இந்திய தேசிய இராணுவத்தில் தமிழர் பங்கு</li><li>கவிதைப்பேழை: சீவகசிந்தாமணி, முத்தொள்ளாயிரம், மதுரைக்காஞ்சி</li><li>துணைப்பாடம்: சந்தை</li><li>இலக்கணம்: ஆகுபெயர்</li></ul>"},{"t":"இந்திய தேசிய இராணுவம்","html":"<ul><li>தலைவர் நேதாஜி சுபாஷ் சந்திர போஸ்; சிங்கப்பூர் 1943; “டெல்லி சலோ”; ஆசாத் ஹிந்த் அரசு.</li><li>ராணி ஜான்சி படைத் தலைவர் கேப்டன் இலட்சுமி (லட்சுமி சுவாமிநாதன்); ஜானகி ஆதிநாகப்பன்.</li></ul>"},{"t":"சீவகசிந்தாமணி","html":"<ul><li>திருத்தக்கதேவர்; சமணக் காப்பியம்; 13 இலம்பகம்; 3145 பாடல்; விருத்தப்பா; உ.வே.சா. 1887 பதிப்பு.</li></ul>"},{"t":"முத்தொள்ளாயிரம்","html":"<ul><li>சேர, சோழ, பாண்டியர் மூவரையும் பாடும் வெண்பா நூல்; ஆசிரியர் தெரியவில்லை.</li></ul>"},{"t":"மதுரைக்காஞ்சி","html":"<ul><li>மாங்குடி மருதனார்; பத்துப்பாட்டு; 782 அடிகள்; தலைவன் தலையாலங்கானத்துச் செருவென்ற நெடுஞ்செழியன்.</li></ul>"},{"t":"ஆகுபெயர் (16 வகை)","html":"<ul><li>மல்லிகை சூடினாள் – பொருளாகு; இந்தியா வென்றது – இடவாகு; டிசம்பர் வந்தது – காலவாகு; தலைக்கு நூறு பேர் – சினையாகு; வெள்ளை அடித்தான் – பண்பாகு; தமிழ் படித்தான் – சொல்லாகு.</li></ul>"}]},{"id":"i8","name":"இயல் 8 – என்தலைக் கடனே","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>உரைநடை: பெரியாரின் சிந்தனைகள்</li><li>கவிதைப்பேழை: ஒளியின் அழைப்பு, தாவோ தே ஜிங், யசோதர காவியம்</li><li>துணைப்பாடம்: மகனுக்கு எழுதிய கடிதம்</li><li>இலக்கணம்: யாப்பிலக்கணம்</li></ul>"},{"t":"பெரியாரின் சிந்தனைகள்","html":"<ul><li>ஈ.வெ. இராமசாமி; ஈரோடு; 17.09.1879; சுயமரியாதை இயக்கம் (1925); குடியரசு, விடுதலை, ரிவோல்ட் இதழ்கள்.</li><li>“பெரியார்” பட்டம் – 1938 பெண்கள் மாநாடு; வைக்கம் வீரர்; யுனெஸ்கோ பாராட்டு 1970; எழுத்துச் சீர்திருத்தம் 1978; மறைவு 1973.</li></ul>"},{"t":"ஒளியின் அழைப்பு – ந. பிச்சமூர்த்தி","html":"<ul><li>“புதுக்கவிதையின் தந்தை” எனப் போற்றப்படுபவர்.</li></ul>"},{"t":"தாவோ தே ஜிங்","html":"<ul><li>லாவோட்சே (சீனா); 81 அத்தியாயங்கள்; “தாவோ” = வழி.</li></ul>"},{"t":"யசோதர காவியம்","html":"<ul><li>ஐஞ்சிறு காப்பியங்களுள் ஒன்று; சமணம்; கொல்லாமையை வலியுறுத்துகிறது.</li></ul>"},{"t":"யாப்பிலக்கணம்","html":"<ul><li>உறுப்புகள் 6: எழுத்து, அசை, சீர், தளை, அடி, தொடை.</li><li>அசை 2: நேர், நிரை. அடி 5: குறளடி (2 சீர்), சிந்தடி (3), அளவடி (4), நெடிலடி (5), கழிநெடிலடி (5க்கு மேல்).</li><li>பா 4: வெண்பா, ஆசிரியப்பா, கலிப்பா, வஞ்சிப்பா. தளை 7; தொடை 8.</li></ul>"}]},{"id":"i9","name":"இயல் 9 – அன்பென்னும் அறனே","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>உரைநடை: விரிவாகும் ஆளுமை</li><li>கவிதைப்பேழை: அக்கறை, குறுந்தொகை</li><li>துணைப்பாடம்: தாய்மைக்கு வறட்சி இல்லை</li><li>இலக்கணம்: அணியிலக்கணம்</li></ul>"},{"t":"குறுந்தொகை","html":"<ul><li>எட்டுத்தொகை (அகம்); 401 பாடல்; 4–8 அடிகள்; தொகுத்தவர் பூரிக்கோ; கடவுள் வாழ்த்து: பாரதம் பாடிய பெருந்தேவனார்.</li><li>“யாயும் ஞாயும்” – செம்புலப் பெயல்நீரார்; செம்புலப் பெயல்நீர் போல அன்புடை நெஞ்சம் கலத்தல்.</li></ul>"},{"t":"அணியிலக்கணம்","html":"<ul><li>உவமை (உவமானம், உவமேயம், உவம உருபு, பொதுத்தன்மை); உருவகம்; தற்குறிப்பேற்றம்; பிறிதுமொழிதல்; வேற்றுமை; சிலேடை; வஞ்சப்புகழ்ச்சி; இல்பொருள் உவமை; சொற்பொருள் பின்வருநிலை.</li><li>அணியிலக்கண நூல்: தண்டியலங்காரம் (தண்டி).</li></ul>"}]}];

const QUIZ = [{"q":"“திராவிட மொழிகளின் ஒப்பிலக்கணம்” நூலின் ஆசிரியர்?","o":["ஜி.யு. போப்","கால்டுவெல்","வீரமாமுனிவர்","உ.வே.சா."],"a":1},{"q":"தமிழ்விடு தூதில் உள்ள கண்ணிகள் எத்தனை?","o":["96","143","268","400"],"a":2},{"q":"பெரியபுராணத்தின் ஆசிரியர்?","o":["சேக்கிழார்","கம்பர்","இளங்கோவடிகள்","திருத்தக்கதேவர்"],"a":0},{"q":"“ஓ, என் சமகாலத் தோழர்களே!” – ஆசிரியர்?","o":["பாரதிதாசன்","வைரமுத்து","தமிழ்ஒளி","ந. பிச்சமூர்த்தி"],"a":1},{"q":"இராவண காவியத்தின் ஆசிரியர்?","o":["புலவர் குழந்தை","கண்ணதாசன்","சுரதா","வாணிதாசன்"],"a":0}];

const QA = [{"n":1,"c":"இயல் 1","q":"9ஆம் வகுப்பு இயல் 1-இன் தலைப்பு?","a":"அமுதென்று பேர்"},{"n":2,"c":"இயல் 1","q":"இயல் 1-இல் உள்ள உரைநடைப் பாடம்?","a":"திராவிட மொழிக்குடும்பம்"},{"n":3,"c":"இயல் 1","q":"இயல் 1-இல் உள்ள கவிதைப்பேழைப் பாடங்கள்?","a":"தமிழோவியம், தமிழ்விடு தூது"},{"n":4,"c":"இயல் 1","q":"இயல் 1-இன் துணைப்பாடம்?","a":"வளரும் செல்வம்"},{"n":5,"c":"இயல் 1","q":"இயல் 1-இன் இலக்கணப் பகுதி?","a":"தொடர் இலக்கணம்"},{"n":6,"c":"இயல் 1","q":"“திராவிட மொழிகளின் ஒப்பிலக்கணம்” நூலின் ஆசிரியர்?","a":"கால்டுவெல்"},{"n":7,"c":"இயல் 1","q":"திராவிட மொழிகளின் ஒப்பிலக்கணம் எழுதப்பட்ட ஆண்டு?","a":"1856"},{"n":8,"c":"இயல் 1","q":"கால்டுவெல் தமிழகத்தில் தொண்டாற்றிய ஊர்?","a":"இடையன்குடி (திருநெல்வேலி மாவட்டம்)"},{"n":9,"c":"இயல் 1","q":"கால்டுவெல் எழுதிய வரலாற்று நூல்?","a":"திருநெல்வேலி சரித்திரம்"},{"n":10,"c":"இயல் 1","q":"பலுசிஸ்தானில் வழங்கும் திராவிட மொழி எது?","a":"பிராகுய்"},{"n":11,"c":"இயல் 1","q":"தென்திராவிட மொழிகளுள் மூன்று தருக.","a":"தமிழ், மலையாளம், கன்னடம் (துளு, கொடகு, தோடா, கோத்தா)"},{"n":12,"c":"இயல் 1","q":"தெலுங்கு எப்பிரிவைச் சார்ந்த திராவிட மொழி?","a":"நடுத்திராவிடம்"},{"n":13,"c":"இயல் 1","q":"வடதிராவிட மொழிகளுள் இரண்டு தருக.","a":"பிராகுய், குரூக் (மால்தோ)"},{"n":14,"c":"இயல் 1","q":"தமிழோவியம் கவிதையின் ஆசிரியர்?","a":"ஈரோடு தமிழன்பன்"},{"n":15,"c":"இயல் 1","q":"ஈரோடு தமிழன்பனின் இயற்பெயர்?","a":"ஜெகதீசன்"},{"n":16,"c":"இயல் 1","q":"ஈரோடு தமிழன்பன் சாகித்திய அகாதெமி விருது பெற்ற நூல்?","a":"வணக்கம் வள்ளுவ"},{"n":17,"c":"இயல் 1","q":"ஹைக்கூ எந்நாட்டுக் கவிதை வடிவம்?","a":"ஜப்பான்"},{"n":18,"c":"இயல் 1","q":"ஹைக்கூ கவிதையின் அடிகள் எத்தனை?","a":"3 அடிகள்"},{"n":19,"c":"இயல் 1","q":"ஈரோடு தமிழன்பன் தமிழில் அறிமுகப்படுத்திய புதுக்கவிதை வடிவங்கள் மூன்று?","a":"ஹைக்கூ, சென்ரியு, லிமரைக்கூ"},{"n":20,"c":"இயல் 1","q":"“காலம் பிறக்கும்முன் பிறந்தது தமிழே” – பாடியவர்?","a":"ஈரோடு தமிழன்பன்"},{"n":21,"c":"இயல் 1","q":"தமிழ்விடு தூது எவ்வகை இலக்கியம்?","a":"சிற்றிலக்கியம் (தூது இலக்கியம்)"},{"n":22,"c":"இயல் 1","q":"தமிழ்விடு தூது எந்தப் பாவகையில் அமைந்தது?","a":"கலிவெண்பா"},{"n":23,"c":"இயல் 1","q":"தமிழ்விடு தூது நூலில் உள்ள கண்ணிகள் எத்தனை?","a":"268"},{"n":24,"c":"இயல் 1","q":"தமிழ்விடு தூது நூலின் பாட்டுடைத் தலைவன்?","a":"மதுரை சொக்கநாதர்"},{"n":25,"c":"இயல் 1","q":"தமிழ்விடு தூது நூலின் ஆசிரியர் யார்?","a":"தெரியவில்லை (ஆசிரியர் பெயர் அறியப்படவில்லை)"},{"n":26,"c":"இயல் 1","q":"தமிழ்விடு தூதில் தூது செல்பவர் யார்?","a":"தமிழ்"},{"n":27,"c":"இயல் 1","q":"தமிழ்விடு தூதில் தூது விடுபவர் யார்?","a":"தலைவி"},{"n":28,"c":"இயல் 1","q":"தூதாக அனுப்பப்படும் பத்துப் பொருள்கள் யாவை?","a":"அன்னம், மயில், கிளி, குயில், வண்டு, நெஞ்சம், முகில், தென்றல், தமிழ், மான்"},{"n":29,"c":"இயல் 1","q":"சிற்றிலக்கியங்களின் எண்ணிக்கை?","a":"96 (பிரபந்தங்கள்)"},{"n":30,"c":"இயல் 1","q":"சிற்றிலக்கியங்களுக்கு வழங்கும் வேறு பெயர்?","a":"பிரபந்தம்"},{"n":31,"c":"இயல் 1","q":"குறம், பள்ளு என்பவை எவ்வகை இலக்கியங்கள்?","a":"சிற்றிலக்கிய வகைகள்"},{"n":32,"c":"இயல் 1","q":"இரண்டிரண்டு பூக்களை வைத்துத் தொடுக்கப்படும் மாலை?","a":"கண்ணி"},{"n":33,"c":"இயல் 1","q":"சிந்து என்பது ஒருவகை?","a":"இசைப்பாடல்"},{"n":34,"c":"இயல் 1","q":"தாழிசை, துறை, விருத்தம் என்பவை?","a":"பாவினங்கள் (மூன்று)"},{"n":35,"c":"இயல் 1","q":"செவிக்கு விருந்தளிக்கும் சுவைகள் (நவரசம்) எத்தனை?","a":"ஒன்பது"},{"n":36,"c":"இயல் 1","q":"நாவின் சுவைகள் எத்தனை?","a":"ஆறு"},{"n":37,"c":"இயல் 1","q":"நாவின் ஆறு சுவைகள் யாவை?","a":"இனிப்பு, புளிப்பு, கசப்பு, துவர்ப்பு, காரம், உவர்ப்பு"},{"n":38,"c":"இயல் 1","q":"நவரசங்கள் யாவை?","a":"வீரம், அச்சம், இழிப்பு, வியப்பு, காமம், அவலம், கோபம், நகை, சமநிலை"},{"n":39,"c":"இயல் 1","q":"தமிழ்விடு தூது கூறும் பத்துக் குணங்கள் யாவை?","a":"செறிவு, தெளிவு, சமநிலை, இன்பம், ஒழுகிசை, உதாரம், பொருண்மை, காந்தம், வலி, சமாதி"},{"n":40,"c":"இயல் 1","q":"“வண்ணம் நூறு” என்பது எதைக் குறிக்கும்?","a":"குறில் வண்ணம் முதல் இடைமெல்லிசை வண்ணம் வரை நூறு வண்ணங்கள்"},{"n":41,"c":"இயல் 1","q":"“ஊனரசம்” என்பதன் பொருள்?","a":"குறையுடைய சுவை"},{"n":42,"c":"இயல் 1","q":"“கொள்வார்” – பகுபத உறுப்புகளைப் பிரிக்க.","a":"கொள் + வ் + ஆர் (கொள் – பகுதி; வ் – எதிர்கால இடைநிலை; ஆர் – பலர்பால் வினைமுற்று விகுதி)"},{"n":43,"c":"இயல் 1","q":"“தூது” என்பதன் பொருள் என்ன?","a":"தலைவன்/தலைவி தம் எண்ணத்தைப் பிறர்வழி அறிவிக்கச் செய்தி அனுப்புதல்"},{"n":44,"c":"இயல் 1","q":"கருத்தைப் பொருத்து வாக்கியங்கள் எத்தனை வகை?","a":"4 (செய்தி, வினா, விழைவு, உணர்ச்சி)"},{"n":45,"c":"இயல் 1","q":"அமைப்பைப் பொருத்து வாக்கியங்கள் எத்தனை வகை?","a":"4 (தனி, தொடர், கூட்டு, கலவை)"},{"n":46,"c":"இயல் 1","q":"ஒரு தொடரில் செயலைச் செய்பவரைக் குறிக்கும் சொல்?","a":"எழுவாய்"},{"n":47,"c":"இயல் 1","q":"ஒரு தொடரில் செயலைக் குறிக்கும் சொல்?","a":"பயனிலை"},{"n":48,"c":"இயல் 1","q":"ஒரு தொடரில் செயலால் பாதிக்கப்படும் பொருளைக் குறிக்கும் சொல்?","a":"செயப்படுபொருள்"},{"n":49,"c":"இயல் 1","q":"ஒரே எழுவாய் கொண்டு பல பயனிலைகளைப் பெற்று வரும் வாக்கியம்?","a":"தொடர் வாக்கியம்"},{"n":50,"c":"இயல் 1","q":"ஒரு தனி எழுவாய்க்கு ஒரு பயனிலை மட்டும் வரும் வாக்கியம்?","a":"தனி வாக்கியம்"},{"n":51,"c":"இயல் 1","q":"இரண்டு தனி வாக்கியங்கள் இணைப்புச் சொல்லால் இணைவது?","a":"கூட்டு வாக்கியம்"},{"n":52,"c":"இயல் 1","q":"ஒரு முதன்மைத் தொடரும் அதைச் சார்ந்த துணைத்தொடரும் வருவது?","a":"கலவை வாக்கியம்"},{"n":53,"c":"இயல் 2","q":"9ஆம் வகுப்பு இயல் 2-இன் தலைப்பு?","a":"உயிருக்கு வேர்"},{"n":54,"c":"இயல் 2","q":"இயல் 2-இன் உரைநடைப் பாடம்?","a":"நீரின்றி அமையாது உலகு"},{"n":55,"c":"இயல் 2","q":"இயல் 2-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"பட்டமரம், பெரியபுராணம், புறநானூறு"},{"n":56,"c":"இயல் 2","q":"இயல் 2-இன் துணைப்பாடம்?","a":"தண்ணீர்"},{"n":57,"c":"இயல் 2","q":"இயல் 2-இன் இலக்கணப் பகுதி?","a":"துணைவினைகள்"},{"n":58,"c":"இயல் 2","q":"“நீரின்றி அமையாது உலகு” என்பது எந்நூலின் தொடரை ஒட்டியது?","a":"திருக்குறள் (வான்சிறப்பு)"},{"n":59,"c":"இயல் 2","q":"பட்டமரம் கவிதையின் ஆசிரியர்?","a":"தமிழ்ஒளி"},{"n":60,"c":"இயல் 2","q":"தமிழ்ஒளியின் இயற்பெயர்?","a":"விஜயரங்கம்"},{"n":61,"c":"இயல் 2","q":"தமிழ்ஒளி பிறந்த ஊர்?","a":"புதுச்சேரி (புதுவை)"},{"n":62,"c":"இயல் 2","q":"பட்டமரம் இடம்பெறும் நூல்?","a":"தமிழ்ஒளியின் கவிதைகள்"},{"n":63,"c":"இயல் 2","q":"தமிழ்ஒளியின் படைப்புகளுள் இரண்டு தருக.","a":"நிலைபெற்ற சிலை, வீராயி"},{"n":64,"c":"இயல் 2","q":"பெரியபுராணத்தின் ஆசிரியர்?","a":"சேக்கிழார்"},{"n":65,"c":"இயல் 2","q":"சேக்கிழாரின் இயற்பெயர்?","a":"அருண்மொழித்தேவர்"},{"n":66,"c":"இயல் 2","q":"சேக்கிழார் பிறந்த ஊர்?","a":"குன்றத்தூர்"},{"n":67,"c":"இயல் 2","q":"சேக்கிழாருக்குரிய பட்டம்?","a":"உத்தமசோழப் பல்லவன்"},{"n":68,"c":"இயல் 2","q":"சேக்கிழாரை ஆதரித்த மன்னன்?","a":"இரண்டாம் குலோத்துங்க சோழன்"},{"n":69,"c":"இயல் 2","q":"சேக்கிழார் தம் நூலுக்கு இட்ட பெயர்?","a":"திருத்தொண்டர் மாக்கதை"},{"n":70,"c":"இயல் 2","q":"பெரியபுராணம் பன்னிரு திருமுறைகளுள் எத்தனையாவது?","a":"12ஆம் திருமுறை"},{"n":71,"c":"இயல் 2","q":"பெரியபுராணத்தின் சருக்கங்கள் எத்தனை?","a":"13"},{"n":72,"c":"இயல் 2","q":"பெரியபுராணப் பாடல்கள் எத்தனை?","a":"4286"},{"n":73,"c":"இயல் 2","q":"பெரியபுராணத்தின் முதல்நூல் எது (சுந்தரர் இயற்றியது)?","a":"திருத்தொண்டத் தொகை"},{"n":74,"c":"இயல் 2","q":"திருத்தொண்டர் திருவந்தாதி இயற்றியவர்?","a":"நம்பியாண்டார் நம்பி"},{"n":75,"c":"இயல் 2","q":"“நீரின்றி அமையா யாக்கைக்கு” எனத் தொடங்கும் புறநானூற்றுப் பாடலைப் பாடியவர்?","a":"குடபுலவியனார்"},{"n":76,"c":"இயல் 2","q":"குடபுலவியனார் யாரை நோக்கிப் பாடினார்?","a":"பாண்டிய மன்னன் நெடுஞ்செழியன்"},{"n":77,"c":"இயல் 2","q":"குடபுலவியனார் பாடலின் மையக்கருத்து?","a":"நீர்நிலைகளைப் பெருக்கி உணவு விளைவிப்பவரே உயிர் கொடுத்தவர்"},{"n":78,"c":"இயல் 2","q":"புறநானூறு எவ்வகை நூல்?","a":"எட்டுத்தொகை (புறம்)"},{"n":79,"c":"இயல் 2","q":"ஒரு வினைச்சொல்லின் முதன்மை வினையோடு சேர்ந்து காலம், செயல் நிலை முதலியவற்றைக் காட்டும் வினை?","a":"துணைவினை"},{"n":80,"c":"இயல் 2","q":"“எழுதிக்கொண்டிருக்கிறான்” – இதில் துணைவினை?","a":"கொண்டிருக்கிறான் (கொண்டிரு)"},{"n":81,"c":"இயல் 2","q":"துணைவினைகளுக்கு எடுத்துக்காட்டு (மூன்று)?","a":"விடு, கொள், இரு, போ, வா, இடு"},{"n":82,"c":"இயல் 2","q":"“சாப்பிட்டு விட்டான்” – இதில் துணைவினை?","a":"விட்டான் (விடு)"},{"n":83,"c":"இயல் 2","q":"துணைவினைக்கு முன்வரும் வினை எவ்வாறு அழைக்கப்படும்?","a":"முதன்மை வினை"},{"n":84,"c":"இயல் 2","q":"மனிதன் உயிர்வாழ இன்றியமையாதது எனப் பட்டமரம் கவிதை எதனைக் குறிக்கிறது?","a":"மரம் (மரங்களின் இன்றியமையாமை)"},{"n":85,"c":"இயல் 2","q":"நீர் மேலாண்மையில் சிறந்த சங்ககால நீர்நிலை அமைப்புகள் இரண்டு?","a":"ஏரி, குளம் (கண்மாய், ஊருணி)"},{"n":86,"c":"இயல் 2","q":"ஏரிகளின் நீர் வெளியேறும் பகுதிக்குப் பெயர்?","a":"கலிங்கு (மடை)"},{"n":87,"c":"இயல் 2","q":"குளம், ஏரி நீரைக் கட்டுப்படுத்தும் மதகு?","a":"மடை"},{"n":88,"c":"இயல் 2","q":"திருத்தொண்டத் தொகையில் தொகையடியார் எத்தனை கூட்டத்தார்?","a":"9"},{"n":89,"c":"இயல் 2","q":"சுந்தரர் திருத்தொண்டத் தொகையில் முதலில் வணங்கிய அடியார்கள்?","a":"தில்லைவாழ் அந்தணர்"},{"n":90,"c":"இயல் 2","q":"63 நாயன்மார்களுள் பெண்கள் எத்தனை பேர்?","a":"3"},{"n":91,"c":"இயல் 2","q":"பெண் நாயன்மார்கள் மூவர் யாவர்?","a":"காரைக்கால் அம்மையார், மங்கையர்க்கரசியார், இசைஞானியார்"},{"n":92,"c":"இயல் 3","q":"9ஆம் வகுப்பு இயல் 3-இன் தலைப்பு?","a":"உள்ளத்தின் சீர்"},{"n":93,"c":"இயல் 3","q":"இயல் 3-இன் உரைநடைப் பாடம்?","a":"ஏறுதழுவுதல்"},{"n":94,"c":"இயல் 3","q":"இயல் 3-இன் கவிதைப்பேழைப் பாடம்?","a":"மணிமேகலை"},{"n":95,"c":"இயல் 3","q":"இயல் 3-இன் துணைப்பாடம்?","a":"அகழாய்வுகள்"},{"n":96,"c":"இயல் 3","q":"இயல் 3-இன் இலக்கணப் பகுதி?","a":"வல்லினம் மிகும் இடங்கள்"},{"n":97,"c":"இயல் 3","q":"இயல் 3-இன் வாழ்வியல் பகுதி?","a":"திருக்குறள்"},{"n":98,"c":"இயல் 3","q":"ஏறுதழுவுதல் பற்றிக் கூறும் சங்க நூல்?","a":"கலித்தொகை (முல்லைக்கலி)"},{"n":99,"c":"இயல் 3","q":"முல்லைக்கலியைப் பாடியவர்?","a":"சோழன் நல்லுருத்திரன்"},{"n":100,"c":"இயல் 3","q":"ஏறுதழுவுதல் எந்நில மக்களின் வீரவிளையாட்டு?","a":"முல்லை நில ஆயர்கள்"},{"n":101,"c":"இயல் 3","q":"ஏறுதழுவுதலின் இன்றைய வழக்குப் பெயர்கள்?","a":"ஜல்லிக்கட்டு (சல்லிக்கட்டு), மஞ்சுவிரட்டு"},{"n":102,"c":"இயல் 3","q":"ஜல்லிக்கட்டு நடைபெறும் புகழ்பெற்ற ஊர்கள் மூன்று?","a":"அலங்காநல்லூர், பாலமேடு, அவனியாபுரம்"},{"n":103,"c":"இயல் 3","q":"ஜல்லிக்கட்டு எப்பண்டிகையுடன் தொடர்புடையது?","a":"மாட்டுப்பொங்கல் (தைப்பொங்கல்)"},{"n":104,"c":"இயல் 3","q":"ஏறு என்பதன் பொருள்?","a":"காளை"},{"n":105,"c":"இயல் 3","q":"தழுவுதல் என்பதன் பொருள்?","a":"அணைத்தல் (அடக்குதல்)"},{"n":106,"c":"இயல் 3","q":"மணிமேகலையின் ஆசிரியர்?","a":"சீத்தலைச் சாத்தனார்"},{"n":107,"c":"இயல் 3","q":"சாத்தனாரின் தொழில் காரணமாக வழங்கும் பெயர்?","a":"கூலவாணிகன் சாத்தனார்"},{"n":108,"c":"இயல் 3","q":"மணிமேகலையின் காதைகள் எத்தனை?","a":"30"},{"n":109,"c":"இயல் 3","q":"மணிமேகலையின் வேறு பெயர்?","a":"மணிமேகலைத் துறவு"},{"n":110,"c":"இயல் 3","q":"சிலப்பதிகாரமும் மணிமேகலையும் சேர்ந்து எவ்வாறு அழைக்கப்படும்?","a":"இரட்டைக் காப்பியங்கள்"},{"n":111,"c":"இயல் 3","q":"மணிமேகலை எச்சமயக் காப்பியம்?","a":"பௌத்தம்"},{"n":112,"c":"இயல் 3","q":"மணிமேகலைக்கு அமுதசுரபி கிடைத்த இடம்?","a":"மணிபல்லவத் தீவு"},{"n":113,"c":"இயல் 3","q":"அகழாய்வு என்றால் என்ன?","a":"நிலத்தைத் தோண்டிப் பழங்காலப் பொருள்களைக் கண்டறிதல்"},{"n":114,"c":"இயல் 3","q":"கீழடி அகழாய்வு நடைபெற்ற ஆற்றங்கரை?","a":"வைகை"},{"n":115,"c":"இயல் 3","q":"கீழடி எம்மாவட்டத்தில் உள்ளது?","a":"சிவகங்கை"},{"n":116,"c":"இயல் 3","q":"ஆதிச்சநல்லூர் எவ்வாற்றங்கரையில் உள்ளது?","a":"தாமிரபரணி"},{"n":117,"c":"இயல் 3","q":"ஆதிச்சநல்லூர் எம்மாவட்டத்தில் உள்ளது?","a":"தூத்துக்குடி"},{"n":118,"c":"இயல் 3","q":"அரிக்கமேடு அகழாய்வு நடந்த இடம்?","a":"புதுச்சேரி"},{"n":119,"c":"இயல் 3","q":"கொடுமணல் எம்மாவட்டத்தில் உள்ளது?","a":"ஈரோடு (நொய்யல் ஆற்றங்கரை)"},{"n":120,"c":"இயல் 3","q":"அழகன்குளம் எம்மாவட்டத்தில் உள்ளது?","a":"இராமநாதபுரம்"},{"n":121,"c":"இயல் 3","q":"பாண்டியர்களின் பழைய துறைமுகம்?","a":"கொற்கை"},{"n":122,"c":"இயல் 3","q":"சேரர்களின் பழைய துறைமுகம்?","a":"முசிறி"},{"n":123,"c":"இயல் 3","q":"சோழர்களின் பழைய துறைமுகம்?","a":"புகார் (பூம்புகார்)"},{"n":124,"c":"இயல் 3","q":"“வல்லினம் மிகும்” என்றால் என்ன?","a":"சொற்களை இணைக்கும்போது க், ச், த், ப் ஒலிகள் மிகுந்து வருதல்"},{"n":125,"c":"இயல் 3","q":"அ, இ, உ என்னும் சுட்டெழுத்துகளுக்குப் பின் வல்லினம்?","a":"மிகும் (எ.கா: அந்தப் பையன், இந்தக் கடை)"},{"n":126,"c":"இயல் 3","q":"‘எ’ என்னும் வினா எழுத்தின் பின் வல்லினம்?","a":"மிகும் (எ.கா: எந்தப் பொருள்)"},{"n":127,"c":"இயல் 3","q":"அப்படி, இப்படி, எப்படி என்பவற்றின் பின் வல்லினம்?","a":"மிகும் (எ.கா: அப்படிக் கூறினான்)"},{"n":128,"c":"இயல் 3","q":"இரண்டாம் வேற்றுமைத் தொடரில் (ஐ உருபு) வல்லினம்?","a":"மிகும் (எ.கா: பாடத்தைப் படித்தான்)"},{"n":129,"c":"இயல் 3","q":"நான்காம் வேற்றுமைத் தொடரில் (கு உருபு) வல்லினம்?","a":"மிகும் (எ.கா: ஊருக்குச் சென்றான்)"},{"n":130,"c":"இயல் 3","q":"“ப்” மிகுந்து வரும் வினையெச்சத்திற்கு எடுத்துக்காட்டு?","a":"ஓடிப் பார்த்தான்"},{"n":131,"c":"இயல் 3","q":"திருக்குறளின் ஆசிரியர்?","a":"திருவள்ளுவர்"},{"n":132,"c":"இயல் 3","q":"திருக்குறளின் மொத்த அதிகாரங்கள்?","a":"133"},{"n":133,"c":"இயல் 3","q":"வல்லினம் மிகாத இடங்களுள் எழுவாய்த் தொடரில் வல்லினம்?","a":"மிகாது (எ.கா: மாணவர் படித்தனர்)"},{"n":134,"c":"இயல் 3","q":"வினைத்தொகையில் வல்லினம்?","a":"மிகாது (எ.கா: ஊறுகாய்)"},{"n":135,"c":"இயல் 3","q":"அகழாய்வுகளுக்குப் பெயர்பெற்ற துறை?","a":"தொல்லியல் துறை"},{"n":136,"c":"இயல் 3","q":"ஏறுதழுவுதலின் வேறு பெயர்?","a":"ஏறுகோள்"},{"n":137,"c":"இயல் 4","q":"9ஆம் வகுப்பு இயல் 4-இன் தலைப்பு?","a":"எட்டுத்திக்கும் சென்றிடுவீர்"},{"n":138,"c":"இயல் 4","q":"இயல் 4-இன் உரைநடைப் பாடம்?","a":"இயந்திரங்களும் இணையவழிப் பயன்பாடும்"},{"n":139,"c":"இயல் 4","q":"இயல் 4-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"ஓ, என் சமகாலத் தோழர்களே!, உயிர்வகை"},{"n":140,"c":"இயல் 4","q":"இயல் 4-இன் துணைப்பாடம்?","a":"விண்ணையும் சாடுவோம்"},{"n":141,"c":"இயல் 4","q":"இயல் 4-இன் இலக்கணப் பகுதி?","a":"வல்லினம் மிகா இடங்கள்"},{"n":142,"c":"இயல் 4","q":"“ஓ, என் சமகாலத் தோழர்களே!” கவிதையின் ஆசிரியர்?","a":"வைரமுத்து"},{"n":143,"c":"இயல் 4","q":"வைரமுத்து பிறந்த ஊர்?","a":"மெட்டூர் (தேனி மாவட்டம்)"},{"n":144,"c":"இயல் 4","q":"வைரமுத்துவுக்குச் சாகித்திய அகாதெமி விருது பெற்றுத் தந்த நூல்?","a":"கள்ளிக்காட்டு இதிகாசம்"},{"n":145,"c":"இயல் 4","q":"வைரமுத்துவுக்கு வழங்கப்படும் சிறப்புப் பெயர்?","a":"கவிப்பேரரசு"},{"n":146,"c":"இயல் 4","q":"வைரமுத்துவின் நூல்கள் இரண்டு தருக.","a":"வைகறை மேகங்கள், கருவாச்சி காவியம் (தண்ணீர் தேசம், மூன்றாம் உலகப்போர்)"},{"n":147,"c":"இயல் 4","q":"ஓ, என் சமகாலத் தோழர்களே! இடம்பெறும் வைரமுத்துவின் நூல்?","a":"ஓ, என் சமகாலத் தோழர்களே! (கவிதைத் தொகுப்பு)"},{"n":148,"c":"இயல் 4","q":"உயிர்வகை பாடம் இடம்பெறும் தொல்காப்பியப் பகுதி?","a":"மரபியல்"},{"n":149,"c":"இயல் 4","q":"தொல்காப்பியத்தின் ஆசிரியர்?","a":"தொல்காப்பியர்"},{"n":150,"c":"இயல் 4","q":"ஓரறிவு உயிர்கள் அறிவது?","a":"உற்றறிதல் (மெய், ஊறு)"},{"n":151,"c":"இயல் 4","q":"ஈரறிவு உயிர்களுக்கு உரிய உணர்வுகள்?","a":"மெய், வாய் (உற்றறிதல், சுவை)"},{"n":152,"c":"இயல் 4","q":"மூவறிவு உயிர்களுக்கு உரிய உணர்வுகள்?","a":"மெய், வாய், மூக்கு"},{"n":153,"c":"இயல் 4","q":"நான்கறிவு உயிர்களுக்கு உரிய உணர்வுகள்?","a":"மெய், வாய், மூக்கு, கண்"},{"n":154,"c":"இயல் 4","q":"ஐந்தறிவு உயிர்களுக்கு உரிய உணர்வுகள்?","a":"மெய், வாய், மூக்கு, கண், செவி"},{"n":155,"c":"இயல் 4","q":"ஆறறிவு உயிர்களுக்கு உரிய உணர்வுகள்?","a":"மெய், வாய், மூக்கு, கண், செவி, மனம்"},{"n":156,"c":"இயல் 4","q":"ஓரறிவு உயிர்களுக்கு எடுத்துக்காட்டு?","a":"புல், மரம், செடி"},{"n":157,"c":"இயல் 4","q":"ஈரறிவு உயிர்களுக்கு எடுத்துக்காட்டு?","a":"சிப்பி, நத்தை, சங்கு"},{"n":158,"c":"இயல் 4","q":"மூவறிவு உயிர்களுக்கு எடுத்துக்காட்டு?","a":"கரையான், எறும்பு"},{"n":159,"c":"இயல் 4","q":"நான்கறிவு உயிர்களுக்கு எடுத்துக்காட்டு?","a":"நண்டு, தும்பி, வண்டு"},{"n":160,"c":"இயல் 4","q":"ஐந்தறிவு உயிர்களுக்கு எடுத்துக்காட்டு?","a":"பறவை, விலங்கு, மீன்"},{"n":161,"c":"இயல் 4","q":"ஆறறிவு உயிர்கள் யாவை?","a":"மனிதர்"},{"n":162,"c":"இயல் 4","q":"வல்லினம் மிகாத இடங்களுள் அது, இது, எது ஆகியவற்றின் பின் வல்லினம்?","a":"மிகாது (எ.கா: அது கண்டான்)"},{"n":163,"c":"இயல் 4","q":"வியங்கோள் வினைமுற்றுக்குப் பின் வல்லினம்?","a":"மிகாது (எ.கா: வாழ்க தமிழ்)"},{"n":164,"c":"இயல் 4","q":"விளித்தொடரில் வல்லினம்?","a":"மிகாது (எ.கா: தம்பி கொடு)"},{"n":165,"c":"இயல் 4","q":"இணையம் என்பதன் ஆங்கிலப் பெயர்?","a":"Internet"},{"n":166,"c":"இயல் 4","q":"இணையவழிக் கல்வி எனப்படுவது?","a":"இணையத்தின் வழி கற்றல் (e-learning)"},{"n":167,"c":"இயல் 4","q":"கணினியின் நினைவகத்திற்கு வழங்கும் தமிழ்ச்சொல்?","a":"நினைவகம் (Memory)"},{"n":168,"c":"இயல் 4","q":"மின்னஞ்சல் என்பதன் ஆங்கிலம்?","a":"E-mail"},{"n":169,"c":"இயல் 4","q":"இணையத்தில் தேட உதவும் பொறி?","a":"தேடுபொறி (Search Engine)"},{"n":170,"c":"இயல் 5","q":"9ஆம் வகுப்பு இயல் 5-இன் தலைப்பு?","a":"கசடற மொழிதல்"},{"n":171,"c":"இயல் 5","q":"இயல் 5-இன் உரைநடைப் பாடம்?","a":"கல்வியிற் சிறந்த பெண்கள்"},{"n":172,"c":"இயல் 5","q":"இயல் 5-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"குடும்ப விளக்கு, சிறுபஞ்சமூலம்"},{"n":173,"c":"இயல் 5","q":"இயல் 5-இன் துணைப்பாடம்?","a":"வீட்டிற்கோர் புத்தகசாலை"},{"n":174,"c":"இயல் 5","q":"இயல் 5-இன் இலக்கணப் பகுதி?","a":"இடைச்சொல் – உரிச்சொல்"},{"n":175,"c":"இயல் 5","q":"குடும்ப விளக்கு நூலின் ஆசிரியர்?","a":"பாரதிதாசன்"},{"n":176,"c":"இயல் 5","q":"பாரதிதாசனின் இயற்பெயர்?","a":"கனகசுப்புரத்தினம்"},{"n":177,"c":"இயல் 5","q":"பாரதிதாசன் தம் பெயரை எந்தக் கவிஞரின் மீதுள்ள பற்றால் மாற்றிக்கொண்டார்?","a":"பாரதியார்"},{"n":178,"c":"இயல் 5","q":"பாரதிதாசன் நடத்திய இதழ்?","a":"குயில்"},{"n":179,"c":"இயல் 5","q":"பாரதிதாசனுக்குச் சாகித்திய அகாதெமி பெற்றுத் தந்த நாடக நூல்?","a":"பிசிராந்தையார்"},{"n":180,"c":"இயல் 5","q":"பாரதிதாசன் எழுதிய இசைப்பாடல் தொகுப்பு?","a":"இசையமுது"},{"n":181,"c":"இயல் 5","q":"பாரதிதாசனின் காப்பியங்களுள் இரண்டு?","a":"பாண்டியன் பரிசு, எதிர்பாராத முத்தம்"},{"n":182,"c":"இயல் 5","q":"குடும்ப விளக்கு எத்தனை பகுதிகளைக் கொண்டது?","a":"ஐந்து பகுதிகள்"},{"n":183,"c":"இயல் 5","q":"சிறுபஞ்சமூலத்தின் ஆசிரியர்?","a":"காரியாசான்"},{"n":184,"c":"இயல் 5","q":"சிறுபஞ்சமூலம் எந்தத் தொகுப்பைச் சேர்ந்த நூல்?","a":"பதினெண்கீழ்க்கணக்கு"},{"n":185,"c":"இயல் 5","q":"சிறுபஞ்சமூலத்தின் பாவகை?","a":"வெண்பா"},{"n":186,"c":"இயல் 5","q":"சிறுபஞ்சமூலம் என்பதன் பொருள்?","a":"ஐந்து சிறு வேர்கள்"},{"n":187,"c":"இயல் 5","q":"சிறுபஞ்சமூலத்தில் உள்ள ஐந்து வேர்கள் யாவை?","a":"சிறுவழுதுணை, சிறுமல்லி, பெருமல்லி, நெருஞ்சி, கண்டங்கத்தரி"},{"n":188,"c":"இயல் 5","q":"சிறுபஞ்சமூலம் எச்சமயத்தைச் சார்ந்தவரால் எழுதப்பட்டது?","a":"சமணம்"},{"n":189,"c":"இயல் 5","q":"இடைச்சொல் என்றால் என்ன?","a":"தனித்து இயங்காது பெயர், வினைச்சொற்களைச் சார்ந்து வரும் சொல்"},{"n":190,"c":"இயல் 5","q":"உரிச்சொல் என்றால் என்ன?","a":"பெயர், வினைகளின் பண்பு குறிக்கச் செய்யுளில் வரும் சொல்"},{"n":191,"c":"இயல் 5","q":"“உறு, தவ, நனி” என்னும் உரிச்சொற்களின் பொருள்?","a":"மிகுதி"},{"n":192,"c":"இயல் 5","q":"“சாலவும்” என்னும் உரிச்சொல்லின் பொருள்?","a":"மிகுதி"},{"n":193,"c":"இயல் 5","q":"“கடி” என்னும் உரிச்சொல்லின் ஒரு பொருள்?","a":"காவல், கூர்மை, விரைவு, மணம்"},{"n":194,"c":"இயல் 5","q":"“மாநீர்” – இதில் ‘மா’ எனும் உரிச்சொல்லின் பொருள்?","a":"பெருமை"},{"n":195,"c":"இயல் 5","q":"இடைச்சொற்கள் எவற்றைக் குறிக்கும்? (இரண்டு)","a":"வேற்றுமை உருபுகள், உவம உருபுகள், விகுதிகள், சாரியைகள்"},{"n":196,"c":"இயல் 5","q":"தமிழ்நாட்டின் முதல் பெண் மருத்துவர் எனப் போற்றப்படுபவர்?","a":"முத்துலட்சுமி ரெட்டி"},{"n":197,"c":"இயல் 5","q":"முத்துலட்சுமி ரெட்டி நிறுவிய மருத்துவமனை?","a":"அடையாறு புற்றுநோய் மருத்துவமனை (புற்றுநோய் நிறுவனம்)"},{"n":198,"c":"இயல் 5","q":"இந்தியாவில் முதன்முதலில் சட்டமன்ற உறுப்பினரான பெண்?","a":"முத்துலட்சுமி ரெட்டி"},{"n":199,"c":"இயல் 6","q":"9ஆம் வகுப்பு இயல் 6-இன் தலைப்பு?","a":"கலை பல வளர்த்தல்"},{"n":200,"c":"இயல் 6","q":"இயல் 6-இன் உரைநடைப் பாடம்?","a":"சிற்பக்கலை"},{"n":201,"c":"இயல் 6","q":"இயல் 6-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"இராவண காவியம், நாச்சியார் திருமொழி"},{"n":202,"c":"இயல் 6","q":"இயல் 6-இன் துணைப்பாடம்?","a":"செய்தி"},{"n":203,"c":"இயல் 6","q":"இயல் 6-இன் இலக்கணப் பகுதி?","a":"புணர்ச்சி"},{"n":204,"c":"இயல் 6","q":"இயல் 6-இன் வாழ்வியல் பகுதி?","a":"திருக்குறள்"},{"n":205,"c":"இயல் 6","q":"மாமல்லபுரம் சிற்பங்களை உருவாக்கிய பல்லவ மன்னன்?","a":"முதலாம் நரசிம்மவர்மன் (மாமல்லன்)"},{"n":206,"c":"இயல் 6","q":"மாமல்லபுரத்தின் பழைய பெயர்?","a":"மாமல்லை (கடல்மல்லை)"},{"n":207,"c":"இயல் 6","q":"மாமல்லபுரத்தில் உள்ள ஒற்றைக்கல் கோயில்கள் எத்தனை?","a":"ஐந்து ரதங்கள்"},{"n":208,"c":"இயல் 6","q":"மாமல்லபுரத்தின் பாறைச் சிற்பம் ஒன்று?","a":"அர்ச்சுனன் தபசு"},{"n":209,"c":"இயல் 6","q":"தஞ்சைப் பெரிய கோயிலைக் கட்டிய மன்னன்?","a":"முதலாம் இராசராசன்"},{"n":210,"c":"இயல் 6","q":"கங்கைகொண்ட சோழபுரத்தை உருவாக்கியவர்?","a":"முதலாம் இராசேந்திரன்"},{"n":211,"c":"இயல் 6","q":"சோழர் காலச் சிறப்புமிக்க உலோகச் சிலை?","a":"நடராசர் சிலை (வெண்கலச் சிலை)"},{"n":212,"c":"இயல் 6","q":"ஐம்பொன் உலோகங்கள் யாவை?","a":"பொன், வெள்ளி, செம்பு, இரும்பு, ஈயம்"},{"n":213,"c":"இயல் 6","q":"இராவண காவியத்தின் ஆசிரியர்?","a":"புலவர் குழந்தை"},{"n":214,"c":"இயல் 6","q":"புலவர் குழந்தை பிறந்த ஊர்?","a":"ஈரோடு மாவட்டம் ஓலவலசு"},{"n":215,"c":"இயல் 6","q":"இராவண காவியம் வெளிவந்த ஆண்டு?","a":"1946"},{"n":216,"c":"இயல் 6","q":"இராவண காவியத்தின் காண்டங்கள் எத்தனை?","a":"5"},{"n":217,"c":"இயல் 6","q":"இராவண காவியம் எவரைத் தலைவராகக் கொண்டது?","a":"இராவணன்"},{"n":218,"c":"இயல் 6","q":"நாச்சியார் திருமொழியின் ஆசிரியர்?","a":"ஆண்டாள்"},{"n":219,"c":"இயல் 6","q":"ஆண்டாளின் இயற்பெயர்?","a":"கோதை"},{"n":220,"c":"இயல் 6","q":"ஆண்டாளை வளர்த்தவர்?","a":"பெரியாழ்வார்"},{"n":221,"c":"இயல் 6","q":"ஆண்டாள் பிறந்த ஊர்?","a":"ஸ்ரீவில்லிபுத்தூர்"},{"n":222,"c":"இயல் 6","q":"நாச்சியார் திருமொழியில் உள்ள பாடல்கள் எத்தனை?","a":"143"},{"n":223,"c":"இயல் 6","q":"ஆண்டாள் இயற்றிய மற்றொரு நூல்?","a":"திருப்பாவை"},{"n":224,"c":"இயல் 6","q":"திருப்பாவையில் உள்ள பாடல்கள் எத்தனை?","a":"30"},{"n":225,"c":"இயல் 6","q":"ஆண்டாள் “சூடிக்கொடுத்த சுடர்க்கொடி” என அழைக்கப்படக் காரணம்?","a":"தான் சூடிய மாலையைத் திருமாலுக்கு அணிவித்ததால்"},{"n":226,"c":"இயல் 6","q":"நாச்சியார் திருமொழி நாலாயிர திவ்வியப் பிரபந்தத்தில் எப்பகுதி?","a":"முதலாயிரத்தின் பகுதி"},{"n":227,"c":"இயல் 6","q":"புணர்ச்சி என்றால் என்ன?","a":"இரு சொற்கள் அல்லது உறுப்புகள் இணைதல்"},{"n":228,"c":"இயல் 6","q":"புணர்ச்சியில் முதலில் நிற்கும் சொல்?","a":"நிலைமொழி"},{"n":229,"c":"இயல் 6","q":"புணர்ச்சியில் அடுத்து வரும் சொல்?","a":"வருமொழி"},{"n":230,"c":"இயல் 6","q":"புணர்ச்சி எத்தனை வகைப்படும்?","a":"2 (இயல்புப் புணர்ச்சி, விகாரப் புணர்ச்சி)"},{"n":231,"c":"இயல் 6","q":"விகாரப் புணர்ச்சி எத்தனை வகைப்படும்?","a":"3 (தோன்றல், திரிதல், கெடுதல்)"},{"n":232,"c":"இயல் 6","q":"“மரம் + வேர்” – புணர்ந்த சொல்?","a":"மரவேர் (கெடுதல் விகாரம்)"},{"n":233,"c":"இயல் 6","q":"“பொன் + குடம்” – புணர்ந்த சொல்?","a":"பொற்குடம் (திரிதல்)"},{"n":234,"c":"இயல் 6","q":"“பூ + கொடி” – புணர்ந்த சொல்?","a":"பூங்கொடி (தோன்றல்)"},{"n":235,"c":"இயல் 6","q":"“மணி + கதவு” புணர்ந்தால்?","a":"மணிக்கதவு (வல்லினம் மிகுதல்—தோன்றல்)"},{"n":236,"c":"இயல் 6","q":"“உடம்படுமெய்” எவை?","a":"ய், வ்"},{"n":237,"c":"இயல் 6","q":"உடம்படுமெய் தோன்றும் இடம்?","a":"உயிர் ஈற்றின் முன் உயிர் முதல் வரும்போது"},{"n":238,"c":"இயல் 6","q":"“திரு + அடி” – புணர்ந்த சொல்?","a":"திருவடி (வ் – உடம்படுமெய்)"},{"n":239,"c":"இயல் 6","q":"“மணி + அடி” – புணர்ந்த சொல்?","a":"மணியடி (ய் – உடம்படுமெய்)"},{"n":240,"c":"இயல் 6","q":"உயிர் வரின் உக்குறள் மெய்விட் டோடும் – எடுத்துக்காட்டு?","a":"நாடு + அது = நாடது"},{"n":241,"c":"இயல் 6","q":"ஆழ்வார்களுள் ஒரே பெண் ஆழ்வார் யார்?","a":"ஆண்டாள்"},{"n":242,"c":"இயல் 6","q":"ஆண்டாள் இயற்றிய நூல்கள் எத்தனை?","a":"2 (திருப்பாவை, நாச்சியார் திருமொழி)"},{"n":243,"c":"இயல் 6","q":"நாலாயிர திவ்வியப் பிரபந்தத்தைத் தொகுத்தவர்?","a":"நாதமுனிகள்"},{"n":244,"c":"இயல் 6","q":"மாமல்லபுரம் யுனெஸ்கோ உலகப் பாரம்பரியச் சின்னமாக அறிவிக்கப்பட்ட ஆண்டு?","a":"1984"},{"n":245,"c":"இயல் 6","q":"தஞ்சைப் பெரிய கோயில் யுனெஸ்கோ பாரம்பரியச் சின்னமான ஆண்டு?","a":"1987"},{"n":246,"c":"இயல் 6","q":"தஞ்சைப் பெரிய கோயிலைக் கட்டிய கட்டடக் கலைஞர்?","a":"குஞ்சரமல்லன் இராசராசப் பெருந்தச்சன்"},{"n":247,"c":"இயல் 6","q":"தஞ்சைப் பெரிய கோயிலின் வேறு பெயர்?","a":"இராசராசீச்சுரம் (பிரகதீசுவரர் கோயில்)"},{"n":248,"c":"இயல் 6","q":"வெண்கலச் சிலைகளுக்குப் பெயர்பெற்ற ஊர்?","a":"சுவாமிமலை (கும்பகோணம் அருகில்)"},{"n":249,"c":"இயல் 6","q":"உலோகச் சிலைகள் வார்க்கும் பழைய முறை?","a":"மெழுகு உருவ முறை (இழந்த மெழுகு முறை)"},{"n":250,"c":"இயல் 6","q":"கோயில் சிற்பங்களை வடிவமைக்கும் சிற்பிகள் எவ்வாறு அழைக்கப்படுவர்?","a":"ஸ்தபதிகள்"},{"n":251,"c":"இயல் 7","q":"9ஆம் வகுப்பு இயல் 7-இன் தலைப்பு?","a":"வாழிய நிலனே"},{"n":252,"c":"இயல் 7","q":"இயல் 7-இன் உரைநடைப் பாடம்?","a":"இந்திய தேசிய இராணுவத்தில் தமிழர் பங்கு"},{"n":253,"c":"இயல் 7","q":"இயல் 7-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"சீவகசிந்தாமணி, முத்தொள்ளாயிரம், மதுரைக்காஞ்சி"},{"n":254,"c":"இயல் 7","q":"இயல் 7-இன் துணைப்பாடம்?","a":"சந்தை"},{"n":255,"c":"இயல் 7","q":"இயல் 7-இன் இலக்கணப் பகுதி?","a":"ஆகுபெயர்"},{"n":256,"c":"இயல் 7","q":"இந்திய தேசிய இராணுவத்தின் தலைவர்?","a":"நேதாஜி சுபாஷ் சந்திர போஸ்"},{"n":257,"c":"இயல் 7","q":"இந்திய தேசிய இராணுவம் (INA) எ q":"அடிகளிலோ சீர்களிலோ முதல் எழுத்து ஒன்றிவரத் தொடுப்பது?","a":"மோனைத்தொடை"},{"n":327,"c":"இயல் 8","q":"அடிகளிலோ சீர்களிலோ இரண்டாம் எழுத்து ஒன்றிவரத் தொடுப்பது?","a":"எதுகைத்தொடை"},{"n":328,"c":"இயல் 8","q":"ஈற்றெழுத்தோ ஈற்றுச்சீரோ ஒன்றிவரத் தொடுப்பது?","a":"இயைபுத்தொடை"},{"n":329,"c":"இயல் 8","q":"பாக்கள் எத்தனை வகை?","a":"4 (வெண்பா, ஆசிரியப்பா, கலிப்பா, வஞ்சிப்பா)"},{"n":330,"c":"இயல் 8","q":"வெண்பாவின் ஈற்றடி எத்தனை சீர் கொண்டிருக்கும்?","a":"மூன்று சீர்"},{"n":331,"c":"இயல் 8","q":"வெண்பாவின் இறுதிச்சீர் எவ்வகை வாய்பாடு பெறும்?","a":"நாள், மலர், காசு, பிறப்பு"},{"n":332,"c":"இயல் 8","q":"ஆசிரியப்பாவின் இறுதி அடியில் முடியும் ஈற்றுச்சீர்?","a":"ஏகாரம் (ஏ) கொண்டு முடிவது சிறப்பு"},{"n":333,"c":"இயல் 8","q":"ஆசிரியப்பா எத்தனை வகை?","a":"4 (நேரிசை, இணைக்குறள், நிலைமண்டில, அடிமறி மண்டில)"},{"n":334,"c":"இயல் 8","q":"வெண்பா எத்தனை வகை?","a":"5 (குறள், சிந்தியல், நேரிசை, இன்னிசை, பஃறொடை)"},{"n":335,"c":"இயல் 8","q":"பெரியார் நடத்திய ஆங்கில இதழ்?","a":"ரிவோல்ட்"},{"n":336,"c":"இயல் 8","q":"பெரியார் மறைந்த ஆண்டு?","a":"1973"},{"n":337,"c":"இயல் 8","q":"ஐஞ்சிறு காப்பியங்கள் யாவை?","a":"நாககுமார காவியம், உதயணகுமார காவியம், யசோதர காவியம், நீலகேசி, சூளாமணி"},{"n":338,"c":"இயல் 9","q":"9ஆம் வகுப்பு இயல் 9-இன் தலைப்பு?","a":"அன்பென்னும் அறனே"},{"n":339,"c":"இயல் 9","q":"இயல் 9-இன் உரைநடைப் பாடம்?","a":"விரிவாகும் ஆளுமை"},{"n":340,"c":"இயல் 9","q":"இயல் 9-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"அக்கறை, குறுந்தொகை"},{"n":341,"c":"இயல் 9","q":"இயல் 9-இன் துணைப்பாடம்?","a":"தாய்மைக்கு வறட்சி இல்லை"},{"n":342,"c":"இயல் 9","q":"இயல் 9-இன் இலக்கணப் பகுதி?","a":"அணியிலக்கணம்"},{"n":343,"c":"இயல் 9","q":"குறுந்தொகை எவ்வகை நூல்?","a":"எட்டுத்தொகை (அகம்)"},{"n":344,"c":"இயல் 9","q":"குறுந்தொகைப் பாடல்கள் எத்தனை?","a":"401"},{"n":345,"c":"இயல் 9","q":"குறுந்தொகையின் அடி எல்லை?","a":"4 முதல் 8 அடிகள்"},{"n":346,"c":"இயல் 9","q":"குறுந்தொகையைத் தொகுத்தவர்?","a":"பூரிக்கோ"},{"n":347,"c":"இயல் 9","q":"குறுந்தொகைக் கடவுள் வாழ்த்துப் பாடியவர்?","a":"பாரதம் பாடிய பெருந்தேவனார்"},{"n":348,"c":"இயல் 9","q":"“யாயும் ஞாயும் யாராகியரோ” பாடலைப் பாடியவர்?","a":"செம்புலப் பெயல்நீரார்"},{"n":349,"c":"இயல் 9","q":"செம்புலப் பெயல்நீரார் என்ற பெயர் எவ்வாறு வந்தது?","a":"“செம்புலப் பெயல்நீர் போல” என்ற உவமையால்"},{"n":350,"c":"இயல் 9","q":"செம்புலப் பெயல்நீரார் பாடலில் உவமை எதற்கு?","a":"தலைவன் தலைவியின் அன்புள்ளம் கலத்தல்"},{"n":351,"c":"இயல் 9","q":"உவமை அணியின் உறுப்புகள் எத்தனை?","a":"4 (உவமானம், உவமேயம், உவம உருபு, பொதுத்தன்மை)"},{"n":352,"c":"இயல் 9","q":"உவமை அணிக்கு எடுத்துக்காட்டு?","a":"மலர் போன்ற முகம்"},{"n":353,"c":"இயல் 9","q":"“முகம் மதி” என உவமை உருபு இன்றி ஒன்றெனக் கூறுவது?","a":"உருவக அணி"},{"n":354,"c":"இயல் 9","q":"உருவக அணிக்கு எடுத்துக்காட்டு?","a":"முகமதி, வாழ்க்கைக் கடல்"},{"n":355,"c":"இயல் 9","q":"கூறவந்த கருத்தை வேறொன்றின் மேல் வைத்துக் கூறுவது?","a":"பிறிதுமொழிதல் அணி"},{"n":356,"c":"இயல் 9","q":"இரு பொருள்களின் வேறுபாட்டைக் கூறுவது?","a":"வேற்றுமை அணி"},{"n":357,"c":"இயல் 9","q":"இயற்கை நிகழ்ச்சியில் கவிஞர் தம் குறிப்பை ஏற்றிக் கூறுவது?","a":"தற்குறிப்பேற்ற அணி"},{"n":358,"c":"இயல் 9","q":"ஒரு சொல் பல பொருள் தர அமைவது?","a":"சிலேடை அணி"},{"n":359,"c":"இயல் 9","q":"இகழ்வது போலப் புகழ்வது அல்லது புகழ்வது போல இகழ்வது?","a":"வஞ்சப் புகழ்ச்சி அணி"},{"n":360,"c":"இயல் 9","q":"ஒரு பொருளுக்கு இல்லாத பொருளை உவமையாகக் கூறுவது?","a":"இல்பொருள் உவமை அணி"},{"n":361,"c":"இயல் 9","q":"ஒரு சொல் மீண்டும் மீண்டும் வேறு பொருளில் வருவது?","a":"சொற்பொருள் பின்வருநிலை அணி"},{"n":362,"c":"இயல் 9","q":"அணி என்பதன் பொருள்?","a":"அழகு"},{"n":363,"c":"இயல் 9","q":"அணியிலக்கணம் கூறும் தண்டியலங்காரத்தின் ஆசிரியர்?","a":"தண்டி"},{"n":364,"c":"நூல்–ஆசிரியர்","q":"வாய்க்கால் மீன்கள் நூலின் ஆசிரியர்?","a":"வெ. இறையன்பு"},{"n":365,"c":"நூல்–ஆசிரியர்","q":"மழைக்காலமும் குயிலோசையும் நூலின் ஆசிரியர்?","a":"மா. கிருஷ்ணன்"},{"n":366,"c":"நூல்–ஆசிரியர்","q":"தமிழர் சால்பு நூலின் ஆசிரியர்?","a":"சு. வித்யானந்தன்"},{"n":367,"c":"நூல்–ஆசிரியர்","q":"முதல் ஆசிரியர் நூலின் ஆசிரியர்?","a":"சிங்கிஸ் ஐத்மாத்தவ்"},{"n":368,"c":"நூல்–ஆசிரியர்","q":"கல்வியில் நாடகம் நூலின் ஆசிரியர்?","a":"பிரளயன்"},{"n":369,"c":"நூல்–ஆசிரியர்","q":"கரும்பலகை யுத்தம் நூலின் ஆசிரியர்?","a":"மலாலா"},{"n":370,"c":"நூல்–ஆசிரியர்","q":"ஓ, என் சமகாலத் தோழர்களே! நூலின் ஆசிரியர்?","a":"வைரமுத்து"},{"n":371,"c":"நூல்–ஆசிரியர்","q":"கள்ளிக்காட்டு இதிகாசம் நூலின் ஆசிரியர்?","a":"வைரமுத்து"},{"n":372,"c":"நூல்–ஆசிரியர்","q":"தமிழோவியம் கவிதையின் ஆசிரியர்?","a":"ஈரோடு தமிழன்பன்"},{"n":373,"c":"நூல்–ஆசிரியர்","q":"வணக்கம் வள்ளுவ நூலின் ஆசிரியர்?","a":"ஈரோடு தமிழன்பன்"},{"n":374,"c":"நூல்–ஆசிரியர்","q":"தமிழ்ஒளியின் கவிதைகள் நூலின் ஆசிரியர்?","a":"தமிழ்ஒளி"},{"n":375,"c":"நூல்–ஆசிரியர்","q":"நிலைபெற்ற சிலை நூலின் ஆசிரியர்?","a":"தமிழ்ஒளி"},{"n":376,"c":"நூல்–ஆசிரியர்","q":"திராவிட மொழிகளின் ஒப்பிலக்கணம் நூலின் ஆசிரியர்?","a":"கால்டுவெல்"},{"n":377,"c":"நூல்–ஆசிரியர்","q":"பெரியபுராணத்தின் ஆசிரியர்?","a":"சேக்கிழார்"},{"n":378,"c":"நூல்–ஆசிரியர்","q":"குடும்ப விளக்கு நூலின் ஆசிரியர்?","a":"பாரதிதாசன்"},{"n":379,"c":"நூல்–ஆசிரியர்","q":"பிசிராந்தையார் நாடக நூலின் ஆசிரியர்?","a":"பாரதிதாசன்"},{"n":380,"c":"நூல்–ஆசிரியர்","q":"சிறுபஞ்சமூலத்தின் ஆசிரியர்?","a":"காரியாசான்"},{"n":381,"c":"நூல்–ஆசிரியர்","q":"இராவண காவியத்தின் ஆசிரியர்?","a":"புலவர் குழந்தை"},{"n":382,"c":"நூல்–ஆசிரியர்","q":"நாச்சியார் திருமொழியின் ஆசிரியர்?","a":"ஆண்டாள்"},{"n":383,"c":"நூல்–ஆசிரியர்","q":"சீவகசிந்தாமணியின் ஆசிரியர்?","a":"திருத்தக்கதேவர்"},{"n":384,"c":"நூல்–ஆசிரியர்","q":"மணிமேகலையின் ஆசிரியர்?","a":"சீத்தலைச் சாத்தனார்"},{"n":385,"c":"நூல்–ஆசிரியர்","q":"மதுரைக்காஞ்சியின் ஆசிரியர்?","a":"மாங்குடி மருதனார்"},{"n":386,"c":"நூல்–ஆசிரியர்","q":"ஒளியின் அழைப்பு கவிதையின் ஆசிரியர்?","a":"ந. பிச்சமூர்த்தி"},{"n":387,"c":"நூல்–ஆசிரியர்","q":"தாவோ தே ஜிங் நூலின் ஆசிரியர்?","a":"லாவோட்சே"},{"n":388,"c":"நூல்–ஆசிரியர்","q":"தண்டியலங்காரத்தின் ஆசிரியர்?","a":"தண்டி"},{"n":389,"c":"நூல்–ஆசிரியர்","q":"முல்லைக்கலியின் ஆசிரியர்?","a":"சோழன் நல்லுருத்திரன்"},{"n":390,"c":"நூல்–ஆசிரியர்","q":"திருக்குறளின் ஆசிரியர்?","a":"திருவள்ளுவர்"},{"n":391,"c":"நூல்–ஆசிரியர்","q":"புறநானூற்றுப் பாடல் “நீரின்றி அமையா யாக்கைக்கு” – பாடியவர்?","a":"குடபுலவியனார்"},{"n":392,"c":"நூல்–ஆசிரியர்","q":"குறுந்தொகைப் பாடல் “யாயும் ஞாயும்” – பாடியவர்?","a":"செம்புலப் பெயல்நீரார்"},{"n":393,"c":"நூல்–ஆசிரியர்","q":"திருத்தொண்டத் தொகை நூலின் ஆசிரியர்?","a":"சுந்தரர்"},{"n":394,"c":"நூல்–ஆசிரியர்","q":"திருத்தொண்டர் திருவந்தாதி நூலின் ஆசிரியர்?","a":"நம்பியாண்டார் நம்பி"},{"n":395,"c":"நூல்–ஆசிரியர்","q":"திருப்பாவையின் ஆசிரியர்?","a":"ஆண்டாள்"},{"n":396,"c":"நூல்–ஆசிரியர்","q":"தமிழ்விடு தூது நூலின் பாட்டுடைத் தலைவன்?","a":"மதுரை சொக்கநாதர்"},{"n":397,"c":"நூல்–ஆசிரியர்","q":"தொல்காப்பியத்தின் ஆசிரியர்?","a":"தொல்காப்பியர்"},{"n":398,"c":"நூல்–ஆசிரியர்","q":"ஓலவலசு ஊரில் பிறந்த இராவண காவிய ஆசிரியர்?","a":"புலவர் குழந்தை"},{"n":399,"c":"நூல்–ஆசிரியர்","q":"பாண்டியன் பரிசு நூலின் ஆசிரியர்?","a":"பாரதிதாசன்"},{"n":400,"c":"நூல்–ஆசிரியர்","q":"எதிர்பாராத முத்தம் நூலின் ஆசிரியர்?","a":"பாரதிதாசன்"},{"n":401,"c":"நூல்–ஆசிரியர்","q":"இசையமுது நூலின் ஆசிரியர்?","a":"பாரதிதாசன்"},{"n":402,"c":"நூல்–ஆசிரியர்","q":"திருநெல்வேலி சரித்திரம் நூலின் ஆசிரியர்?","a":"கால்டுவெல்"},{"n":403,"c":"இலக்கணப் பயிற்சி","q":"பகுபதம் என்றால் என்ன?","a":"பகுதி, விகுதி முதலிய உறுப்புகளாகப் பிரிக்கக்கூடிய சொல்"},{"n":404,"c":"இலக்கணப் பயிற்சி","q":"பகுபத உறுப்புகள் எத்தனை?","a":"6"},{"n":405,"c":"இலக்கணப் பயிற்சி","q":"பகுபத உறுப்புகள் யாவை?","a":"பகுதி, விகுதி, இடைநிலை, சாரியை, சந்தி, விகாரம்"},{"n":406,"c":"இலக்கணப் பயிற்சி","q":"பகாப்பதம் என்றால் என்ன?","a":"பகுதி, விகுதி எனப் பிரிக்க இயலாத சொல்"},{"n":407,"c":"இலக்கணப் பயிற்சி","q":"பகுதி என்பது?","a":"சொல்லின் முதலில் நின்று பொருள் தரும் உறுப்பு"},{"n":408,"c":"இலக்கணப் பயிற்சி","q":"விகுதி என்பது?","a":"சொல்லின் இறுதியில் நின்று திணை, பால், எண், இடம் காட்டும் உறுப்பு"},{"n":409,"c":"இலக்கணப் பயிற்சி","q":"இடைநிலை என்பது?","a":"பகுதிக்கும் விகுதிக்கும் இடையே நின்று காலம் காட்டும் உறுப்பு"},{"n":410,"c":"இலக்கணப் பயிற்சி","q":"“நடந்தான்” – பகுபத உறுப்புகள்?","a":"நட + த்(ந்) + த் + ஆன் (நட – பகுதி, த் – சந்தி, ந் – விகாரம், த் – இறந்தகால இடைநிலை, ஆன் – விகுதி)"},{"n":411,"c":"இலக்கணப் பயிற்சி","q":"“வாழ்ந்தனர்” – பகுபத உறுப்புகள்?","a":"வாழ் + த்(ந்) + த் + அன் + அர்"},{"n":412,"c":"இலக்கணப் பயிற்சி","q":"“உண்டான்” – பகுபத உறுப்பு பிரிப்பு?","a":"உண் + ட் + ஆன் (ட் – இறந்தகால இடைநிலை)"},{"n":413,"c":"இலக்கணப் பயிற்சி","q":"இறந்தகால இடைநிலைகள் எவை?","a":"த், ட், ற், இன்"},{"n":414,"c":"இலக்கணப் பயிற்சி","q":"நிகழ்கால இடைநிலைகள் எவை?","a":"கிறு, கின்று, ஆநின்று"},{"n":415,"c":"இலக்கணப் பயிற்சி","q":"எதிர்கால இடைநிலைகள் எவை?","a":"ப், வ்"},{"n":416,"c":"இலக்கணப் பயிற்சி","q":"“செய்வான்” – பிரிக்க.","a":"செய் + வ் + ஆன் (வ் – எதிர்கால இடைநிலை)"},{"n":417,"c":"இலக்கணப் பயிற்சி","q":"“பாடுகிறாள்” – பிரிக்க.","a":"பாடு + கிறு + ஆள்"},{"n":418,"c":"இலக்கணப் பயிற்சி","q":"வினைமுற்று என்றால் என்ன?","a":"பொருள் முற்றுப்பெற்று நிற்கும் வினைச்சொல்"},{"n":419,"c":"இலக்கணப் பயிற்சி","q":"பெயரெச்சம் என்றால் என்ன?","a":"எச்சமாக நின்று பெயரைக் கொண்டு முடியும் வினை (எ.கா: வந்த பையன்)"},{"n":420,"c":"இலக்கணப் பயிற்சி","q":"வினையெச்சம் என்றால் என்ன?","a":"எச்சமாக நின்று வினையைக் கொண்டு முடியும் வினை (எ.கா: வந்து போனான்)"},{"n":421,"c":"இலக்கணப் பயிற்சி","q":"வினைச்சொல் எத்தனை வகைப்படும்?","a":"தெரிநிலை வினை, குறிப்பு வினை"},{"n":422,"c":"இலக்கணப் பயிற்சி","q":"காலம் காட்டும் வினை?","a":"தெரிநிலை வினை"},{"n":423,"c":"இலக்கணப் பயிற்சி","q":"காலம் காட்டாமல் பண்பு முதலியன காட்டும் வினை?","a":"குறிப்பு வினை"},{"n":424,"c":"இலக்கணப் பயிற்சி","q":"தன்வினை என்றால் என்ன?","a":"எழுவாய் தானே செய்யும் வினை (எ.கா: கதவு திறந்தது)"},{"n":425,"c":"இலக்கணப் பயிற்சி","q":"பிறவினை என்றால் என்ன?","a":"எழுவாய் பிறரைக் கொண்டு செய்விக்கும் வினை (எ.கா: கதவைத் திறந்தான்)"},{"n":426,"c":"இலக்கணப் பயிற்சி","q":"செய்வினை என்றால் என்ன?","a":"எழுவாய் செயலைச் செய்யும் வாக்கியம் (ராமன் பாடம் படித்தான்)"},{"n":427,"c":"இலக்கணப் பயிற்சி","q":"செயப்பாட்டு வினை என்றால் என்ன?","a":"செயப்படுபொருள் எழுவாயாக வரும் வாக்கியம் (பாடம் படிக்கப்பட்டது)"},{"n":428,"c":"இலக்கணப் பயிற்சி","q":"பெயர்ச்சொற்கள் எத்தனை வகை?","a":"6"},{"n":429,"c":"இலக்கணப் பயிற்சி","q":"“வெண்மை” என்பது எவ்வகைப் பெயர்?","a":"பண்புப்பெயர்"},{"n":430,"c":"இலக்கணப் பயிற்சி","q":"“ஆடல்” என்பது எவ்வகைப் பெயர்?","a":"தொழிற்பெயர்"},{"n":431,"c":"இலக்கணப் பயிற்சி","q":"“மதுரை” என்பது எவ்வகைப் பெயர்?","a":"இடப்பெயர்"},{"n":432,"c":"இலக்கணப் பயிற்சி","q":"“கண்” என்பது எவ்வகைப் பெயர்?","a":"சினைப்பெயர்"},{"n":433,"c":"இலக்கணப் பயிற்சி","q":"“தை” என்பது எவ்வகைப் பெயர்?","a":"காலப்பெயர்"},{"n":434,"c":"இலக்கணப் பயிற்சி","q":"சுட்டெழுத்துகள் எவை?","a":"அ, இ, உ"},{"n":435,"c":"இலக்கணப் பயிற்சி","q":"வினா எழுத்துகள் எவை?","a":"எ, யா, ஆ, ஓ, ஏ"},{"n":436,"c":"இலக்கணப் பயிற்சி","q":"அண்மைச் சுட்டு எது?","a":"இ"},{"n":437,"c":"இலக்கணப் பயிற்சி","q":"சேய்மைச் சுட்டு எது?","a":"அ"},{"n":438,"c":"இலக்கணப் பயிற்சி","q":"சுட்டுப் பெயருக்கு எடுத்துக்காட்டு?","a":"அவன், இவள், அது"},{"n":439,"c":"இலக்கணப் பயிற்சி","q":"வினாப் பெயருக்கு எடுத்துக்காட்டு?","a":"யார், எவன், எது"},{"n":440,"c":"இலக்கணப் பயிற்சி","q":"ஒரு சொல் பல பொருளைத் தருவது?","a":"பலபொருள் ஒருசொல்"},{"n":441,"c":"இலக்கணப் பயிற்சி","q":"“ஆறு” என்னும் சொல்லின் பொருள்கள்?","a":"நதி, எண் (6), வழி"},{"n":442,"c":"இலக்கணப் பயிற்சி","q":"“கண்” என்பதன் பொருள்கள்?","a":"விழி, துளை, இடம்"},{"n":443,"c":"இலக்கணப் பயிற்சி","q":"“ஞாயிறு” என்பதன் பொருள்?","a":"சூரியன்"},{"n":444,"c":"இலக்கணப் பயிற்சி","q":"“திங்கள்” என்பதன் பொருள்?","a":"சந்திரன்"},{"n":445,"c":"இலக்கணப் பயிற்சி","q":"“வானம்” என்பதன் வேறு பெயர்?","a":"விண், ஆகாயம், நபம்"},{"n":446,"c":"இலக்கணப் பயிற்சி","q":"“கடல்” என்பதன் வேறு பெயர்கள்?","a":"ஆழி, முந்நீர், வாரி"},{"n":447,"c":"இலக்கணப் பயிற்சி","q":"“மரம்” என்பதன் வேறு பெயர்கள்?","a":"தரு, விருட்சம், பாதவம்"},{"n":448,"c":"இலக்கணப் பயிற்சி","q":"“யானை” என்பதன் வேறு பெயர்கள்?","a":"களிறு, பிடி, கரி, வேழம்"},{"n":449,"c":"இலக்கணப் பயிற்சி","q":"யானையின் ஆண் பெயர்?","a":"களிறு"},{"n":450,"c":"இலக்கணப் பயிற்சி","q":"யானையின் பெண் பெயர்?","a":"பிடி"},{"n":451,"c":"இலக்கணப் பயிற்சி","q":"யானையின் குட்டிப் பெயர்?","a":"கன்று"},{"n":452,"c":"இலக்கணப் பயிற்சி","q":"சிங்கத்தின் குட்டிப் பெயர்?","a":"குருளை"},{"n":453,"c":"இலக்கணப் பயிற்சி","q":"புலியின் குட்டிப் ப // ---------- APP ----------
const $ = s => document.querySelector(s);
const tabs = $("#tabs"), content = $("#content"), search = $("#search");
let active = SECTIONS[0].id;

function renderTabs(){
  const all = [...SECTIONS.map(s => [s.id, s.name]), ["qa","500 வினா-விடை"], ["quiz","பயிற்சி வினாக்கள்"]];
  tabs.innerHTML = "";
  all.forEach(([id,name]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name;
    b.setAttribute("aria-pressed", String(id === active && !search.value.trim()));
    b.onclick = () => { active = id; search.value = ""; render(); };
    tabs.appendChild(b);
  });
}

function topicHTML(t, open, q){
  let html = t.html;
  if(q){ // highlight text only, not tags
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
    html = html.replace(/>([^<]+)</g, (m, txt) => ">" + txt.replace(re, "<mark>$1</mark>") + "<");
  }
  return `<details ${open ? "open" : ""}><summary>${t.t}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  let score = 0, done = 0;
  content.innerHTML = `<h2>பயிற்சி வினாக்கள்</h2><div class="quiz" id="qz"></div><div class="score" id="score" aria-live="polite"></div>`;
  const qz = $("#qz");
  QUIZ.forEach((item, i) => {
    const box = document.createElement("div"); box.className = "q";
    box.innerHTML = `<div>${i+1}. ${item.q}</div><div class="opts"></div>`;
    const opts = box.querySelector(".opts");
    item.o.forEach((txt, j) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = txt;
      b.onclick = () => {
        if(opts.dataset.done) return;
        opts.dataset.done = 1; done++;
        const btns = opts.children;
        btns[item.a].classList.add("ok");
        if(j === item.a) score++; else b.classList.add("bad");
        if(done === QUIZ.length) $("#score").textContent = `உங்கள் மதிப்பெண்: ${score} / ${QUIZ.length}`;
      };
      opts.appendChild(b);
    });
    qz.appendChild(box);
  });
}

let qaPage=0, qaCat="all", qaText="", qaAll=false;
const PER=25;
function renderQA(focusSearch){
  const cats=[...new Set(QA.map(x=>x.c))];
  const t=qaText.toLowerCase();
  const list=QA.filter(x=>(qaCat==="all"||x.c===qaCat)&&(!t||(x.q+" "+x.a).toLowerCase().includes(t)));
  const pages=Math.max(1,Math.ceil(list.length/PER));
  qaPage=Math.min(qaPage,pages-1);
  const slice=list.slice(qaPage*PER,(qaPage+1)*PER);
  content.innerHTML=`<h2>500 வினா-விடை</h2>
  <div class="qa-bar">
    <select id="qaCat" aria-label="பிரிவு"><option value="all">அனைத்துப் பிரிவுகள் (${QA.length})</option>${cats.map(c=>`<option value="${c}" ${c===qaCat?"selected":""}>${c} (${QA.filter(x=>x.c===c).length})</option>`).join("")}</select>
    <input id="qaText" type="search" placeholder="இப்பிரிவில் தேடுக…" aria-label="வினா தேடல்">
    <button id="qaToggle" type="button">${qaAll?"விடைகளை மறை":"விடைகளைக் காட்டு"}</button>
  </div>
  <p class="meta">${list.length} வினாக்கள் · பக்கம் ${qaPage+1} / ${pages}</p>
  ${slice.length?slice.map(x=>`<details class="qa" ${qaAll?"open":""}><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join(""):'<p class="empty">வினாக்கள் இல்லை.</p>'}
  <div class="pager"><button id="qaPrev" type="button" ${qaPage===0?"disabled":""}>« முந்தையது</button><button id="qaNext" type="button" ${qaPage>=pages-1?"disabled":""}>அடுத்தது »</button></div>`;
  const ti=$("#qaText"); ti.value=qaText;
  if(focusSearch){ ti.focus(); ti.setSelectionRange(ti.value.length,ti.value.length); }
  $("#qaCat").onchange=e=>{qaCat=e.target.value;qaPage=0;renderQA();};
  ti.oninput=e=>{qaText=e.target.value;qaPage=0;renderQA(true);};
  $("#qaToggle").onclick=()=>{qaAll=!qaAll;renderQA();};
  $("#qaPrev").onclick=()=>{qaPage--;renderQA();window.scrollTo(0,0);};
  $("#qaNext").onclick=()=>{qaPage++;renderQA();window.scrollTo(0,0);};
}

function render(){
  renderTabs();
  const q = search.value.trim();
  if(q){
    const hits = [];
    SECTIONS.forEach(s => s.topics.forEach(t => {
      const plain = (t.t + " " + t.html.replace(/<[^>]+>/g," ")).toLowerCase();
      if(plain.includes(q.toLowerCase())) hits.push(t);
    }));
    const qh = QA.filter(x => (x.q + " " + x.a).toLowerCase().includes(q.toLowerCase())).slice(0, 40);
    const qhtml = qh.map(x => `<details class="qa"><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join("");
    content.innerHTML = `<h2>தேடல் முடிவுகள்</h2>` + ((hits.length || qh.length) ? hits.map(t => topicHTML(t, true, q)).join("") + (qh.length ? `<h2>வினா-விடை</h2>` + qhtml : "") : `<p class="empty">முடிவுகள் இல்லை. வேறு சொல்லில் தேடுக.</p>`);
    return;
  }
  if(active === "qa") return renderQA();
  if(active === "quiz") return renderQuiz();
  const s = SECTIONS.find(x => x.id === active);
  content.innerHTML = `<h2>${s.name}</h2>` + s.topics.map((t,i) => topicHTML(t, i === 0)).join("");
}

search.addEventListener("input", render);
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0e1714";
  const next = dark ? "light" : "dark";
  root.dataset.theme = next;
  try{ localStorage.setItem("skg-theme", next); }catch(e){}
};
try{ const t = localStorage.getItem("skg-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#yr").textContent = new Date().getFullYear();
render();
</script>
