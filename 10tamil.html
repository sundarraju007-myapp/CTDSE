html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;line-height:1.75}

summary::after{content:"+";color:var(--accent);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
details[open] summary{border-bottom:1px solid var(--line)}
.body{padding:10px 16px 14px}
.body ul{margin:0;padding-left:20px}
.body li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:6px}

mark{background:var(--accent);color:#16231f;border-radius:3px;padding:0 2px}

லாதியின் ஆசிரியர்?","a":"கணிமேதாவியார்"},{"n":153,"c":"சங்க இலக்கியம்","q":"பதினெண்கீழ்க்கணக்கில் நீதி நூல்கள் எத்தனை?","a":"11"},{"n":154,"c":"சங்க இலக்கியம்","q":"பதினெண்கீழ்க்கணக்கில் அகம் சார்ந்த நூல்கள் எத்தனை?","a":"6"},{"n":155,"c":"சங்க இலக்கியம்","q":"பதினெண்கீழ்க்கணக்கில் புறம் சார்ந்த நூல் எது?","a":"களவழி நாற்பது"},{"n":156,"c":"காப்பியங்கள்","q":"ஐம்பெருங்காப்பியங்கள் யாவை?","a":"சிலப்பதிகாரம், மணிமேகலை, சீவகசிந்தாமணி, வளையாபதி, குண்டலகேசி"},{"n":157,"c":"காப்பியங்கள்","q":"ஐஞ்சிறுகாப்பியங்கள் யாவை?","a":"நாககுமார காவியம், உதயணகுமார காவியம், யசோதர காவியம், நீலகேசி, சூளாமணி"},{"n":158,"c":"காப்பியங்கள்","q":"சிலப்பதிகாரத்தின் ஆசிரியர்?","a":"இளங்கோவடிகள்"},{"n":159,"c":"காப்பியங்கள்","q":"இளங்கோவடிகளின் அண்ணன் யார்?","a":"சேரன் செங்குட்டுவன்"},{"n":160,"c":"காப்பியங்கள்","q":"சிலப்பதிகாரத்தின் காண்டங்கள் எத்தனை?","a":"3 (புகார், மதுரை, வஞ்சி)"},{"n":161,"c":"காப்பியங்கள்","q":"சிலப்பதிகாரத்தின் காதைகள் எத்தனை?","a":"30"},{"n":162,"c":"காப்பியங்கள்","q":"புகார்க் காண்டத்தில் உள்ள காதைகள்?","a":"10"},{"n":163,"c":"காப்பியங்கள்","q":"மதுரைக் காண்டத்தில் உள்ள காதைகள்?","a":"13"},{"n":164,"c":"காப்பியங்கள்","q":"வஞ்சிக் காண்டத்தில் உள்ள காதைகள்?","a":"7"},{"n":165,"c":"காப்பியங்கள்","q":"சிலப்பதிகாரம் எந்தப் பாவகையால் ஆனது?","a":"நிலைமண்டில ஆசிரியப்பா"},{"n":166,"c":"காப்பியங்கள்","q":"சிலப்பதிகாரம் வேறு எப்பெயர்களால் போற்றப்படுகிறது?","a":"முத்தமிழ்க் காப்பியம், குடிமக்கள் காப்பியம், ஒற்றுமைக் காப்பியம்"},{"n":167,"c":"காப்பியங்கள்","q":"சிலப்பதிகாரம் கூறும் மூன்று உண்மைகள் யாவை?","a":"அரசியல் பிழைத்தோர்க்கு அறமே கூற்றாகும்; உரைசால் பத்தினியை உயர்ந்தோர் ஏத்துவர்; ஊழ்வினை உருத்து வந்தூட்டும்"},{"n":168,"c":"காப்பியங்கள்","q":"சிலப்பதிகாரத்தின் தலைவி யார்?","a":"கண்ணகி"},{"n":169,"c":"காப்பியங்கள்","q":"கோவலனின் தந்தை பெயர்?","a":"மாசாத்துவான்"},{"n":170,"c":"காப்பியங்கள்","q":"கண்ணகியின் தந்தை பெயர்?","a":"மாநாய்கன்"},{"n":171,"c":"காப்பியங்கள்","q":"கோவலனுக்கும் மாதவிக்கும் பிறந்த மகள்?","a":"மணிமேகலை"},{"n":172,"c":"காப்பியங்கள்","q":"கோவலனைக் கொல்ல ஆணையிட்ட பாண்டிய மன்னன்?","a":"நெடுஞ்செழியன்"},{"n":173,"c":"காப்பியங்கள்","q":"கண்ணகிக்குக் கல் எடுத்துச் சிலை நிறுவிய சேர மன்னன்?","a":"சேரன் செங்குட்டுவன்"},{"n":174,"c":"காப்பியங்கள்","q":"சிலப்பதிகாரத்திற்கு உரை எழுதிய உரையாசிரியர்கள் இருவர்?","a":"அரும்பதவுரையாசிரியர், அடியார்க்கு நல்லார்"},{"n":175,"c":"காப்பியங்கள்","q":"“நெஞ்சையள்ளும் சிலப்பதிகாரம் என்றோர் மணியாரம் படைத்த தமிழ்நாடு” என்றவர்?","a":"பாரதியார்"},{"n":176,"c":"காப்பியங்கள்","q":"மணிமேகலையின் ஆசிரியர்?","a":"சீத்தலைச் சாத்தனார்"},{"n":177,"c":"காப்பியங்கள்","q":"மணிமேகலை எச்சமயக் காப்பியம்?","a":"பௌத்தம்"},{"n":178,"c":"காப்பியங்கள்","q":"மணிமேகலையின் காதைகள் எத்தனை?","a":"30"},{"n":179,"c":"காப்பியங்கள்","q":"மணிமேகலை எந்தப் பாவகையால் ஆனது?","a":"ஆசிரியப்பா"},{"n":180,"c":"காப்பியங்கள்","q":"மணிமேகலைக்கு அமுதசுரபியைத் தந்தவர் யார்?","a":"ஆபுத்திரன் (மணிபல்லவத் தீவில் தெய்வம் மூலம்)"},{"n":181,"c":"காப்பியங்கள்","q":"“பசிப்பிணி மருத்துவன்” என்று போற்றப்படுபவர்?","a":"ஆபுத்திரன்"},{"n":182,"c":"காப்பியங்கள்","q":"சீவகசிந்தாமணியின் ஆசிரியர்?","a":"திருத்தக்கதேவர்"},{"n":183,"c":"காப்பியங்கள்","q":"சீவகசிந்தாமணி எச்சமயக் காப்பியம்?","a":"சமணம்"},{"n":184,"c":"காப்பியங்கள்","q":"சீவகசிந்தாமணியின் பிரிவுகள் எவ்வாறு அழைக்கப்படும்?","a":"இலம்பகம் (13 இலம்பகங்கள்)"},{"n":185,"c":"காப்பியங்கள்","q":"சீவகசிந்தாமணி எந்தப் பாவகையால் ஆனது?","a":"விருத்தப்பா"},{"n":186,"c":"காப்பியங்கள்","q":"“மணநூல்” என அழைக்கப்படும் காப்பியம்?","a":"சீவகசிந்தாமணி"},{"n":187,"c":"காப்பியங்கள்","q":"குண்டலகேசியின் ஆசிரியர்?","a":"நாதகுத்தனார்"},{"n":188,"c":"காப்பியங்கள்","q":"குண்டலகேசி எச்சமயக் காப்பியம்?","a":"பௌத்தம்"},{"n":189,"c":"காப்பியங்கள்","q":"சூளாமணியின் ஆசிரியர்?","a":"தோலாமொழித் தேவர்"},{"n":190,"c":"காப்பியங்கள்","q":"கம்பராமாயணத்தின் ஆசிரியர்?","a":"கம்பர்"},{"n":191,"c":"காப்பியங்கள்","q":"கம்பரின் ஊர்?","a":"தேரழுந்தூர்"},{"n":192,"c":"காப்பியங்கள்","q":"கம்பரை ஆதரித்த வள்ளல்?","a":"திருவெண்ணெய்நல்லூர் சடையப்ப வள்ளல்"},{"n":193,"c":"காப்பியங்கள்","q":"கம்பராமாயணத்தின் காண்டங்கள் எத்தனை?","a":"6"},{"n":194,"c":"காப்பியங்கள்","q":"கம்பராமாயணத்தின் ஆறு காண்டங்கள் யாவை?","a":"பாலம், அயோத்தியா, ஆரண்ய, கிட்கிந்தா, சுந்தர, யுத்த காண்டம்"},{"n":195,"c":"காப்பியங்கள்","q":"கம்பராமாயணத்தின் மூல நூல்?","a":"வால்மீகி இராமாயணம்"},{"n":196,"c":"காப்பியங்கள்","q":"கம்பராமாயணத்தின் முதற்பெயர்?","a":"இராமாவதாரம்"},{"n":197,"c":"காப்பியங்கள்","q":"கம்பர் இயற்றிய உழவுத் தொழில் பற்றிய நூல்?","a":"ஏர் எழுபது"},{"n":198,"c":"காப்பியங்கள்","q":"கம்பரின் வேறு நூல்கள் இரண்டு தருக.","a":"சடகோபர் அந்தாதி, சரஸ்வதி அந்தாதி, சிலை எழுபது, திருக்கை வழக்கம்"},{"n":199,"c":"காப்பியங்கள்","q":"பெரியபுராணத்தின் ஆசிரியர்?","a":"சேக்கிழார்"},{"n":200,"c":"காப்பியங்கள்","q":"பெரியபுராணத்தின் வேறு பெயர்?","a":"திருத்தொண்டர் புராணம்"},{"n":201,"c":"காப்பியங்கள்","q":"பெரியபுராணம் எத்தனை நாயன்மார்களின் வரலாற்றைக் கூறுகிறது?","a":"63"},{"n":202,"c":"காப்பியங்கள்","q":"பெரியபுராணம் பன்னிரு திருமுறைகளில் எத்தனையாவது?","a":"12ஆம் திருமுறை"},{"n":203,"c":"காப்பியங்கள்","q":"தேம்பாவணியின் ஆசிரியர்?","a":"வீரமாமுனிவர்"},{"n":204,"c":"காப்பியங்கள்","q":"தேம்பாவணியின் தலைவர் யார்?","a":"சூசையப்பர் (ஜோசப்)"},{"n":205,"c":"காப்பியங்கள்","q":"“வாடாத பாமாலை” என்று பொருள்படும் நூல்?","a":"தேம்பாவணி"},{"n":206,"c":"காப்பியங்கள்","q":"சீறாப்புராணத்தின் ஆசிரியர்?","a":"உமறுப்புலவர்"},{"n":207,"c":"காப்பியங்கள்","q":"சீறாப்புராணம் யாருடைய வரலாற்றைக் கூறுகிறது?","a":"நபிகள் நாயகம்"},{"n":208,"c":"காப்பியங்கள்","q":"உமறுப்புலவரை ஆதரித்த வள்ளல்?","a":"சீதக்காதி"},{"n":209,"c":"காப்பியங்கள்","q":"இரட்சணிய யாத்திரிகத்தின் ஆசிரியர்?","a":"எச்.ஏ. கிருட்டிணப்பிள்ளை"},{"n":210,"c":"காப்பியங்கள்","q":"“கிறித்தவக் கம்பர்” என்று போற்றப்படுபவர்?","a":"எச்.ஏ. கிருட்டிணப்பிள்ளை"},{"n":211,"c":"காப்பியங்கள்","q":"பாஞ்சாலி சபதத்தின் ஆசிரியர்?","a":"பாரதியார்"},{"n":212,"c":"காப்பியங்கள்","q":"இயேசு காவியத்தின் ஆசிரியர்?","a":"கண்ணதாசன்"},{"n":213,"c":"காப்பியங்கள்","q":"கந்தபுராணத்தின் ஆசிரியர்?","a":"கச்சியப்ப சிவாசாரியார்"},{"n":214,"c":"காப்பியங்கள்","q":"திருவிளையாடற் புராணத்தின் ஆசிரியர்?","a":"பரஞ்சோதி முனிவர்"},{"n":215,"c":"காப்பியங்கள்","q":"வில்லிபாரதத்தின் ஆசிரியர்?","a":"வில்லிபுத்தூரார்"},{"n":216,"c":"காப்பியங்கள்","q":"நளவெண்பாவின் ஆசிரியர்?","a":"புகழேந்திப் புலவர்"},{"n":217,"c":"காப்பியங்கள்","q":"பாரத வெண்பாவின் ஆசிரியர்?","a":"பெருந்தேவனார்"},{"n":218,"c":"காப்பியங்கள்","q":"கலிங்கத்துப்பரணியின் ஆசிரியர்?","a":"செயங்கொண்டார்"},{"n":219,"c":"காப்பியங்கள்","q":"தக்கயாகப்பரணியின் ஆசிரியர்?","a":"ஒட்டக்கூத்தர்"},{"n":220,"c":"இலக்கணம்","q":"தமிழ் இலக்கணத்தின் ஐந்து பிரிவுகள் யாவை?","a":"எழுத்து, சொல், பொருள், யாப்பு, அணி"},{"n":221,"c":"இலக்கணம்","q":"தமிழ் எழுத்துகளின் மொத்த எண்ணிக்கை?","a":"247"},{"n":222,"c":"இலக்கணம்","q":"முதலெழுத்துகள் எத்தனை?","a":"30 (உயிர் 12 + மெய் 18)"},{"n":223,"c":"இலக்கணம்","q":"சார்பெழுத்துகள் எத்தனை?","a":"10"},{"n":224,"c":"இலக்கணம்","q":"சார்பெழுத்துகளின் வகைகள் யாவை?","a":"உயிர்மெய், ஆய்தம், உயிரளபெடை, ஒற்றளபெடை, குற்றியலுகரம், குற்றியலிகரம், ஐகாரக்குறுக்கம், ஔகாரக்குறுக்கம், மகரக்குறுக்கம், ஆய்தக்குறுக்கம்"},{"n":225,"c":"இலக்கணம்","q":"உயிரெழுத்துகள் எத்தனை?","a":"12"},{"n":226,"c":"இலக்கணம்","q":"மெய்யெழுத்துகள் எத்தனை?","a":"18"},{"n":227,"c":"இலக்கணம்","q":"உயிர்மெய் எழுத்துகள் எத்தனை?","a":"216"},{"n":228,"c":"இலக்கணம்","q":"ஆய்த எழுத்து எத்தனை?","a":"1 (ஃ)"},{"n":229,"c":"இலக்கணம்","q":"குறில் எழுத்துகள் எத்தனை?","a":"5 (அ இ உ எ ஒ)"},{"n":230,"c":"இலக்கணம்","q":"நெடில் எழுத்துகள் எத்தனை?","a":"7 (ஆ ஈ ஊ ஏ ஐ ஓ ஔ)"},{"n":231,"c":"இலக்கணம்","q":"வல்லின எழுத்துகள் யாவை?","a":"க் ச் ட் த் ப் ற்"},{"n":232,"c":"இலக்கணம்","q":"மெல்லின எழுத்துகள் யாவை?","a":"ங் ஞ் ண் ந் ம் ன்"},{"n":233,"c":"இலக்கணம்","q":"இடையின எழுத்துகள் யாவை?","a":"ய் ர் ல் வ் ழ் ள்"},{"n":234,"c":"இலக்கணம்","q":"‘க’ வுக்கு இனமான மெல்லெழுத்து?","a":"ங்"},{"n":235,"c":"இலக்கணம்","q":"‘ச’ வுக்கு இனமான மெல்லெழுத்து?","a":"ஞ்"},{"n":236,"c":"இலக்கணம்","q":"‘ட’ வுக்கு இனமான மெல்லெழுத்து?","a":"ண்"},{"n":237,"c":"இலக்கணம்","q":"‘த’ வுக்கு இனமான மெல்லெழுத்து?","a":"ந்"},{"n":238,"c":"இலக்கணம்","q":"‘ப’ வுக்கு இனமான மெல்லெழுத்து?","a":"ம்"},{"n":239,"c":"இலக்கணம்","q":"‘ற’ வுக்கு இனமான மெல்லெழுத்து?","a":"ன்"},{"n":240,"c":"இலக்கணம்","q":"குறிலின் மாத்திரை அளவு?","a":"1 மாத்திரை"},{"n":241,"c":"இலக்கணம்","q":"நெடிலின் மாத்திரை அளவு?","a":"2 மாத்திரை"},{"n":242,"c":"இலக்கணம்","q":"மெய்யெழுத்தின் மாத்திரை அளவு?","a":"½ மாத்திரை"},{"n":243,"c":"இலக்கணம்","q":"ஆய்த எழுத்தின் மாத்திரை அளவு?","a":"½ மாத்திரை"},{"n":244,"c":"இலக்கணம்","q":"உயிரளபெடையின் மாத்திரை அளவு?","a":"3 மாத்திரை"},{"n":245,"c":"இலக்கணம்","q":"ஒற்றளபெடையின் மாத்திரை அளவு?","a":"1 மாத்திரை"},{"n":246,"c":"இலக்கணம்","q":"குற்றியலுகரத்தின் மாத்திரை அளவு?","a":"½ மாத்திரை"},{"n":247,"c":"இலக்கணம்","q":"குற்றியலிகரத்தின் மாத்திரை அளவு?","a":"½ மாத்திரை"},{"n":248,"c":"இலக்கணம்","q":"மகரக்குறுக்கத்தின் மாத்திரை அளவு?","a":"¼ மாத்திரை"},{"n":249,"c":"இலக்கணம்","q":"ஆய்தக்குறுக்கத்தின் மாத்திரை அளவு?","a":"¼ மாத்திரை"},{"n":250,"c":"இலக்கணம்","q":"ஒரு மாத்திரை நேரம் என்பது?","a":"கண் இமைக்கும் அல்லது கை நொடிக்கும் நேரம்"},{"n":251,"c":"இலக்கணம்","q":"குற்றியலுகரம் எத்தனை வகைப்படும்?","a":"6"},{"n":252,"c":"இலக்கணம்","q":"குற்றியலுகரத்தின் ஆறு வகைகள் யாவை?","a":"நெடிற்றொடர், ஆய்தத்தொடர், உயிர்த்தொடர், வன்றொடர், மென்றொடர், இடைத்தொடர்"},{"n":253,"c":"இலக்கணம்","q":"நெடிற்றொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"நாடு, காது"},{"n":254,"c":"இலக்கணம்","q":"ஆய்தத்தொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"எஃகு, அஃது"},{"n":255,"c":"இலக்கணம்","q":"உயிர்த்தொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"அரசு, வரகு"},{"n":256,"c":"இலக்கணம்","q":"வன்றொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"பாக்கு, காட்டு"},{"n":257,"c":"இலக்கணம்","q":"மென்றொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"பங்கு, மஞ்சு"},{"n":258,"c":"இலக்கணம்","q":"இடைத்தொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"மார்பு, சால்பு"},{"n":259,"c":"இலக்கணம்","q":"உயிரளபெடைக்கு எடுத்துக்காட்டு?","a":"ஓஒதல், கெடுப்பதூஉம்"},{"n":260,"c":"இலக்கணம்","q":"ஒற்றளபெடைக்கு எடுத்துக்காட்டு?","a":"எஃஃகு, கண்ண்"},{"n":261,"c":"இலக்கணம்","q":"அளபெடை என்றால் என்ன?","a":"இசை குறையும் இடத்தில் எழுத்துகள் தம் மாத்திரையில் நீண்டு ஒலித்தல்"},{"n":262,"c":"இலக்கணம்","q":"சொல் எத்தனை வகைப்படும்?","a":"4 (பெயர், வினை, இடை, உரி)"},{"n":263,"c":"இலக்கணம்","q":"பெயர்ச்சொல் எத்தனை வகைப்படும்?","a":"6"},{"n":264,"c":"இலக்கணம்","q":"பெயர்ச்சொல்லின் ஆறு வகைகள் யாவை?","a":"பொருட்பெயர், இடப்பெயர், காலப்பெயர், சினைப்பெயர், பண்புப்பெயர், தொழிற்பெயர்"},{"n":265,"c":"இலக்கணம்","q":"திணை எத்தனை வகைப்படும்?","a":"2 (உயர்திணை, அஃறிணை)"},{"n":266,"c":"இலக்கணம்","q":"பால் எத்தனை வகைப்படும்?","a":"5 (ஆண், பெண், பலர், ஒன்று, பல)"},{"n":267,"c":"இலக்கணம்","q":"இடம் எத்தனை வகைப்படும்?","a":"3 (தன்மை, முன்னிலை, படர்க்கை)"},{"n":268,"c":"இலக்கணம்","q":"காலம் எத்தனை வகைப்படும்?","a":"3 (இறந்த, நிகழ், எதிர்)"},{"n":269,"c":"இலக்கணம்","q":"உயர்திணைப் பால்கள் எத்தனை?","a":"3 (ஆண்பால், பெண்பால், பலர்பால்)"},{"n":270,"c":"இலக்கணம்","q":"அஃறிணைப் பால்கள் எத்தனை?","a":"2 (ஒன்றன்பால், பலவின்பால்)"},{"n":271,"c":"இலக்கணம்","q":"வேற்றுமைகள் எத்தனை?","a":"8"},{"n":272,"c":"இலக்கணம்","q":"இரண்டாம் வேற்றுமை உருபு?","a":"ஐ"},{"n":273,"c":"இலக்கணம்","q":"மூன்றாம் வேற்றுமை உருபுகள்?","a":"ஆல், ஆன், ஓடு, ஒடு"},{"n":274,"c":"இலக்கணம்","q":"நான்காம் வேற்றுமை உருபு?","a":"கு"},{"n":275,"c":"இலக்கணம்","q":"ஐந்தாம் வேற்றுமை உருபுகள்?","a":"இன், இல்"},{"n":276,"c":"இலக்கணம்","q":"ஆறாம் வேற்றுமை உருபுகள்?","a":"அது, அ"},{"n":277,"c":"இலக்கணம்","q":"ஏழாம் வேற்றுமை உருபுகள்?","a":"கண், இல், இடம் முதலியன"},{"n":278,"c":"இலக்கணம்","q":"எட்டாம் வேற்றுமை எது?","a":"விளி வேற்றுமை"},{"n":279,"c":"இலக்கணம்","q":"தொகைநிலைத் தொடர்கள் எத்தனை வகைப்படும்?","a":"6"},{"n":280,"c":"இலக்கணம்","q":"தொகைநிலைத் தொடர்களின் வகைகள் யாவை?","a":"வேற்றுமைத்தொகை, வினைத்தொகை, பண்புத்தொகை, உவமைத்தொகை, உம்மைத்தொகை, அன்மொழித்தொகை"},{"n":281,"c":"இலக்கணம்","q":"வினைத்தொகைக்கு எடுத்துக்காட்டு?","a":"ஊறுகாய், சுடுசோறு, வெட்டுக்கிளி"},{"n":282,"c":"இலக்கணம்","q":"வினைத்தொகை எக்காலங்களைக் காட்டும்?","a":"மூன்று காலங்களையும் (காலம் கரந்த பெயரெச்சம்)"},{"n":283,"c":"இலக்கணம்","q":"பண்புத்தொகைக்கு எடுத்துக்காட்டு?","a":"செந்தாமரை, வெண்ணிலா"},{"n":284,"c":"இலக்கணம்","q":"உவமைத்தொகைக்கு எடுத்துக்காட்டு?","a":"மலர்க்கண், மதிமுகம்"},{"n":285,"c":"இலக்கணம்","q":"உம்மைத்தொகைக்கு எடுத்துக்காட்டு?","a":"இரவு பகல், தாய் தந்தை"},{"n":286,"c":"இலக்கணம்","q":"அன்மொழித்தொகைக்கு எடுத்துக்காட்டு?","a":"பொற்றொடி வந்தாள்"},{"n":287,"c":"இலக்கணம்","q":"ஆகுபெயர் எத்தனை வகைப்படும்?","a":"16"},{"n":288,"c":"இலக்கணம்","q":"“மல்லிகை சூடினாள்” – இதில் ஆகுபெயர் வகை?","a":"பொருளாகு (முதலாகு) பெயர்"},{"n":289,"c":"இலக்கணம்","q":"“வெள்ளை அடித்தான்” – ஆகுபெயர் வகை?","a":"பண்பாகு பெயர்"},{"n":290,"c":"இலக்கணம்","q":"“தமிழ் படித்தான்” (மொழி) – என்பது எவ்வகை ஆகுபெயர்?","a":"சொல்லாகு பெயர்"},{"n":291,"c":"இலக்கணம்","q":"ஒரு பொருளின் பெயர் அதனோடு தொடர்புடைய வேறொரு பொருளுக்கு ஆகி வருவது?","a":"ஆகுபெயர்"},{"n":292,"c":"இலக்கணம்","q":"அணி என்றால் என்ன?","a":"செய்யுளுக்கு அழகு சேர்ப்பது"},{"n":293,"c":"இலக்கணம்","q":"ஓர் உவமையை உவமேயத்துடன் வேறுபாடின்றிக் கூறுவது?","a":"உருவக அணி"},{"n":294,"c":"இலக்கணம்","q":"போல, புரைய, ஒப்ப போன்ற சொற்களுடன் ஒப்பிடுவது?","a":"உவமை அணி"},{"n":295,"c":"இலக்கணம்","q":"ஒரு சொல் இரு பொருள் தரும்படி அமைவது?","a":"சிலேடை அணி"},{"n":296,"c":"இலக்கணம்","q":"பழிப்பது போலப் புகழ்வது அல்லது புகழ்வது போலப் பழிப்பது?","a":"வஞ்சப்புகழ்ச்சி அணி"},{"n":297,"c":"இலக்கணம்","q":"இயல்பாக நிகழும் நிகழ்ச்சியில் கவிஞர் தம் குறிப்பை ஏற்றிக் கூறுவது?","a":"தற்குறிப்பேற்ற அணி"},{"n":298,"c":"இலக்கணம்","q":"யாப்பின் உறுப்புகள் எத்தனை?","a":"6 (எழுத்து, அசை, சீர், தளை, அடி, தொடை)"},{"n":299,"c":"இலக்கணம்","q":"அசை எத்தனை வகைப்படும்?","a":"2 (நேர், நிரை)"},{"n":300,"c":"இலக்கணம்","q":"பாவகைகள் எத்தனை?","a":"4 (வெண்பா, ஆசிரியப்பா, கலிப்பா, வஞ்சிப்பா)"},{"n":301,"c":"இலக்கணம்","q":"பாவினங்கள் எத்தனை?","a":"3 (தாழிசை, துறை, விருத்தம்)"},{"n":302,"c":"இலக்கணம்","q":"வெண்பாவின் ஓசை?","a":"செப்பலோசை"},{"n":303,"c":"இலக்கணம்","q":"ஆசிரியப்பாவின் ஓசை?","a":"அகவலோசை"},{"n":304,"c":"இலக்கணம்","q":"கலிப்பாவின் ஓசை?","a":"துள்ளலோசை"},{"n":305,"c":"இலக்கணம்","q":"வஞ்சிப்பாவின் ஓசை?","a":"தூங்கலோசை"},{"n":306,"c":"இலக்கணம்","q":"ஈரசைச் சீர்கள் எத்தனை?","a":"4 (தேமா, புளிமா, கருவிளம், கூவிளம்)" // ---------- APP ----------
const $ = s => document.querySelector(s);
const tabs = $("#tabs"), content = $("#content"), search = $("#search");
let active = SECTIONS[0].id;

function renderTabs(){
  const all = [...SECTIONS.map(s => [s.id, s.name]), ["qa","500 வினா-விடை"], ["quiz","பயிற்சி வினாக்கள்"]];
  tabs.innerHTML = "";
  all.forEach(([id,name]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name;
    b.setAttribute("aria-pressed", String(id === active && !search.value.trim()));
    b.onclick = () => { active = id; search.value = ""; render(); };
    tabs.appendChild(b);
  });
}

function topicHTML(t, open, q){
  let html = t.html;
  if(q){ // highlight text only, not tags
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
    html = html.replace(/>([^<]+)</g, (m, txt) => ">" + txt.replace(re, "<mark>$1</mark>") + "<");
  }
  return `<details ${open ? "open" : ""}><summary>${t.t}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  let score = 0, done = 0;
  content.innerHTML = `<h2>பயிற்சி வினாக்கள்</h2><div class="quiz" id="qz"></div><div class="score" id="score" aria-live="polite"></div>`;
  const qz = $("#qz");
  QUIZ.forEach((item, i) => {
    const box = document.createElement("div"); box.className = "q";
    box.innerHTML = `<div>${i+1}. ${item.q}</div><div class="opts"></div>`;
    const opts = box.querySelector(".opts");
    item.o.forEach((txt, j) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = txt;
      b.onclick = () => {
        if(opts.dataset.done) return;
        opts.dataset.done = 1; done++;
        const btns = opts.children;
        btns[item.a].classList.add("ok");
        if(j === item.a) score++; else b.classList.add("bad");
        if(done === QUIZ.length) $("#score").textContent = `உங்கள் மதிப்பெண்: ${score} / ${QUIZ.length}`;
      };
      opts.appendChild(b);
    });
    qz.appendChild(box);
  });
}

let qaPage=0, qaCat="all", qaText="", qaAll=false;
const PER=25;
function renderQA(focusSearch){
  const cats=[...new Set(QA.map(x=>x.c))];
  const t=qaText.toLowerCase();
  const list=QA.filter(x=>(qaCat==="all"||x.c===qaCat)&&(!t||(x.q+" "+x.a).toLowerCase().includes(t)));
  const pages=Math.max(1,Math.ceil(list.length/PER));
  qaPage=Math.min(qaPage,pages-1);
  const slice=list.slice(qaPage*PER,(qaPage+1)*PER);
  content.innerHTML=`<h2>500 வினா-விடை</h2>
  <div class="qa-bar">
    <select id="qaCat" aria-label="பிரிவு"><option value="all">அனைத்துப் பிரிவுகள் (${QA.length})</option>${cats.map(c=>`<option value="${c}" ${c===qaCat?"selected":""}>${c} (${QA.filter(x=>x.c===c).length})</option>`).join("")}</select>
    <input id="qaText" type="search" placeholder="இப்பிரிவில் தேடுக…" aria-label="வினா தேடல்">
    <button id="qaToggle" type="button">${qaAll?"விடைகளை மறை":"விடைகளைக் காட்டு"}</button>
  </div>
  <p class="meta">${list.length} வினாக்கள் · பக்கம் ${qaPage+1} / ${pages}</p>
  ${slice.length?slice.map(x=>`<details class="qa" ${qaAll?"open":""}><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join(""):'<p class="empty">வினாக்கள் இல்லை.</p>'}
  <div class="pager"><button id="qaPrev" type="button" ${qaPage===0?"disabled":""}>« முந்தையது</button><button id="qaNext" type="button" ${qaPage>=pages-1?"disabled":""}>அடுத்தது »</button></div>`;
  const ti=$("#qaText"); ti.value=qaText;
  if(focusSearch){ ti.focus(); ti.setSelectionRange(ti.value.length,ti.value.length); }
  $("#qaCat").onchange=e=>{qaCat=e.target.value;qaPage=0;renderQA();};
  ti.oninput=e=>{qaText=e.target.value;qaPage=0;renderQA(true);};
  $("#qaToggle").onclick=()=>{qaAll=!qaAll;renderQA();};
  $("#qaPrev").onclick=()=>{qaPage--;renderQA();window.scrollTo(0,0);};
  $("#qaNext").onclick=()=>{qaPage++;renderQA();window.scrollTo(0,0);};
}

function render(){
  renderTabs();
  const q = search.value.trim();
  if(q){
    const hits = [];
    SECTIONS.forEach(s => s.topics.forEach(t => {
      const plain = (t.t + " " + t.html.replace(/<[^>]+>/g," ")).toLowerCase();
      if(plain.includes(q.toLowerCase())) hits.push(t);
    }));
    const qh = QA.filter(x => (x.q + " " + x.a).toLowerCase().includes(q.toLowerCase())).slice(0, 40);
    const qhtml = qh.map(x => `<details class="qa"><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join("");
    content.innerHTML = `<h2>தேடல் முடிவுகள்</h2>` + ((hits.length || qh.length) ? hits.map(t => topicHTML(t, true, q)).join("") + (qh.length ? `<h2>வினா-விடை</h2>` + qhtml : "") : `<p class="empty">முடிவுகள் இல்லை. வேறு சொல்லில் தேடுக.</p>`);
    return;
  }
  if(active === "qa") return renderQA();
  if(active === "quiz") return renderQuiz();
  const s = SECTIONS.find(x => x.id === active);
  content.innerHTML = `<h2>${s.name}</h2>` + s.topics.map((t,i) => topicHTML(t, i === 0)).join("");
}

search.addEventListener("input", render);
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0e1714";
  const next = dark ? "light" : "dark";
  root.dataset.theme = next;
  try{ localStorage.setItem("skg-theme", next); }catch(e){}
};
try{ const t = localStorage.getItem("skg-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#yr").textContent = new Date().getFullYear();
render();
</script>
