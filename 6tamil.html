<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sundarraju TNPSC Kattral Ulagam</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f8f6; --card:#ffffff; --ink:#16231f; --muted:#5b6b66;
  --brand:#0f5c4d; --brand-ink:#ffffff; --accent:#e8a317; --line:#d7e2dd;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1714;--card:#16231f;--ink:#e7f0ec;--muted:#9bb0a8;--brand:#2fae94;--brand-ink:#08130f;--accent:#f0b43a;--line:#2a3c36;}
}
:root[data-theme="dark"]{--bg:#0e1714;--card:#16231f;--ink:#e7f0ec;--muted:#9bb0a8;--brand:#2fae94;--brand-ink:#08130f;--accent:#f0b43a;--line:#2a3c36;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;line-height:1.75}
header{background:var(--brand);color:var(--brand-ink);padding:28px 16px 22px;border-bottom:6px solid var(--accent)}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.25}
header p{margin:6px 0 0;opacity:.9}
.tools{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px;padding:10px 14px;border-radius:8px;border:2px solid transparent;font:inherit;background:#fff;color:#16231f}
.tools input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools button{padding:10px 16px;border-radius:8px;border:2px solid var(--brand-ink);background:transparent;color:var(--brand-ink);font:inherit;cursor:pointer}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
nav button{white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{padding:20px 0 60px}
h2{font-size:1.35rem;margin:6px 0 14px;color:var(--brand)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
details[open] summary{border-bottom:1px solid var(--line)}
.body{padding:10px 16px 14px}
.body ul{margin:0;padding-left:20px}
.body li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:6px}
.scroll{overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--bg)}
mark{background:var(--accent);color:#16231f;border-radius:3px;padding:0 2px}
.quiz .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.quiz .opts{display:grid;gap:8px;margin-top:8px}
.quiz .opts button{text-align:left;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.quiz .opts button.ok{background:#1f8a5b;color:#fff;border-color:#1f8a5b}
.quiz .opts button.bad{background:#c0392b;color:#fff;border-color:#c0392b}
.score{font-weight:700;margin:10px 0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.qa-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qa-bar select,.qa-bar input{flex:1;min-width:160px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.qa-bar button,.pager button{padding:9px 14px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;cursor:pointer}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.pager button:disabled{opacity:.4;cursor:default}
.meta{color:var(--muted);font-size:.9rem;margin:4px 0 12px}
details.qa summary{font-weight:500}
footer{text-align:center;color:var(--muted);padding:20px 16px 40px;font-size:.9rem}
</style>
</head>

<header>
  <div class="wrap">
    <h1>Sundarraju TNPSC Kattral Ulagam</h1>
    <p>சுந்தரராஜ் TNPSC கற்றல் உலகம் &mdash; குரூப் IV | 6ஆம் வகுப்பு தமிழ் குறிப்புகள் + 500 வினா-விடை</p>
    <div class="tools">
      <input id="search" type="search" placeholder="தேடுக… (எ.கா: வேலுநாச்சியார், சுட்டெழுத்து)" aria-label="குறிப்புகளைத் தேடுக">
      <button id="theme" type="button">🌓 Theme</button>
    </div>
  </div>
</header>
<nav><div class="wrap" id="tabs" role="group" aria-label="பிரிவுகள்"></div></nav>
<main class="wrap" id="content"></main>
<footer>&copy; <span id="yr"></span> Sundarraju TNPSC Kattral Ulagam &middot; தேர்வுக்கு முன் பாடநூலுடன் சரிபார்க்கவும்.</footer>

const SECTIONS = [{"id":"i1","name":"பருவம் 1 – இயல் 1: தமிழ்த்தேன்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: இன்பத்தமிழ், தமிழ்க்கும்மி</li><li>உரைநடை: வளர்தமிழ்</li><li>துணைப்பாடம்: கனவு பலித்தது</li><li>இலக்கணம்: தமிழ் எழுத்துகளின் வகை தொகை</li></ul>"},{"t":"இன்பத்தமிழ் – பாரதிதாசன்","html":"<ul><li>இயற்பெயர் கனகசுப்புரத்தினம்; புதுச்சேரி; புரட்சிக்கவிஞர்; பாரதியார் மீதுள்ள பற்றால் பாரதிதாசன்; “தமிழுக்கும் அமுதென்று பேர்”.</li></ul>"},{"t":"தமிழ்க்கும்மி – பெருஞ்சித்திரனார்","html":"<ul><li>இயற்பெயர் துரைமாணிக்கம்; பாவலரேறு; தென்மொழி இதழ்; நூல்: கனிச்சாறு; கும்மி – பெண்கள் கை தட்டி ஆடிப் பாடும் நாட்டுப்புறப் பாடல்.</li></ul>"},{"t":"தமிழ் எழுத்துகளின் வகை தொகை","html":"<ul><li>முதலெழுத்து 30 (உயிர் 12 + மெய் 18); சார்பெழுத்து 10; மொத்த எழுத்துகள் 247; உயிர்மெய் 216; ஆய்தம் 1.</li><li>குறில் 5, நெடில் 7; வல்லினம், மெல்லினம், இடையினம் – ஒவ்வொன்றும் 6.</li><li>மாத்திரை: குறில் 1, நெடில் 2, மெய் ½, ஆய்தம் ½.</li></ul>"}]},{"id":"i2","name":"பருவம் 1 – இயல் 2: இயற்கை","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: சிலப்பதிகாரம், காணி நிலம்</li><li>உரைநடை: சிறகின் ஓசை</li><li>துணைப்பாடம்: கிழவனும் கடலும்</li><li>இலக்கணம்: முதலெழுத்தும் சார்பெழுத்தும்</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"சிலப்பதிகாரம் – இளங்கோவடிகள்","html":"<ul><li>திங்கள், ஞாயிறு, மழை, பூம்புகார் போற்றுதல்; 3 காண்டம் (புகார், மதுரை, வஞ்சி); 30 காதை; முத்தமிழ்க் காப்பியம்; தலைவி கண்ணகி.</li></ul>"},{"t":"காணி நிலம் – பாரதியார்","html":"<ul><li>காணி – நில அளவு; பராசக்தியிடம் காணி நிலம், கிணறு, தென்னை மரங்கள், குயிலோசை வேண்டுதல்.</li><li>எட்டயபுரம்; 11.12.1882 – 11.09.1921; நூல்கள்: பாஞ்சாலி சபதம், கண்ணன் பாட்டு, குயில் பாட்டு.</li></ul>"},{"t":"சிறகின் ஓசை; கிழவனும் கடலும்","html":"<ul><li>சிறகின் ஓசை – பறவையியல் அறிஞர் சலீம் அலி (இந்தியாவின் பறவை மனிதர்).</li><li>கிழவனும் கடலும் – ஏர்னெஸ்ட் ஹெமிங்வே; நோபல் பரிசு 1954; சாண்டியாகோ என்னும் மீனவர்.</li></ul>"},{"t":"சார்பெழுத்துகள்","html":"<ul><li>10: உயிர்மெய், ஆய்தம், உயிரளபெடை, ஒற்றளபெடை, குற்றியலுகரம், குற்றியலிகரம், ஐகாரக்குறுக்கம், ஔகாரக்குறுக்கம், மகரக்குறுக்கம், ஆய்தக்குறுக்கம்.</li><li>உயிரளபெடை 3 மாத்திரை (ஓஒதல்); ஒற்றளபெடை 1 மாத்திரை (எஃஃகு).</li></ul>"}]},{"id":"i3","name":"பருவம் 1 – இயல் 3: அறிவியல் தொழில்நுட்பம்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: அறிவியல் ஆத்திசூடி, அறிவியலால் ஆள்வோம்</li><li>உரைநடை: கணியனின் நண்பன்</li><li>துணைப்பாடம்: ஒளி பிறந்தது</li><li>இலக்கணம்: மொழிமுதல், இறுதி எழுத்துகள்</li></ul>"},{"t":"அறிவியல் ஆத்திசூடி","html":"<ul><li>ஆசிரியர் நெல்லை சு. முத்து – அறிவியல் அறிஞர், கவிஞர்; அப்துல் கலாம் இவரைத் “தம்மை ஒத்த அலைநீளத்தில் சிந்திப்பவர்” என்றார்.</li><li>அறிவியலால் ஆள்வோம் – பாடநூல் ஆசிரியர் குழு.</li></ul>"},{"t":"மொழிமுதல், இறுதி எழுத்துகள்","html":"<ul><li>மொழிமுதல் எழுத்துகள் 22: உயிர் 12 + க, ச, த, ந, ப, ம, வ, ய, ஞ, ங.</li><li>மொழி இறுதி மெய்கள் 11: ஞ், ண், ந், ம், ன், ய், ர், ல், வ், ழ், ள்.</li></ul>"}]},{"id":"i4","name":"பருவம் 2 – இயல் 1: கல்வி – கண்ணெனத் தகும்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: மூதுரை, துன்பம் வெல்லும் கல்வி</li><li>உரைநடை: கல்விக்கண் திறந்தவர்</li><li>துணைப்பாடம்: நூலகம் நோக்கி</li><li>இலக்கணம்: இன எழுத்துகள்</li></ul>"},{"t":"மூதுரை – ஔவையார்","html":"<ul><li>மூத்தோர் கூறிய உரை; 31 வெண்பா; ஔவையாரின் நூல்கள்: ஆத்திசூடி, கொன்றை வேந்தன், மூதுரை, நல்வழி.</li></ul>"},{"t":"துன்பம் வெல்லும் கல்வி","html":"<ul><li>பட்டுக்கோட்டை கல்யாணசுந்தரம் – மக்கள் கவிஞர், பொதுவுடைமைக் கவிஞர்; திரைப்படப் பாடலாசிரியர்.</li></ul>"},{"t":"கல்விக்கண் திறந்தவர் – காமராசர்","html":"<ul><li>விருதுநகர்; 15.07.1903 – 02.10.1975; பெற்றோர் குமாரசாமி – சிவகாமி; முதலமைச்சர் 1954–1963; மதிய உணவுத் திட்டம்; பாரத ரத்னா 1976.</li></ul>"},{"t":"நூலகம் நோக்கி","html":"<ul><li>கன்னிமாரா நூலகம் (சென்னை, 1896), சரசுவதி மகால் நூலகம் (தஞ்சை), அண்ணா நூற்றாண்டு நூலகம் (2010); நூலகவியலின் தந்தை எஸ்.ஆர். அரங்கநாதன்; உலகப் புத்தக நாள் ஏப்ரல் 23.</li></ul>"},{"t":"இன எழுத்துகள்","html":"<ul><li>க–ங, ச–ஞ, ட–ண, த–ந, ப–ம, ற–ன; அ–ஆ, இ–ஈ, உ–ஊ, எ–ஏ, ஒ–ஓ; ஐ, ஔ – இனம் இல்லை.</li></ul>"}]},{"id":"i5","name":"பருவம் 2 – இயல் 2: நாகரிகம் பண்பாடு","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: ஆசாரக்கோவை, கண்மணியே கண்ணுறங்கு</li><li>உரைநடை: தமிழர் பெருவிழா</li><li>துணைப்பாடம்: மனம் கவரும் மாமல்லபுரம்</li><li>இலக்கணம்: மயங்கொலிகள்</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"ஆசாரக்கோவை","html":"<ul><li>பெருவாயின் முள்ளியார்; பதினெண்கீழ்க்கணக்கு; வெண்பா; ஆசாரம் – ஒழுக்கம்; கோவை – தொகுப்பு.</li></ul>"},{"t":"கண்மணியே கண்ணுறங்கு","html":"<ul><li>தாலாட்டு – வாய்மொழி இலக்கியம்; தால் – நாக்கு; ஆராரோ ஆரிரரோ.</li></ul>"},{"t":"தமிழர் பெருவிழா","html":"<ul><li>பொங்கல் – தை மாதம்; உழவர் திருநாள்; போகி, தைப்பொங்கல், மாட்டுப்பொங்கல், காணும் பொங்கல்; சங்க காலம் – இந்திரவிழா (புகார்).</li></ul>"},{"t":"மனம் கவரும் மாமல்லபுரம்","html":"<ul><li>முதலாம் நரசிம்மவர்மன் (மாமல்லன்); ஐந்து ரதங்கள்; அர்ச்சுனன் தபசு; கடற்கரைக் கோயில் – இராசசிம்மன்; யுனெஸ்கோ 1984.</li></ul>"},{"t":"மயங்கொலிகள்","html":"<ul><li>ண–ன–ந; ல–ள–ழ; ர–ற. எ.கா: வலி (நோவு), வளி (காற்று), வழி (பாதை); கலை, களை, கழை; அரம், அறம்; மரம், மறம்; கரை, கறை.</li></ul>"}]},{"id":"i6","name":"பருவம் 2 – இயல் 3: தொழில் வணிகம்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: நானிலம் படைத்தவன், கடலோடு விளையாடு</li><li>உரைநடை: வளரும் வணிகம்</li><li>துணைப்பாடம்: உழைப்பே மூலதனம்</li><li>இலக்கணம்: சுட்டெழுத்துகள், வினா எழுத்துகள்</li></ul>"},{"t":"நானிலம் படைத்தவன் – முடியரசன்","html":"<ul><li>இயற்பெயர் துரைராசு; நூல்: பூங்கொடி; நானிலம் = நான்கு + நிலம்: குறிஞ்சி, முல்லை, மருதம், நெய்தல் (பாலை – ஐந்தாவது).</li><li>தெய்வங்கள்: முருகன், திருமால், இந்திரன், வருணன்.</li></ul>"},{"t":"வளரும் வணிகம்","html":"<ul><li>பண்டமாற்று; புகார், கொற்கை (முத்து), முசிறி (மிளகு); யவனர் பொன்னுடன் வந்து மிளகுடன் திரும்பினர்; உறையூர் – பருத்தி ஆடை; அரிக்கமேடு (புதுச்சேரி).</li></ul>"},{"t":"சுட்டெழுத்துகள், வினா எழுத்துகள்","html":"<ul><li>சுட்டு: அ (சேய்மை), இ (அண்மை), உ (இடைப்பட்டது).</li><li>வினா: எ, யா (முதலில்); ஆ, ஓ, ஏ (இறுதியில்).</li></ul>"}]},{"id":"i7","name":"பருவம் 3 – இயல் 1: புதுமைகள் செய்யும் தேசமிது","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: பாரதம் அன்றைய நாற்றங்கால்</li><li>உரைநடை: தமிழ்நாட்டில் காந்தி</li><li>துணைப்பாடம்: வேலுநாச்சியார்</li><li>இலக்கணம்: நால்வகைச் சொற்கள்</li></ul>"},{"t":"பாரதம் அன்றைய நாற்றங்கால்","html":"<ul><li>தாராபாரதியின் கவிதைகள் தொகுப்பிலிருந்து; நாற்றங்கால் – நாற்று வளர்க்கும் இடம்.</li></ul>"},{"t":"தமிழ்நாட்டில் காந்தி","html":"<ul><li>காந்தியடிகள் 1896 – 1946 இடையே இருபது முறை தமிழகம் வந்தார்; மதுரையில் அரையாடை (1921); தில்லையாடி வள்ளியம்மை; உப்புச் சத்தியாகிரகம் 1930 – வேதாரண்யம் (இராஜாஜி).</li><li>02.10.1869 போர்பந்தர்; 30.01.1948; சுயசரிதை – சத்திய சோதனை; மகாத்மா பட்டம் – தாகூர்.</li></ul>"},{"t":"வேலுநாச்சியார்","html":"<ul><li>சிவகங்கை ராணி; இராமநாதபுரம்; தந்தை செல்லமுத்து சேதுபதி; கணவர் முத்துவடுகநாதர்; படைத்தலைவி குயிலி; உடையாள் படை; மருது சகோதரர்கள்; ஹைதர் அலி உதவி; விருப்பாட்சி; 1780 வெற்றி.</li></ul>"},{"t":"நால்வகைச் சொற்கள்","html":"<ul><li>பெயர்ச்சொல், வினைச்சொல், இடைச்சொல் (மற்றும், உம், ஓ), உரிச்சொல் (உறு, தவ, நனி).</li></ul>"}]},{"id":"i8","name":"பருவம் 3 – இயல் 2: எல்லாரும் இன்புற","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: பராபரக் கண்ணி, நீங்கள் நல்லவர்</li><li>உரைநடை: பசிப்பிணி போக்கிய பாவை</li><li>துணைப்பாடம்: பாதம்</li><li>இலக்கணம்: பெயர்ச்சொல்</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"பராபரக் கண்ணி – தாயுமானவர்","html":"<ul><li>தமிழ் மொழியின் உபநிடதம்; கண்ணி – இரண்டு அடிப் பாடல்; பராபரம் – மேலான பொருள்; திருமறைக்காடு.</li></ul>"},{"t":"நீங்கள் நல்லவர்","html":"<ul><li>கலீல் கிப்ரானின் ‘தீர்க்கதரிசி’ நூலிலிருந்து; தமிழில் புவியரசு; கிப்ரான் – லெபனான் கவிஞர்.</li></ul>"},{"t":"பசிப்பிணி போக்கிய பாவை","html":"<ul><li>மணிமேகலை; அமுதசுரபி; சீத்தலைச் சாத்தனார்; 30 காதை; பௌத்தக் காப்பியம்.</li></ul>"},{"t":"பெயர்ச்சொல் (6 வகை)","html":"<ul><li>பொருட்பெயர் (கண்ணன்), இடப்பெயர் (சென்னை), காலப்பெயர் (ஆடி), சினைப்பெயர் (கை), பண்புப்பெயர் (இனிமை), தொழிற்பெயர் (ஓட்டம்).</li></ul>"}]},{"id":"i9","name":"பருவம் 3 – இயல் 3: இன்னுயிர் காப்போம்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: ஆசிய ஜோதி</li><li>உரைநடை: மனிதநேயம்</li><li>துணைப்பாடம்: முடிவில் ஒரு தொடக்கம்</li><li>இலக்கணம்: அணி இலக்கணம்</li></ul>"},{"t":"ஆசிய ஜோதி – கவிமணி","html":"<ul><li>தேரூர்; 27.07.1876; எட்வின் அர்னால்டின் ‘The Light of Asia’ தழுவல்; நூல்கள்: மலரும் மாலையும், மருமக்கள் வழி மான்மியம், குழந்தைச் செல்வம்.</li><li>புத்தர் – சித்தார்த்தர்; லும்பினி; யசோதரை; போதிமரம்; அன்பு, அகிம்சை.</li></ul>"},{"t":"அணி இலக்கணம்","html":"<ul><li>உவமை: உவமானம், உவமேயம், உவம உருபு, பொதுத்தன்மை – தாமரை போன்ற முகம்.</li><li>உருவகம்: உவமை உருபின்றி ஒன்றெனக் கூறுதல் – முகத்தாமரை, வாழ்க்கைக் கடல்.</li></ul>"}]}];

const QUIZ = [{"q":"“இன்பத்தமிழ்” பாடலின் ஆசிரியர்?","o":["பாரதியார்","பாரதிதாசன்","பெருஞ்சித்திரனார்","முடியரசன்"],"a":1},{"q":"“அறிவியல் ஆத்திசூடி” நூலின் ஆசிரியர்?","o":["நெல்லை சு. முத்து","தாராபாரதி","தாயுமானவர்","கவிமணி"],"a":0},{"q":"“கல்விக்கண் திறந்தவர்” எனப் போற்றப்படுபவர்?","o":["காந்தியடிகள்","அண்ணா","காமராசர்","பெரியார்"],"a":2},{"q":"“பராபரக் கண்ணி” பாடலின் ஆசிரியர்?","o":["ஔவையார்","தாயுமானவர்","கவிமணி","இளங்கோவடிகள்"],"a":1},{"q":"சுட்டெழுத்துகள் எவை?","o":["அ, இ, உ","எ, யா, ஆ","க, ச, த","ஆ, ஓ, ஏ"],"a":0}];

"n":244,"c":"இயல் 7","q":"காந்தியடிகள் தமிழகத்துக்கு எத்தனை முறை வந்துள்ளார்?","a":"இருபது முறை (1896 – 1946)"},{"n":245,"c":"இயல் 7","q":"காந்தியடிகள் அரையாடை அணியத் தொடங்கிய ஊர்?","a":"மதுரை (1921)"},{"n":246,"c":"இயல் 7","q":"தென்னாப்பிரிக்கச் சத்தியாகிரகத்தில் உயிர் நீத்த தமிழ்ப்பெண்?","a":"தில்லையாடி வள்ளியம்மை"},{"n":247,"c":"இயல் 7","q":"தில்லையாடி வள்ளியம்மையின் ஊர் எம்மாவட்டத்தில் உள்ளது?","a":"நாகப்பட்டினம் (தில்லையாடி)"},{"n":248,"c":"இயல் 7","q":"உப்புச் சத்தியாகிரகம் நடந்த ஆண்டு?","a":"1930"},{"n":249,"c":"இயல் 7","q":"தமிழகத்தில் உப்புச் சத்தியாகிரகம் நடந்த இடம்?","a":"வேதாரண்யம்"},{"n":250,"c":"இயல் 7","q":"வேதாரண்ய உப்புச் சத்தியாகிரகத்தை வழிநடத்தியவர்?","a":"இராஜாஜி"},{"n":251,"c":"இயல் 7","q":"வேலுநாச்சியார் எந்த நாட்டின் ராணி?","a":"சிவகங்கை"},{"n":252,"c":"இயல் 7","q":"வேலுநாச்சியார் பிறந்த ஊர்?","a":"இராமநாதபுரம்"},{"n":253,"c":"இயல் 7","q":"வேலுநாச்சியாரின் கணவர்?","a":"முத்துவடுகநாதர்"},{"n":254,"c":"இயல் 7","q":"வேலுநாச்சியார் படைத்தலைவி யார்?","a":"குயிலி"},{"n":255,"c":"இயல் 7","q":"வேலுநாச்சியாருக்குத் துணையாக நின்ற சகோதரர்கள்?","a":"மருது சகோதரர்கள் (பெரிய மருது, சின்ன மருது)"},{"n":256,"c":"இயல் 7","q":"வேலுநாச்சியாருக்கு உதவிய மைசூர் அரசர்?","a":"ஹைதர் அலி"},{"n":257,"c":"இயல் 7","q":"வேலுநாச்சியார் தங்கியிருந்த பாளையம்?","a":"விருப்பாட்சி (திண்டுக்கல்)"},{"n":258,"c":"இயல் 7","q":"வேலுநாச்சியார் அமைத்த பெண்கள் படை?","a":"உடையாள் படை"},{"n":259,"c":"இயல் 7","q":"வேலுநாச்சியார் ஆங்கிலேயரை வென்று சிவகங்கையை மீட்ட ஆண்டு?","a":"1780"},{"n":260,"c":"இயல் 7","q":"வேலுநாச்சியார் எவ்வாறு போற்றப்படுகிறார்?","a":"வீரமங்கை"},{"n":261,"c":"இயல் 7","q":"சொற்கள் எத்தனை வகைப்படும்?","a":"4"},{"n":262,"c":"இயல் 7","q":"நால்வகைச் சொற்கள் யாவை?","a":"பெயர்ச்சொல், வினைச்சொல், இடைச்சொல், உரிச்சொல்"},{"n":263,"c":"இயல் 7","q":"பெயர்ச்சொல் என்றால் என்ன?","a":"பொருளுக்கு இடப்படும் பெயர் (எ.கா: மரம், கண்ணன்)"},{"n":264,"c":"இயல் 7","q":"வினைச்சொல் என்றால் என்ன?","a":"செயலைக் குறிக்கும் சொல் (எ.கா: ஓடினான்)"},{"n":265,"c":"இயல் 7","q":"இடைச்சொல் என்றால் என்ன?","a":"தனித்து இயங்காது பெயர், வினையைச் சார்ந்து வரும் சொல் (எ.கா: உம், ஓ)"},{"n":266,"c":"இயல் 7","q":"உரிச்சொல் என்றால் என்ன?","a":"பெயர், வினைகளின் பண்பு குறிப்பது (எ.கா: உறு, தவ, நனி)"},{"n":267,"c":"இயல் 7","q":"“மற்றும்” என்பது எவ்வகைச் சொல்?","a":"இடைச்சொல்"},{"n":268,"c":"இயல் 7","q":"“நனி” என்பது எவ்வகைச் சொல்?","a":"உரிச்சொல் (மிகுதி)"},{"n":269,"c":"இயல் 7","q":"“ஓடினான்” என்பது எவ்வகைச் சொல்?","a":"வினைச்சொல்"},{"n":270,"c":"இயல் 7","q":"வேலுநாச்சியாரின் தந்தை?","a":"செல்லமுத்து சேதுபதி (இராமநாதபுரம் மன்னர்)"},{"n":271,"c":"இயல் 7","q":"வேலுநாச்சியார் அறிந்திருந்த மொழிகளுள் மூன்று?","a":"உருது, ஆங்கிலம், பிரெஞ்சு"},{"n":272,"c":"இயல் 7","q":"ஆங்கிலேயரை வென்ற முதல் இந்திய அரசியாகப் போற்றப்படுபவர்?","a":"வேலுநாச்சியார்"},{"n":273,"c":"இயல் 8","q":"மூன்றாம் பருவம் இயல் 2-இன் தலைப்பு?","a":"எல்லாரும் இன்புற"},{"n":274,"c":"இயல் 8","q":"இயல் 8-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"பராபரக் கண்ணி, நீங்கள் நல்லவர்"},{"n":275,"c":"இயல் 8","q":"இயல் 8-இன் உரைநடைப் பாடம்?","a":"பசிப்பிணி போக்கிய பாவை"},{"n":276,"c":"இயல் 8","q":"இயல் 8-இன் துணைப்பாடம்?","a":"பாதம்"},{"n":277,"c":"இயல் 8","q":"இயல் 8-இன் இலக்கணப் பகுதி?","a":"பெயர்ச்சொல்"},{"n":278,"c":"இயல் 8","q":"இயல் 8-இன் வாழ்வியல் பகுதி?","a":"திருக்குறள்"},{"n":279,"c":"இயல் 8","q":"“பராபரக் கண்ணி” பாடலின் ஆசிரியர்?","a":"தாயுமானவர்"},{"n":280,"c":"இயல் 8","q":"“தமிழ் மொழியின் உபநிடதம்” எனப் போற்றப்படுவது?","a":"தாயுமானவர் பாடல்கள்"},{"n":281,"c":"இயல் 8","q":"“கண்ணி” என்பது?","a":"இரண்டு அடிகளில் பாடப்படும் பாடல் வகை"},{"n":282,"c":"இயல் 8","q":"“பராபரம்” என்பதன் பொருள்?","a":"மேலான பொருள் (இறைவன்)"},{"n":283,"c":"இயல் 8","q":"தாயுமானவர் பிறந்த ஊர்?","a":"திருமறைக்காடு (வேதாரண்யம்)"},{"n":284,"c":"இயல் 8","q":"“நீங்கள் நல்லவர்” பாடல் இடம்பெறும் நூல்?","a":"தீர்க்கதரிசி (கலீல் கிப்ரான்)"},{"n":285,"c":"இயல் 8","q":"தீர்க்கதரிசி நூலின் ஆசிரியர்?","a":"கலீல் கிப்ரான்"},{"n":286,"c":"இயல் 8","q":"கலீல் கிப்ரான் எந்நாட்டுக் கவிஞர்?","a":"லெபனான்"},{"n":287,"c":"இயல் 8","q":"தீர்க்கதரிசி நூலைத் தமிழில் மொழிபெயர்த்தவர்?","a":"புவியரசு"},{"n":288,"c":"இயல் 8","q":"பசிப்பிணி போக்கிய பாவை – யாரைக் குறிக்கிறது?","a":"மணிமேகலை"},{"n":289,"c":"இயல் 8","q":"மணிமேகலையின் ஆசிரியர்?","a":"சீத்தலைச் சாத்தனார்"},{"n":290,"c":"இயல் 8","q":"மணிமேகலையில் பசிப்பிணி போக்கப் பயன்பட்ட பாத்திரம்?","a":"அமுதசுரபி"},{"n":291,"c":"இயல் 8","q":"அமுதசுரபியை மணிமேகலைக்குத் தந்தவர்?","a":"ஆபுத்திரன் வழியாக (மணிபல்லவத்தில் தெய்வம்)"},{"n":292,"c":"இயல் 8","q":"மணிமேகலையின் தாய் தந்தையர்?","a":"மாதவி, கோவலன்"},{"n":293,"c":"இயல் 8","q":"மணிமேகலையின் காதைகள் எத்தனை?","a":"30"},{"n":294,"c":"இயல் 8","q":"மணிமேகலை எச்சமயக் காப்பியம்?","a":"பௌத்தம்"},{"n":295,"c":"இயல் 8","q":"பெயர்ச்சொல் எத்தனை வகைப்படும்?","a":"6"},{"n":296,"c":"இயல் 8","q":"பெயர்ச்சொல்லின் ஆறு வகைகள்?","a":"பொருட்பெயர், இடப்பெயர், காலப்பெயர், சினைப்பெயர், பண்புப்பெயர், தொழிற்பெயர்"},{"n":297,"c":"இயல் 8","q":"“கண்ணன்” – எவ்வகைப் பெயர்?","a":"பொருட்பெயர்"},{"n":298,"c":"இயல் 8","q":"“சென்னை” – எவ்வகைப் பெயர்?","a":"இடப்பெயர்"},{"n":299,"c":"இயல் 8","q":"“ஆடி” – எவ்வகைப் பெயர்?","a":"காலப்பெயர்"},{"n":300,"c":"இயல் 8","q":"“கை” – எவ்வகைப் பெயர்?","a":"சினைப்பெயர்"},{"n":301,"c":"இயல் 8","q":"“இனிமை” – எவ்வகைப் பெயர்?","a":"பண்புப்பெயர்"},{"n":302,"c":"இயல் 8","q":"“ஓட்டம்” – எவ்வகைப் பெயர்?","a":"தொழிற்பெயர்"},{"n":303,"c":"இயல் 8","q":"முழுப்பொருளுக்குப் பகுதியாக உள்ள உறுப்பின் பெயர்?","a":"சினைப்பெயர்"},{"n":304,"c":"இயல் 9","q":"மூன்றாம் பருவம் இயல் 3-இன் தலைப்பு?","a":"இன்னுயிர் காப்போம்"},{"n":305,"c":"இயல் 9","q":"இயல் 9-இன் கவிதைப்பேழைப் பாடம்?","a":"ஆசிய ஜோதி"},{"n":306,"c":"இயல் 9","q":"இயல் 9-இன் உரைநடைப் பாடம்?","a":"மனிதநேயம்"},{"n":307,"c":"இயல் 9","q":"இயல் 9-இன் துணைப்பாடம்?","a":"முடிவில் ஒரு தொடக்கம்"},{"n":308,"c":"இயல் 9","q":"இயல் 9-இன் இலக்கணப் பகுதி?","a":"அணி இலக்கணம்"},{"n":309,"c":"இயல் 9","q":"“ஆசிய ஜோதி” நூலின் ஆசிரியர்?","a":"கவிமணி தேசிகவிநாயகம் பிள்ளை"},{"n":310,"c":"இயல் 9","q":"ஆசிய ஜோதி எந்த ஆங்கில நூலின் தழுவல்?","a":"The Light of Asia (எட்வின் அர்னால்டு)"},{"n":311,"c":"இயல் 9","q":"ஆசிய ஜோதி யாரைப் பற்றியது?"," ுறள்","q":"திருவள்ளுவர் ஆண்டைக் கணக்கிட கி.பி. ஆண்டுடன் கூட்ட வேண்டியது?","a":"31"},{"n":385,"c":"இலக்கணப் பயிற்சி","q":"பகுபத உறுப்புகள் எத்தனை?","a":"6"},{"n":386,"c":"இலக்கணப் பயிற்சி","q":"பகுபத உறுப்புகள் யாவை?","a":"பகுதி, விகுதி, இடைநிலை, சாரியை, சந்தி, விகாரம்"},{"n":387,"c":"இலக்கணப் பயிற்சி","q":"பகுதி என்பது?","a":"சொல்லின் முதலில் நின்று பொருள் தரும் உறுப்பு"},{"n":388,"c":"இலக்கணப் பயிற்சி","q":"விகுதி என்பது?","a":"சொல்லின் இறுதியில் நின்று திணை, பால், எண், இடம் காட்டும் உறுப்பு"},{"n":389,"c":"இலக்கணப் பயிற்சி","q":"இடைநிலை என்பது?","a":"பகுதிக்கும் விகுதிக்கும் இடையே நின்று காலம் காட்டும் உறுப்பு"},{"n":390,"c":"இலக்கணப் பயிற்சி","q":"“நடந்தான்” – பகுபத உறுப்புகள்?","a":"நட + த்(ந்) + த் + ஆன் (நட – பகுதி, த் – சந்தி, ந் – விகாரம், த் – இறந்தகால இடைநிலை, ஆன் – விகுதி)"},{"n":391,"c":"இலக்கணப் பயிற்சி","q":"“வாழ்ந்தனர்” – பகுபத உறுப்புகள்?","a":"வாழ் + த்(ந்) + த் + அன் + அர்"},{"n":392,"c":"இலக்கணப் பயிற்சி","q":"“உண்டான்” – பகுபத உறுப்பு பிரிப்பு?","a":"உண் + ட் + ஆன் (ட் – இறந்தகால இடைநிலை)"},{"n":393,"c":"இலக்கணப் பயிற்சி","q":"இறந்தகால இடைநிலைகள் எவை?","a":"த், ட், ற், இன்"},{"n":394,"c":"இலக்கணப் பயிற்சி","q":"நிகழ்கால இடைநிலைகள் எவை?","a":"கிறு, கின்று, ஆநின்று"},{"n":395,"c":"இலக்கணப் பயிற்சி","q":"எதிர்கால இடைநிலைகள் எவை?","a":"ப், வ்"},{"n":396,"c":"இலக்கணப் பயிற்சி","q":"“செய்வான்” – பிரிக்க.","a":"செய் + வ் + ஆன் (வ் – எதிர்கால இடைநிலை)"},{"n":397,"c":"இலக்கணப் பயிற்சி","q":"“பாடுகிறாள்” – பிரிக்க.","a":"பாடு + கிறு + ஆள்"},{"n":398,"c":"இலக்கணப் பயிற்சி","q":"வினைமுற்று என்றால் என்ன?","a":"பொருள் முற்றுப்பெற்று நிற்கும் வினைச்சொல்"},{"n":399,"c":"இலக்கணப் பயிற்சி","q":"பெயரெச்சம் என்றால் என்ன?","a":"எச்சமாக நின்று பெயரைக் கொண்டு முடியும் வினை (எ.கா: வந்த பையன்)"},{"n":400,"c":"இலக்கணப் பயிற்சி","q":"வினையெச்சம் என்றால் என்ன?","a":"எச்சமாக நின்று வினையைக் கொண்டு முடியும் வினை (எ.கா: வந்து போனான்)"},{"n":401,"c":"இலக்கணப் பயிற்சி","q":"வினைச்சொல் எத்தனை வகைப்படும்?","a":"தெரிநிலை வினை, குறிப்பு வினை"},{"n":402,"c":"இலக்கணப் பயிற்சி","q":"காலம் காட்டும் வினை?","a":"தெரிநிலை வினை"},{"n":403,"c":"இலக்கணப் பயிற்சி","q":"காலம் காட்டாமல் பண்பு முதலியன காட்டும் வினை?","a":"குறிப்பு வினை"},{"n":404,"c":"இலக்கணப் பயிற்சி","q":"தன்வினை என்றால் என்ன?","a":"எழுவாய் தானே செய்யும் வினை (எ.கா: கதவு திறந்தது)"},{"n":405,"c":"இலக்கணப் பயிற்சி","q":"பிறவினை என்றால் என்ன?","a":"எழுவாய் பிறரைக் கொண்டு செய்விக்கும் வினை (எ.கா: கதவைத் திறந்தான்)"},{"n":406,"c":"இலக்கணப் பயிற்சி","q":"செய்வினை என்றால் என்ன?","a":"எழுவாய் செயலைச் செய்யும் வாக்கியம் (ராமன் பாடம் படித்தான்)"},{"n":407,"c":"இலக்கணப் பயிற்சி","q":"செயப்பாட்டு வினை என்றால் என்ன?","a":"செயப்படுபொருள் எழுவாயாக வரும் வாக்கியம் (பாடம் படிக்கப்பட்டது)"},{"n":408,"c":"இலக்கணப் பயிற்சி","q":"பெயர்ச்சொற்கள் எத்தனை வகை?","a":"6"},{"n":409,"c":"இலக்கணப் பயிற்சி","q":"“வெண்மை” என்பது எவ்வகைப் பெயர்?","a":"பண்புப்பெயர்"},{"n":410,"c":"இலக்கணப் பயிற்சி","q":"“ஆடல்” என்பது எவ்வகைப் பெயர்?","a":"தொழிற்பெயர்"},{"n":411,"c":"இலக்கணப் பயிற்சி","q":"“மதுரை” என்பது எவ்வகைப் பெயர்?","a":"இடப்பெயர்"},{"n":412,"c":"இலக்கணப் பயிற்சி","q":"“கண்” என்பது எவ்வகைப் பெயர்?","a":"சினைப்பெயர்"},{"n":413,"c":"இலக்கணப் பயிற்சி","q":"“தை” என்பது எவ்வகைப் பெயர்?","a":"காலப்பெயர்"},{"n":414,"c":"இலக்கணப் பயிற்சி","q":"சுட்டுப் பெயருக்கு எடுத்துக்காட்டு?","a":"அவன், இவள், அது"},{"n":415,"c":"இலக்கணப் பயிற்சி","q":"வினாப் பெயருக்கு எடுத்துக்காட்டு?","a":"யார், எவன், எது"},{"n":416,"c":"இலக்கணப் பயிற்சி","q":"ஒரு சொல் பல பொருளைத் தருவது?","a":"பலபொருள் ஒருசொல்"},{"n":417,"c":"இலக்கணப் பயிற்சி","q":"“ஆறு” என்னும் சொல்லின் பொருள்கள்?","a":"நதி, எண் (6), வழி"},{"n":418,"c":"இலக்கணப் பயிற்சி","q":"“கண்” என்பதன் பொருள்கள்?","a":"விழி, துளை, இடம்"},{"n":419,"c":"இலக்கணப் பயிற்சி","q":"“ஞாயிறு” என்பதன் பொருள்?","a":"சூரியன்"},{"n":420,"c":"இலக்கணப் பயிற்சி","q":"“திங்கள்” என்பதன் பொருள்?","a":"சந்திரன்"},{"n":421,"c":"இலக்கணப் பயிற்சி","q":"“வானம்” என்பதன் வேறு பெயர்?","a":"விண், ஆகாயம், நபம்"},{"n":422,"c":"இலக்கணப் பயிற்சி","q":"“கடல்” என்பதன் வேறு பெயர்கள்?","a":"ஆழி, முந்நீர், வாரி"},{"n":423,"c":"இலக்கணப const $ = s => document.querySelector(s);
const tabs = $("#tabs"), content = $("#content"), search = $("#search");
let active = SECTIONS[0].id;

function renderTabs(){
  const all = [...SECTIONS.map(s => [s.id, s.name]), ["qa","500 வினா-விடை"], ["quiz","பயிற்சி வினாக்கள்"]];
  tabs.innerHTML = "";
  all.forEach(([id,name]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name;
    b.setAttribute("aria-pressed", String(id === active && !search.value.trim()));
    b.onclick = () => { active = id; search.value = ""; render(); };
    tabs.appendChild(b);
  });
}

function topicHTML(t, open, q){
  let html = t.html;
  if(q){ // highlight text only, not tags
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
    html = html.replace(/>([^<]+)</g, (m, txt) => ">" + txt.replace(re, "<mark>$1</mark>") + "<");
  }
  return `<details ${open ? "open" : ""}><summary>${t.t}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  let score = 0, done = 0;
  content.innerHTML = `<h2>பயிற்சி வினாக்கள்</h2><div class="quiz" id="qz"></div><div class="score" id="score" aria-live="polite"></div>`;
  const qz = $("#qz");
  QUIZ.forEach((item, i) => {
    const box = document.createElement("div"); box.className = "q";
    box.innerHTML = `<div>${i+1}. ${item.q}</div><div class="opts"></div>`;
    const opts = box.querySelector(".opts");
    item.o.forEach((txt, j) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = txt;
      b.onclick = () => {
        if(opts.dataset.done) return;
        opts.dataset.done = 1; done++;
        const btns = opts.children;
        btns[item.a].classList.add("ok");
        if(j === item.a) score++; else b.classList.add("bad");
        if(done === QUIZ.length) $("#score").textContent = `உங்கள் மதிப்பெண்: ${score} / ${QUIZ.length}`;
      };
      opts.appendChild(b);
    });
    qz.appendChild(box);
  });
}

  const cats=[...new Set(QA.map(x=>x.c))];
  const t=qaText.toLowerCase();
  const list=QA.filter(x=>(qaCat==="all"||x.c===qaCat)&&(!t||(x.q+" "+x.a).toLowerCase().includes(t)));
  const pages=Math.max(1,Math.ceil(list.length/PER));
  qaPage=Math.min(qaPage,pages-1);
  const slice=list.slice(qaPage*PER,(qaPage+1)*PER);
  content.innerHTML=`<h2>500 வினா-விடை</h2>
  <div class="qa-bar">
    <select id="qaCat" aria-label="பிரிவு"><option value="all">அனைத்துப் பிரிவுகள் (${QA.length})</option>${cats.map(c=>`<option value="${c}" ${c===qaCat?"selected":""}>${c} (${QA.filter(x=>x.c===c).length})</option>`).join("")}</select>
    <input id="qaText" type="search" placeholder="இப்பிரிவில் தேடுக…" aria-label="வினா தேடல்">
    <button id="qaToggle" type="button">${qaAll?"விடைகளை மறை":"விடைகளைக் காட்டு"}</button>
  </div>
  <p class="meta">${list.length} வினாக்கள் · பக்கம் ${qaPage+1} / ${pages}</p>
  ${slice.length?slice.map(x=>`<details class="qa" ${qaAll?"open":""}><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join(""):'<p class="empty">வினாக்கள் இல்லை.</p>'}
  <div class="pager"><button id="qaPrev" type="button" ${qaPage===0?"disabled":""}>« முந்தையது</button><button id="qaNext" type="button" ${qaPage>=pages-1?"disabled":""}>அடுத்தது »</button></div>`;
  const ti=$("#qaText"); ti.value=qaText;
  if(focusSearch){ ti.focus(); ti.setSelectionRange(ti.value.length,ti.value.length); }
  $("#qaCat").onchange=e=>{qaCat=e.target.value;qaPage=0;renderQA();};
  ti.oninput=e=>{qaText=e.target.value;qaPage=0;renderQA(true);};
  $("#qaToggle").onclick=()=>{qaAll=!qaAll;renderQA();};
  $("#qaPrev").onclick=()=>{qaPage--;renderQA();window.scrollTo(0,0);};
  $("#qaNext").onclick=()=>{qaPage++;renderQA();window.scrollTo(0,0);};
}

function render(){
  renderTabs();
  const q = search.value.trim();
  if(q){
    const hits = [];
    SECTIONS.forEach(s => s.topics.forEach(t => {
      const plain = (t.t + " " + t.html.replace(/<[^>]+>/g," ")).toLowerCase();
      if(plain.includes(q.toLowerCase())) hits.push(t);
    }));
    const qh = QA.filter(x => (x.q + " " + x.a).toLowerCase().includes(q.toLowerCase())).slice(0, 40);
    const qhtml = qh.map(x => `<details class="qa"><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join("");
    content.innerHTML = `<h2>தேடல் முடிவுகள்</h2>` + ((hits.length || qh.length) ? hits.map(t => topicHTML(t, true, q)).join("") + (qh.length ? `<h2>வினா-விடை</h2>` + qhtml : "") : `<p class="empty">முடிவுகள் இல்லை. வேறு சொல்லில் தேடுக.</p>`);
    return;
  }
  if(active === "qa") return renderQA();
  if(active === "quiz") return renderQuiz();
  const s = SECTIONS.find(x => x.id === active);
  content.innerHTML = `<h2>${s.name}</h2>` + s.topics.map((t,i) => topicHTML(t, i === 0)).join("");
}

search.addEventListener("input", render);
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0e1714";
  const next = dark ? "light" : "dark";
  root.dataset.theme = next;
  try{ localStorage.setItem("skg-theme", next); }catch(e){}
};
try{ const t = localStorage.getItem("skg-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#yr").textContent = new Date().getFullYear();
render();
</script>
