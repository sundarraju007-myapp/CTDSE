<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sundarraju TNPSC Kattral Ulagam</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f8f6; --card:#ffffff; --ink:#16231f; --muted:#5b6b66;
  --brand:#0f5c4d; --brand-ink:#ffffff; --accent:#e8a317; --line:#d7e2dd;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1714;--card:#16231f;--ink:#e7f0ec;--muted:#9bb0a8;--brand:#2fae94;--brand-ink:#08130f;--accent:#f0b43a;--line:#2a3c36;}
}
:root[data-theme="dark"]{--bg:#0e1714;--card:#16231f;--ink:#e7f0ec;--muted:#9bb0a8;--brand:#2fae94;--brand-ink:#08130f;--accent:#f0b43a;--line:#2a3c36;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;line-height:1.75}
header{background:var(--brand);color:var(--brand-ink);padding:28px 16px 22px;border-bottom:6px solid var(--accent)}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.25}
header p{margin:6px 0 0;opacity:.9}
.tools{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px;padding:10px 14px;border-radius:8px;border:2px solid transparent;font:inherit;background:#fff;color:#16231f}
.tools input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools button{padding:10px 16px;border-radius:8px;border:2px solid var(--brand-ink);background:transparent;color:var(--brand-ink);font:inherit;cursor:pointer}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
nav button{white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{padding:20px 0 60px}
h2{font-size:1.35rem;margin:6px 0 14px;color:var(--brand)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
details[open] summary{border-bottom:1px solid var(--line)}
.body{padding:10px 16px 14px}
.body ul{margin:0;padding-left:20px}
.body li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:6px}
.scroll{overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--bg)}
mark{background:var(--accent);color:#16231f;border-radius:3px;padding:0 2px}
.quiz .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.quiz .opts{display:grid;gap:8px;margin-top:8px}
.quiz .opts button{text-align:left;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.quiz .opts button.ok{background:#1f8a5b;color:#fff;border-color:#1f8a5b}
.quiz .opts button.bad{background:#c0392b;color:#fff;border-color:#c0392b}
.score{font-weight:700;margin:10px 0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.qa-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qa-bar select,.qa-bar input{flex:1;min-width:160px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.qa-bar button,.pager button{padding:9px 14px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;cursor:pointer}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.pager button:disabled{opacity:.4;cursor:default}
.meta{color:var(--muted);font-size:.9rem;margin:4px 0 12px}
details.qa summary{font-weight:500}
footer{text-align:center;color:var(--muted);padding:20px 16px 40px;font-size:.9rem}
</style>
</head>

      <button id="theme" type="button">🌓 Theme</button>

const SECTIONS = [{"id":"i1","name":"பருவம் 1 – இயல் 1: அமுதத்தமிழ்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: எங்கள் தமிழ், ஒன்றல்ல இரண்டல்ல</li><li>உரைநடை: பேச்சுமொழியும் எழுத்துமொழியும்</li><li>துணைப்பாடம்: சொலவடைகள் (பொம்மலாட்டம்)</li><li>இலக்கணம்: குற்றியலுகரம், குற்றியலிகரம்</li></ul>"},{"t":"எங்கள் தமிழ் – நாமக்கல் கவிஞர்","html":"<ul><li>வெ. இராமலிங்கனார்; மோகனூர்; காந்தியக் கவிஞர்; நூல்கள்: மலைக்கள்ளன், என் கதை, தமிழன் இதயம்; பத்மபூஷண்.</li><li>எதுகைச் சொற்கள்: அருள் – பொருள், கொல்லா – எல்லா, அன்பும் – இன்பம்.</li></ul>"},{"t":"ஒன்றல்ல இரண்டல்ல – உடுமலை நாராயண கவி","html":"<ul><li>பகுத்தறிவுக் கவிராயர்; திரைப்பாடலாசிரியர்; பரணி – பகைவரை வென்றதைப் பாடுவது.</li><li>ஒன்றல்ல = ஒன்று + அல்ல; இரண்டல்ல = இரண்டு + அல்ல.</li></ul>"},{"t":"குற்றியலுகரம் – குற்றியலிகரம்","html":"<ul><li>குற்றியலுகரம் 6 வகை: நெடிற்றொடர் (நாடு), ஆய்தத்தொடர் (எஃகு), உயிர்த்தொடர் (அரசு), வன்றொடர் (பாக்கு), மென்றொடர் (பங்கு), இடைத்தொடர் (மார்பு); மாத்திரை ½.</li><li>குற்றியலிகரம்: நாடு + யாது = நாடியாது; ‘மியா’; மாத்திரை ½.</li></ul>"}]},{"id":"i2","name":"பருவம் 1 – இயல் 2: அணிநிழல் காடு","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: காடு, அப்படியே நிற்கட்டும் அந்த மரம்</li><li>உரைநடை: விலங்குகள் உலகம்</li><li>துணைப்பாடம்: இந்திய வனமகன்</li><li>இலக்கணம்: நால்வகைக் குறுக்கங்கள்</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"காடு – சுரதா","html":"<ul><li>இயற்பெயர் இராசகோபாலன்; சுப்புரத்தினதாசன்; உவமைக் கவிஞர்; பாரதிதாசன் மாணவர்; நூல்கள்: தேன்மழை, துறைமுகம்.</li></ul>"},{"t":"அப்படியே நிற்கட்டும் அந்த மரம் – ராஜமார்த்தாண்டன்","html":"<ul><li>‘கொங்குதேர் வாழ்க்கை’ என்னும் தொகுப்பு நூலை உருவாக்கியவர்; நாவற்பழம் – கோலிக்குண்டு உவமை; சுட்ட பழங்கள் – மண் ஒட்டிய பழங்கள்.</li></ul>"},{"t":"இந்திய வனமகன்","html":"<ul><li>ஜாதவ் பயேங்; மஜூலி தீவு (அசாம்) – தனி மனிதராகக் காடு வளர்த்தவர்.</li></ul>"},{"t":"நால்வகைக் குறுக்கங்கள்","html":"<ul><li>ஐகாரக்குறுக்கம் (சொல் முதல் 1½; இடை, கடை 1), ஔகாரக்குறுக்கம் (1½), மகரக்குறுக்கம் (¼), ஆய்தக்குறுக்கம் (¼).</li></ul>"}]},{"id":"i3","name":"பருவம் 1 – இயல் 3: நாடு அதை நாடு","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: புலி தங்கிய குகை, பாஞ்சை வளம்</li><li>உரைநடை: தேசியம் காத்த செம்மல் பசும்பொன் உ. முத்துராமலிங்கத்தேவர்</li><li>துணைப்பாடம்: கப்பலோட்டிய தமிழர்</li><li>இலக்கணம்: வழக்கு</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"புலி தங்கிய குகை","html":"<ul><li>புறநானூறு 86; பாடியவர் காவற்பெண்டு; மகனைப் போர்க்களத்தில் தேடும் தாய்; தாயின் வயிறு புலி தங்கிய குகை.</li><li>சொற்பொருள்: சிற்றில் – சிறு வீடு; யாண்டு – எங்கே; கல்லளை – கற்குகை.</li></ul>"},{"t":"பாஞ்சை வளம்","html":"<ul><li>வீரபாண்டிய கட்டபொம்மன் – பாஞ்சாலங்குறிச்சி; ஜாக்சன் துரை; கயத்தாறு – 1799; தம்பி ஊமைத்துரை.</li></ul>"},{"t":"முத்துராமலிங்கத்தேவர்","html":"<ul><li>பசும்பொன்; 30.10.1908 – 30.10.1963; தேசியம் காத்த செம்மல்; நேதாஜியுடன் நெருங்கிய தொடர்பு.</li></ul>"},{"t":"கப்பலோட்டிய தமிழர் – வ.உ.சி.","html":"<ul><li>ஒட்டப்பிடாரம்; 05.09.1872; சுதேசி நாவாய்ச் சங்கம் (1906); கப்பல்கள்: காலியோ, லாவோ; செக்கிழுத்த செம்மல்; நூல்கள்: மெய்யறம், மெய்யறிவு; மறைவு 1936.</li></ul>"},{"t":"வழக்கு","html":"<ul><li>இயல்பு வழக்கு 3: இலக்கணமுடையது, இலக்கணப்போலி (புறநகர்), மரூஉ (தஞ்சை).</li><li>தகுதி வழக்கு 3: இடக்கரடக்கல், மங்கலம் (காலமானார்), குழூஉக்குறி.</li></ul>"}]},{"id":"i4","name":"பருவம் 2 – இயல் 1: அறிவியல் ஆக்கம்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: கலங்கரை விளக்கம், கவின்மிகு கப்பல்</li><li>உரைநடை: தமிழரின் கப்பற்கலை</li><li>துணைப்பாடம்: ஆழ்கடலின் அடியில்</li><li>இலக்கணம்: இலக்கியவகைச் சொற்கள்</li></ul>"},{"t":"கலங்கரை விளக்கம் – பெரும்பாணாற்றுப்படை","html":"<ul><li>கடியலூர் உருத்திரங்கண்ணனார்; பத்துப்பாட்டு; 500 அடி; தொண்டைமான் இளந்திரையன்.</li><li>ஆற்றுப்படை – பரிசுபெற்றவர் பிறரை வள்ளலிடம் வழிப்படுத்துதல்; வேயா மாடம் – சாந்து பூசிய திண்ணிய மாடம்.</li></ul>"},{"t":"தமிழரின் கப்பற்கலை","html":"<ul><li>கப்பல்: நாவாய், மரக்கலம், வங்கம்; உறுப்புகள்: பாய், பாய்மரம், சுக்கான், நங்கூரம்; மாலுமி – மீகாமன்.</li><li>துறைமுகங்கள்: புகார், கொற்கை, முசிறி; இராசேந்திரன் கடாரத்தை வென்றார்.</li></ul>"},{"t":"ஆழ்கடலின் அடியில்","html":"<ul><li>ஜூல்ஸ் வெர்ன் (பிரான்ஸ்); நாட்டிலஸ் கப்பல்; கேப்டன் நெமோ.</li></ul>"},{"t":"இலக்கியவகைச் சொற்கள்","html":"<ul><li>இயற்சொல், திரிசொல், திசைச்சொல், வடசொல்.</li><li>திரிசொல்: வங்கம், அம்பி, நாவாய் (கப்பல்); திசைச்சொல்: கேணி; வடசொல்: கமலம்.</li></ul>"}]},{"id":"i5","name":"பருவம் 2 – இயல் 2: ஓதுவது ஒழியேல்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: இன்பத்தமிழ்க் கல்வி, அழியாச் செல்வம்</li><li>உரைநடை: வாழ்விக்கும் கல்வி</li><li>துணைப்பாடம்: பள்ளி மறுதிறப்பு</li><li>இலக்கணம்: ஓரெழுத்து ஒருமொழி, பகுபதம், பகாப்பதம்</li></ul>"},{"t":"இன்பத்தமிழ்க் கல்வி – பாரதிதாசன்","html":"<ul><li>சொற்பொருள்: கழனி – வயல்; நிகர் – சமம்; பரிதி – கதிரவன்; முகில் – மேகம்; வெற்பு – மலை.</li></ul>"},{"t":"அழியாச் செல்வம் – நாலடியார்","html":"<ul><li>நாலடி நானூறு; வேளாண் வேதம்; முப்பால் பகுப்பு; கல்வி பிறரால் கொள்ளப்படாது, கொடுத்தாலும் குறையாது.</li></ul>"},{"t":"ஓரெழுத்து ஒருமொழி","html":"<ul><li>மொத்தம் 42: ஆ – பசு; ஈ – கொடு; கா – சோலை; கோ – அரசன்; தீ – நெருப்பு; நா – நாக்கு; பூ – மலர்; மா – மாமரம்; நொ – துன்பம்; ஐ – தலைவன்; ஏ – அம்பு.</li></ul>"},{"t":"பகுபதம் – பகாப்பதம்","html":"<ul><li>பகுபத உறுப்புகள் 6: பகுதி, விகுதி, இடைநிலை, சாரியை, சந்தி, விகாரம்.</li><li>நடந்தான் = நட + த்(ந்) + த் + ஆன்.</li></ul>"}]},{"id":"i6","name":"பருவம் 2 – இயல் 3: கலை வண்ணம்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: ஒரு வேண்டுகோள், கீரைப்பாத்தியும் குதிரையும்</li><li>உரைநடை: பேசும் ஓவியங்கள்</li><li>துணைப்பாடம்: தமிழ் ஒளிர் இடங்கள்</li><li>இலக்கணம்: தொழிற்பெயர்</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"கீரைப்பாத்தியும் குதிரையும் – காளமேகப்புலவர்","html":"<ul><li>இரட்டுற மொழிதல் (சிலேடை); ஆசுகவி.</li><li>சொற்பொருள்: வண்கீரை – வளமான கீரை; முட்டப்போய் – முழுதாகச் சென்று; மறித்தல் – தடுத்தல்; பரி – குதிரை.</li></ul>"},{"t":"பேசும் ஓவியங்கள்","html":"<ul><li>சித்தன்னவாசல் (புதுக்கோட்டை) – சமண ஓவியங்கள், தாமரைக் குளம்; தஞ்சைப் பெரிய கோயில் – சோழர் ஓவியங்கள்; மதுரை – நாயக்கர் ஓவியங்கள்.</li></ul>"},{"t":"தொழிற்பெயர்","html":"<ul><li>தல், அல், கை முதலிய விகுதிகள்: படித்தல், பாடல், அழுகை; நடை, ஆட்டம்.</li></ul>"}]},{"id":"i7","name":"பருவம் 3 – இயல் 1: நயத்தகு நாகரிகம்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: விருந்தோம்பல், வயலும் வாழ்வும்</li><li>உரைநடை: திக்கெல்லாம் புகழுறும் திருநெல்வேலி</li><li>துணைப்பாடம்: திருநெல்வேலிச் சீமையும் கவிகளும்</li><li>இலக்கணம்: அணி இலக்கணம்</li></ul>"},{"t":"திருநெல்வேலி","html":"<ul><li>தாமிரபரணி (பொருநை); தென்பாண்டி நாடு; நெல்லையப்பர் கோயில்; குற்றாலக் குறவஞ்சி – திரிகூடராசப்பக் கவிராயர்; குமரகுருபரர் – ஸ்ரீவைகுண்டம்; உமறுப்புலவர் – எட்டயபுரம்; கால்டுவெல் – இடையன்குடி.</li></ul>"},{"t":"விருந்தோம்பல்","html":"<ul><li>திருக்குறள் 9ஆம் அதிகாரம் (அறத்துப்பால், இல்லறவியல்); விருந்து – புதியவர்; ஓம்பல் – பேணுதல்.</li></ul>"},{"t":"அணி இலக்கணம்","html":"<ul><li>உவமை (உவமானம், உவமேயம், உவம உருபு, பொதுத்தன்மை); உருவகம் – உவமை உருபின்றி ஒன்றெனக் கூறுதல்.</li><li>எ.கா: தாமரை போன்ற முகம் (உவமை); முகத்தாமரை (உருவகம்).</li></ul>"}]},{"id":"i8","name":"பருவம் 3 – இயல் 2: ஒப்புரவு ஒழுகு","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: புதுமை விளக்கு, அறம் என்னும் கதிர்</li><li>உரைநடை: ஒப்புரவு நெறி</li><li>துணைப்பாடம்: உண்மை ஒளி</li><li>இலக்கணம்: அணி இலக்கணம்</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"ஒப்புரவு நெறி","html":"<ul><li>ஒப்புரவறிதல் – திருக்குறள் 22ஆம் அதிகாரம்; ஒப்புரவு – உலகத்தோடு ஒத்து வாழ்தல், பிறருக்கு உதவுதல்.</li><li>அருகிலுள்ள அதிகாரங்கள்: ஈகை (23), புகழ் (24), அருளுடைமை (25).</li></ul>"},{"t":"அணிகள்","html":"<ul><li>தற்குறிப்பேற்றம், வஞ்சப்புகழ்ச்சி, சிலேடை, வேற்றுமை, பிறிதுமொழிதல்.</li></ul>"}]},{"id":"i9","name":"பருவம் 3 – இயல் 3: மானுடம் வெல்லும்","topics":[{"t":"பாடப்பகுதிகள்","html":"<ul><li>கவிதைப்பேழை: மலைப்பொழிவு, தன்னை அறிதல்</li><li>உரைநடை: கண்ணியமிகு தலைவர்</li><li>துணைப்பாடம்: பயணம்</li><li>இலக்கணம்: ஆகுபெயர்</li><li>வாழ்வியல்: திருக்குறள்</li></ul>"},{"t":"கண்ணியமிகு தலைவர் – காயிதே மில்லத்","html":"<ul><li>இயற்பெயர் முகமது இஸ்மாயில்; திருநெல்வேலிப் பேட்டை; காயிதே மில்லத் – சமுதாய வழிகாட்டி; அரசமைப்பு நிர்ணய சபை உறுப்பினர்; மறைவு 1972.</li></ul>"},{"t":"ஆகுபெயர் (16 வகை)","html":"<ul><li>மல்லிகை சூடினாள் – பொருளாகு; இந்தியா வென்றது – இடவாகு; டிசம்பர் வந்தது – காலவாகு; தலைக்கு நூறு பேர் – சினையாகு; வெள்ளை அடித்தான் – பண்பாகு; தமிழ் படித்தான் – சொல்லாகு.</li><li>அளவை ஆகுபெயர்: பத்து ரூபாய் (எண்ணல்), இரண்டு கிலோ (எடுத்தல்), இரண்டு லிட்டர் (முகத்தல்), ஒரு மீட்டர் (நீட்டல்).</li></ul>"}]}];

const QUIZ = [{"q":"“எங்கள் தமிழ்” பாடலின் ஆசிரியர்?","o":["பாரதியார்","நாமக்கல் கவிஞர்","சுரதா","பாரதிதாசன்"],"a":1},{"q":"“காடு” பாடலின் ஆசிரியர்?","o":["சுரதா","வாணிதாசன்","மீரா","காளமேகப்புலவர்"],"a":0},{"q":"“புலி தங்கிய குகை” பாடலைப் பாடியவர்?","o":["ஔவையார்","கபிலர்","காவற்பெண்டு","நக்கீரர்"],"a":2},{"q":"கப்பலோட்டிய தமிழர் என அழைக்கப்படுபவர்?","o":["பாரதியார்","வ.உ. சிதம்பரனார்","கட்டபொம்மன்","காயிதே மில்லத்"],"a":1},{"q":"ஓரெழுத்து ஒருமொழிகள் எத்தனை?","o":["30","42","247","18"],"a":1}];

const QA = [{"n":1,"c":"இயல் 1","q":"முதல் பருவம் இயல் 1-இன் தலைப்பு?","a":"அமுதத்தமிழ்"},{"n":2,"c":"இயல் 1","q":"இயல் 1-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"எங்கள் தமிழ், ஒன்றல்ல இரண்டல்ல"},{"n":3,"c":"இயல் 1","q":"இயல் 1-இன் உரைநடைப் பாடம்?","a":"பேச்சுமொழியும் எழுத்துமொழியும்"},{"n":4,"c":"இயல் 1","q":"இயல் 1-இன் துணைப்பாடம்?","a":"சொலவடைகள் (பொம்மலாட்டம்)"},{"n":5,"c":"இயல் 1","q":"இயல் 1-இன் இலக்கணப் பகுதி?","a":"குற்றியலுகரம், குற்றியலிகரம்"},{"n":6,"c":"இயல் 1","q":"“எங்கள் தமிழ்” பாடலின் ஆசிரியர்?","a":"நாமக்கல் கவிஞர் வெ. இராமலிங்கனார்"},{"n":7,"c":"இயல் 1","q":"வெ. இராமலிங்கனாருக்கு வழங்கும் சிறப்புப் பெயர்கள் இரண்டு?","a":"நாமக்கல் கவிஞர், காந்தியக் கவிஞர்"},{"n":8,"c":"இயல் 1","q":"நாமக்கல் கவிஞர் பிறந்த ஊர்?","a":"மோகனூர் (நாமக்கல் மாவட்டம்)"},{"n":9,"c":"இயல் 1","q":"நாமக்கல் கவிஞர் எழுதிய புதினம்?","a":"மலைக்கள்ளன்"},{"n":10,"c":"இயல் 1","q":"நாமக்கல் கவிஞரின் தன்வரலாற்று நூல்?","a":"என் கதை"},{"n":11,"c":"இயல் 1","q":"நாமக்கல் கவிஞர் பெற்ற மத்திய அரசு விருது?","a":"பத்மபூஷண்"},{"n":12,"c":"இயல் 1","q":"எங்கள் தமிழ் பாடலில் எதுகைச் சொற்கள் இரண்டு தருக.","a":"அருள் – பொருள், கொல்லா – எல்லா, அன்பும் – இன்பம்"},{"n":13,"c":"இயல் 1","q":"“ஒன்றல்ல இரண்டல்ல” பாடலின் ஆசிரியர்?","a":"உடுமலை நாராயண கவி"},{"n":14,"c":"இயல் 1","q":"உடுமலை நாராயண கவிக்கு வழங்கும் சிறப்புப் பெயர்?","a":"பகுத்தறிவுக் கவிராயர்"},{"n":15,"c":"இயல் 1","q":"உடுமலை நாராயண கவி எவ்வகைப் பாடல்கள் அதிகம் எழுதினார்?","a":"திரைப்படப் பாடல்கள்"},{"n":16,"c":"இயல் 1","q":"“இரண்டல்ல” – பிரித்து எழுதுக.","a":"இரண்டு + அல்ல"},{"n":17,"c":"இயல் 1","q":"“ஒன்றல்ல” – பிரித்து எழுதுக.","a":"ஒன்று + அல்ல"},{"n":18,"c":"இயல் 1","q":"“செங்கனி” – பிரித்து எழுதுக.","a":"செம்மை + கனி"},{"n":19,"c":"இயல் 1","q":"“பெருஞ்செல்வம்” – பிரித்து எழுதுக.","a":"பெருமை + செல்வம்"},{"n":20,"c":"இயல் 1","q":"பகைவரை வென்றதைப் பாடுவது எவ்வகை இலக்கியம்?","a":"பரணி இலக்கியம்"},{"n":21,"c":"இயல் 1","q":"பாடலின் இறுதி எழுத்து அல்லது சீர் ஒன்றி வருவது?","a":"இயைபு"},{"n":22,"c":"இயல் 1","q":"பேச்சுமொழி என்பது?","a":"பேசுவதற்குப் பயன்படும் மொழி வடிவம் (பேச்சு வழக்கு)"},{"n":23,"c":"இயல் 1","q":"எழுத்துமொழி என்பது?","a":"எழுதுவதற்குப் பயன்படும் மொழி வடிவம் (எழுத்து வழக்கு)"},{"n":24,"c":"இயல் 1","q":"இடத்துக்கு இடம் மாறுபடும் பேச்சு வழக்கு?","a":"வட்டார வழக்கு"},{"n":25,"c":"இயல் 1","q":"சொலவடை என்பது எதன் வட்டார வழக்குப் பெயர்?","a":"பழமொழி"},{"n":26,"c":"இயல் 1","q":"சொலவடைகள் பாடம் எந்த வடிவில் அமைந்துள்ளது?","a":"பொம்மலாட்டம்"},{"n":27,"c":"இயல் 1","q":"குற்றியலுகரம் என்றால் என்ன?","a":"தன் மாத்திரையில் குறைந்து ஒலிக்கும் உகரம்"},{"n":28,"c":"இயல் 1","q":"குற்றியலுகரத்தின் மாத்திரை?","a":"½ மாத்திரை"},{"n":29,"c":"இயல் 1","q":"குற்றியலுகரம் எத்தனை வகைப்படும்?","a":"6"},{"n":30,"c":"இயல் 1","q":"குற்றியலுகரத்தின் ஆறு வகைகள்?","a":"நெடிற்றொடர், ஆய்தத்தொடர், உயிர்த்தொடர், வன்றொடர், மென்றொடர், இடைத்தொடர்"},{"n":31,"c":"இயல் 1","q":"நெடிற்றொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"நாடு, காது"},{"n":32,"c":"இயல் 1","q":"ஆய்தத்தொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"எஃகு, அஃது"},{"n":33,"c":"இயல் 1","q":"உயிர்த்தொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"அரசு, வரகு"},{"n":34,"c":"இயல் 1","q":"வன்றொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"பாக்கு, காட்டு"},{"n":35,"c":"இயல் 1","q":"மென்றொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"பங்கு, மஞ்சு"},{"n":36,"c":"இயல் 1","q":"இடைத்தொடர்க் குற்றியலுகரத்திற்கு எடுத்துக்காட்டு?","a":"மார்பு, சால்பு"},{"n":37,"c":"இயல் 1","q":"குற்றியலிகரம் என்றால் என்ன?","a":"தன் மாத்திரையில் குறைந்து ஒலிக்கும் இகரம்"},{"n":38,"c":"இயல் 1","q":"குற்றியலிகரத்தின் மாத்திரை?","a":"½ மாத்திரை"},{"n":39,"c":"இயல் 1","q":"குற்றியலிகரம் எப்போது தோன்றும்?","a":"நிலைமொழி ஈற்று உகரம், வருமொழி முதல் ‘ய’ வரும்போது இகரமாகத் திரிவது (எ.கா: நாடு + யாது = நாடியாது)"},{"n":40,"c":"இயல் 1","q":"‘மியா’ என்னும் இடைச்சொல்லில் தோன்றும் குறுக்கம்?","a":"குற்றியலிகரம் (எ.கா: கேள்மியா)"},{"n":41,"c":"இயல் 1","q":"குற்றியலுகரம் சொல்லின் எவ்விடத்தில் வரும்?","a":"சொல்லின் இறுதியில்"},{"n":42,"c":"இயல் 1","q":"“எங்கள் தமிழ்” இடம்பெற்றுள்ள நூல்?","a":"நாமக்கல் கவிஞர் பாடல்கள்"},{"n":43,"c":"இயல் 2","q":"முதல் பருவம் இயல் 2-இன் தலைப்பு?","a":"அணிநிழல் காடு"},{"n":44,"c":"இயல் 2","q":"இயல் 2-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"காடு, அப்படியே நிற்கட்டும் அந்த மரம்"},{"n":45,"c":"இயல் 2","q":"இயல் 2-இன் உரைநடைப் பாடம்?","a":"விலங்குகள் உலகம்"},{"n":46,"c":"இயல் 2","q":"இயல் 2-இன் துணைப்பாடம்?","a":"இந்திய வனமகன் (நேர்காணல்)"},{"n":47,"c":"இயல் 2","q":"இயல் 2-இன் இலக்கணப் பகுதி?","a":"நால்வகைக் குறுக்கங்கள்"},{"n":48,"c":"இயல் 2","q":"இயல் 2-இன் வாழ்வியல் பகுதி?","a":"திருக்குறள்"},{"n":49,"c":"இயல் 2","q":"“காடு” பாடலின் ஆசிரியர்?","a":"சுரதா"},{"n":50,"c":"இயல் 2","q":"சுரதாவின் இயற்பெயர்?","a":"இராசகோபாலன்"},{"n":51,"c":"இயல் 2","q":"“சுரதா” என்ற பெயரின் விரிவு?","a":"சுப்புரத்தினதாசன்"},{"n":52,"c":"இயல் 2","q":"சுரதாவுக்கு வழங்கும் சிறப்புப் பெயர்?","a":"உவமைக் கவிஞர்"},{"n":53,"c":"இயல் 2","q":"சுரதா யாருடைய மாணவர்?","a":"பாரதிதாசன்"},{"n":54,"c":"இயல் 2","q":"சுரதாவின் நூல்கள் இரண்டு?","a":"தேன்மழை, துறைமுகம்"},{"n":55,"c":"இயல் 2","q":"“அப்படியே நிற்கட்டும் அந்த மரம்” – ஆசிரியர்?","a":"ராஜமார்த்தாண்டன்"},{"n":56,"c":"இயல் 2","q":"ராஜமார்த்தாண்டன் தொகுத்த நூல்?","a":"கொங்குதேர் வாழ்க்கை"},{"n":57,"c":"இயல் 2","q":"நாவற்பழத்திற்கு உவமையாகக் கூறப்படுவது?","a":"கோலிக்குண்டுகள்"},{"n":58,"c":"இயல் 2","q":"“சுட்ட பழங்கள்” என்பவை?","a":"மண் ஒட்டிய பழங்கள்"},{"n":59,"c":"இயல் 2","q":"இந்திய வனமகன் என அழைக்கப்படுபவர்?","a":"ஜாதவ் பயேங்"},{"n":60,"c":"இயல் 2","q":"இந்திய வனமகன் காடு வளர்த்த தீவு?","a":"மஜூலி தீவு (அசாம்)"},{"n":61,"c":"இயல் 2","q":"குறுக்கங்கள் எத்தனை?","a":"4"},{"n":62,"c":"இயல் 2","q":"நால்வகைக் குறுக்கங்கள் யாவை?","a":"ஐகாரக்குறுக்கம், ஔகாரக்குறுக்கம், மகரக்குறுக்கம், ஆய்தக்குறுக்கம்"},{"n":63,"c":"இயல் 2","q":"ஐகாரக்குறுக்கத்தின் மாத்திரை?","a":"சொல்லின் முதலில் 1½; இடையிலும் கடையிலும் 1"},{"n":64,"c":"இயல் 2","q":"ஔகாரக்குறுக்கத்தின் மாத்திரை?","a":"1½ (சொல்லின் முதலில் மட்டும் வரும்)"},{"n":65,"c":"இயல் 2","q":"மகரக்குறுக்கத்தின் மாத்திரை?","a":"¼"},{"n":66,"c":"இயல் 2","q":"ஆய்தக்குறுக்கத்தின் மாத்திரை?","a":"¼"},{"n":67,"c":"இயல் 2","q":"ஐகாரக்குறுக்கத்திற்கு எடுத்துக்காட்டு?","a":"ஐப்பசி, அழகை, வளையல்"},{"n":68,"c":"இயல் 2","q":"ஔகாரக்குறுக்கத்திற்கு எடுத்துக்காட்டு?","a":"ஔவையார், வௌவால்"},{"n":69,"c":"இயல் 2","q":"மகரக்குறுக்கத்திற்கு எடுத்துக்காட்டு?","a":"போலும், வரும் வண்டி"},{"n":70,"c":"இயல் 2","q":"ஆய்தக்குறுக்கத்திற்கு எடுத்துக்காட்டு?","a":"அஃது, இஃது (முள் + தீது = முஃடீது)"},{"n":71,"c":"இயல் 2","q":"ஐகாரக்குறுக்கம் எந்த எழுத்தின் குறுக்கம்?","a":"ஐ"},{"n":72,"c":"இயல் 2","q":"ஐ, ஔ-வின் இயல்பான மாத்திரை?","a":"2"},{"n":73,"c":"இயல் 2","q":"ம் என்னும் மெய்யின் இயல்பான மாத்திரை?","a":"½"},{"n":74,"c":"இயல் 2","q":"ஃ என்னும் ஆய்தத்தின் இயல்பான மாத்திரை?","a":"½"},{"n":75,"c":"இயல் 3","q":"முதல் பருவம் இயல் 3-இன் தலைப்பு?","a":"நாடு அதை நாடு"},{"n":76,"c":"இயல் 3","q":"இயல் 3-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"புலி தங்கிய குகை, பாஞ்சை வளம்"},{"n":77,"c":"இயல் 3","q":"இயல் 3-இன் உரைநடைப் பாடம்?","a":"தேசியம் காத்த செம்மல் பசும்பொன் உ. முத்துராமலிங்கத்தேவர்"},{"n":78,"c":"இயல் 3","q":"இயல் 3-இன் துணைப்பாடம்?","a":"கப்பலோட்டிய தமிழர்"},{"n":79,"c":"இயல் 3","q":"இயல் 3-இன் இலக்கணப் பகுதி?","a":"வழக்கு"},{"n":80,"c":"இயல் 3","q":"“புலி தங்கிய குகை” பாடல் இடம்பெறும் நூல்?","a":"புறநானூறு (பாடல் 86)"},{"n":81,"c":"இயல் 3","q":"புலி தங்கிய குகை பாடலைப் பாடியவர்?","a":"காவற்பெண்டு"},{"n":82,"c":"இயல் 3","q":"தாய் தன் வயிற்றுக்கு உவமையாகக் கூறுவது?","a":"புலி தங்கிய குகை"},{"n":83,"c":"இயல் 3","q":"“சிற்றில்” என்பதன் பொருள்?","a":"சிறு வீடு"},{"n":84,"c":"இயல் 3","q":"“யாண்டு” என்பதன் பொருள்?","a":"எங்கே"},{"n":85,"c":"இயல் 3","q":"“கல்லளை” என்பதன் பொருள்?","a":"கற்குகை"},{"n":86,"c":"இயல் 3","q":"பாடலில் தாய் தன் மகனைத் தேடிச் சென்ற இடம்?","a":"போர்க்களம்"},{"n":87,"c":"இயல் 3","q":"புறநானூறு எவ்வகை நூல்?","a":"எட்டுத்தொகை (புறம்)"},{"n":88,"c":"இயல் 3","q":"“பாஞ்சை வளம்” எவரைப் பற்றியது?","a":"வீரபாண்டிய கட்டபொம்மன்"},{"n":89,"c":"இயல் 3","q":"கட்டபொம்மனின் ஊர்?","a":"பாஞ்சாலங்குறிச்சி"},{"n":90,"c":"இயல் 3","q":"கட்டபொம்மன் தூக்கிலிடப்பட்ட இடம்?","a":"கயத்தாறு"},{"n":91,"c":"இயல் 3","q":"கட்டபொம்மன் தூக்கிலிடப்பட்ட ஆண்டு?","a":"1799"},{"n":92,"c":"இயல் 3","q":"கட்டபொம்மனிடம் வரி கேட்ட ஆங்கிலேய அதிகாரி?","a":"ஜாக்சன் துரை"},{"n":93,"c":"இயல் 3","q":"கட்டபொம்மனின் தம்பி பெயர்?","a":"ஊமைத்துரை"},{"n":94,"c":"இயல் 3","q":"பசும்பொன் முத்துராமலிங்கத்தேவர் பிறந்த ஊர்?","a":"பசும்பொன் (இராமநாதபுரம் மாவட்டம்)"},{"n":95,"c":"இயல் 3","q":"முத்துராமலிங்கத்தேவர் பிறந்த நாள்?","a":"30.10.1908"},{"n":96,"c":"இயல் 3","q":"முத்துராமலிங்கத்தேவர் மறைந்த நாள்?","a":"30.10.1963"},{"n":97,"c":"இயல் 3","q":"முத்துராமலிங்கத்தேவர் எவ்வாறு போற்றப்படுகிறார்?","a":"தேசியம் காத்த செம்மல்"},{"n":98,"c":"இயல் 3","q":"முத்துராமலிங்கத்தேவர் யாருடன் நெருங்கிய தொடர்புடையவர்?","a":"நேதாஜி சுபாஷ் சந்திர போஸ்"},{"n":99,"c":"இயல் 3","q":"கப்பலோட்டிய தமிழர் என அழைக்கப்படுபவர்?","a":"வ.உ. சிதம்பரனார்"},{"n":100,"c":"இயல் 3","q":"வ.உ.சி. பிறந்த ஊர்?","a":"ஒட்டப்பிடாரம்"},{"n":101,"c":"இயல் 3","q":"வ.உ.சி. பிறந்த நாள்?","a":"05.09.1872"},{"n":102,"c":"இயல் 3","q":"வ.உ.சி. தொடங்கிய கப்பல் நிறுவனம்?","a":"சுதேசி நாவாய்ச் சங்கம் (1906)"},{"n":103,"c":"இயல் 3","q":"வ.உ.சி.யின் கப்பல்கள் இரண்டு?","a":"காலியோ, லாவோ"},{"n":104,"c":"இயல் 3","q":"வ.உ.சி. சிறையில் செய்த கடுமையான வேலை?","a":"செக்கிழுத்தல்"},{"n":105,"c":"இயல் 3","q":"வ.உ.சி.க்கு வழங்கும் சிறப்புப் பெயர்கள் இரண்டு?","a":"கப்பலோட்டிய தமிழன், செக்கிழுத்த செம்மல்"},{"n":106,"c":"இயல் 3","q":"வ.உ.சி.யின் நூல்கள் இரண்டு?","a":"மெய்யறம், மெய்யறிவு"},{"n":107,"c":"இயல் 3","q":"வ.உ.சி. மறைந்த ஆண்டு?","a":"1936"},{"n":108,"c":"இயல் 3","q":"வழக்கு எத்தனை வகைப்படும்?","a":"2 (இயல்பு வழக்கு, தகுதி வழக்கு)"},{"n":109,"c":"இயல் 3","q":"இயல்பு வழக்கு எத்தனை வகை?","a":"3 (இலக்கணமுடையது, இலக்கணப்போலி, மரூஉ)"},{"n":110,"c":"இயல் 3","q":"தகுதி வழக்கு எத்தனை வகை?","a":"3 (இடக்கரடக்கல், மங்கலம், குழூஉக்குறி)"},{"n":111,"c":"இயல் 3","q":"மரூஉ என்றால் என்ன?","a":"சொல் சிதைந்து வழங்குவது (எ.கா: தஞ்சாவூர் – தஞ்சை)"},{"n":112,"c":"இயல் 3","q":"இலக்கணப்போலி என்றால் என்ன?","a":"இலக்கணப்படி அமையாவிடினும் அவ்வாறே ஏற்கப்படும் சொல் (எ.கா: புறநகர்)"},{"n":113,"c":"இயல் 3","q":"இடக்கரடக்கல் என்றால் என்ன?","a":"பலரறியப் பேசத் தகாத சொல்லை வேறு சொல்லால் கூறுதல்"},{"n":114,"c":"இயல் 3","q":"மங்கலம் என்றால் என்ன?","a":"அமங்கலச் சொல்லை நல்ல சொல்லால் கூறுதல் (எ.கா: இறந்தார் – காலமானார்)"},{"n":115,"c":"இயல் 3","q":"குழூஉக்குறி என்றால் என்ன?","a":"ஒரு குழுவினர் மட்டும் தங்களுக்குள் பயன்படுத்தும் சிறப்புச் சொல்"},{"n":116,"c":"இயல் 3","q":"வ.உ.சி. சிறையிலிருந்த ஊர்கள் இரண்டு?","a":"கோயம்புத்தூர், கண்ணனூர்"},{"n":117,"c":"இயல் 3","q":"பாஞ்சாலங்குறிச்சி எம்மாவட்டத்தில் உள்ளது?","a":"தூத்துக்குடி"},{"n":118,"c":"இயல் 3","q":"கயத்தாறு எம்மாவட்டத்தில் உள்ளது?","a":"தூத்துக்குடி"},{"n":119,"c":"இயல் 4","q":"இரண்டாம் பருவம் இயல் 1-இன் தலைப்பு?","a":"அறிவியல் ஆக்கம்"},{"n":120,"c":"இயல் 4","q":"இயல் 4-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"கலங்கரை விளக்கம், கவின்மிகு கப்பல்"},{"n":121,"c":"இயல் 4","q":"இயல் 4-இன் உரைநடைப் பாடம்?","a":"தமிழரின் கப்பற்கலை"},{"n":122,"c":"இயல் 4","q":"இயல் 4-இன் துணைப்பாடம்?","a":"ஆழ்கடலின் அடியில்"},{"n":123,"c":"இயல் 4","q":"இயல் 4-இன் இலக்கணப் பகுதி?","a":"இலக்கியவகைச் சொற்கள்"},{"n":124,"c":"இயல் 4","q":"“கலங்கரை விளக்கம்” பாடல் இடம்பெறும் நூல்?","a":"பெரும்பாணாற்றுப்படை"},{"n":125,"c":"இயல் 4","q":"பெரும்பாணாற்றுப்படையின் ஆசிரியர்?","a":"கடியலூர் உருத்திரங்கண்ணனார்"},{"n":126,"c":"இயல் 4","q":"பெரும்பாணாற்றுப்படையின் பாட்டுடைத் தலைவன்?","a":"தொண்டைமான் இளந்திரையன்"},{"n":127,"c":"இயல் 4","q":"பெரும்பாணாற்றுப்படை எத்தனை அடிகளைக் கொண்டது?","a":"500"},{"n":128,"c":"இயல் 4","q":"பெரும்பாணாற்றுப்படை எந்தத் தொகுப்பைச் சேர்ந்தது?","a":"பத்துப்பாட்டு"},{"n":129,"c":"இயல் 4","q":"ஆற்றுப்படை இலக்கியம் என்றால் என்ன?","a":"வள்ளலிடம் பரிசு பெற்றவர் பிறருக்கு அவ்வள்ளலிடம் செல்ல வழிகாட்டுவதாகப் பாடுவது"},{"n":130,"c":"இயல் 4","q":"“வேயா மாடம்” என்பதன் பொருள்?","a":"வைக்கோல் முதலியவற்றால் வேயப்படாமல் சாந்து பூசப்பட்ட திண்ணிய மாடம்"},{"n":131,"c":"இயல் 4","q":"கலங்கரை விளக்கத்தின் பணி?","a":"இரவில் கப்பல்களுக்கு வழிகாட்டுவது"},{"n":132,"c":"இயல் 4","q":"“கலம்” என்பதன் பொருள்?","a":"கப்பல்"},{"n":133,"c":"இயல் 4","q":"கப்பலைக் குறிக்கும் பழந்தமிழ்ச் சொற்கள் மூன்று?","a":"நாவாய், மரக்கலம், வங்கம்"},{"n":134,"c":"இயல் 4","q":"ஓடம், தோணி, பரிசல் – இவை எவற்றைக் குறிக்கும்?","a":"சிறிய படகுகள்"},{"n":135,"c":"இயல் 4","q":"கப்பலின் திசையைக் கட்டுப்படுத்தும் உறுப்பு?","a":"சுக்கான்"},{"n":136,"c":"இயல் 4","q":"கப்பலை ஒரே இடத்தில் நிறுத்தப் பயன்படுவது?","a":"நங்கூரம்"},{"n":137,"c":"இயல் 4","q":"கப்பலைச் செலுத்தும் மாலுமியின் பழந்தமிழ்ப் பெயர்?","a":"மீகாமன்"},{"n":138,"c":"இயல் 4","q":"கப்பலில் காற்றைப் பிடித்து ஓட்டுவது?","a":"பாய்"},{"n":139,"c":"இயல் 4","q":"கப்பலில் பாயைத் தாங்கும் உயர்ந்த கம்பம்?","a":"பாய்மரம்"},{"n":140,"c":"இயல் 4","q":"“முந்நீர்” என்பதன் பொருள்?","a":"கடல்"},{"n":141,"c":"இயல் 4","q":"“திரைகடல் ஓடியும் திரவியம் தேடு” என்பது?","a":"பழமொழி"},{"n":142,"c":"இயல் 4","q":"சங்க காலத் தமிழரின் முதன்மைத் துறைமுகங்கள் மூன்று?","a":"புகார், கொற்கை, முசிறி"},{"n":143,"c":"இயல் 4","q":"கடல் வணிகத்தில் தமிழரோடு தொடர்புடைய அயல்நாட்டார்?","a":"யவனர் (கிரேக்க, ரோமானியர்)"},{"n":144,"c":"இயல் 4","q":"சோழன் இராசேந்திரன் வென்ற கடல்கடந்த நாடு?","a":"கடாரம்"},{"n":145,"c":"இயல் 4","q":"கடாரம் என்பது இன்றைய எப்பகுதி?","a":"மலேசியாவின் கெடா"},{"n":146,"c":"இயல் 4","q":"“ஆழ்கடலின் அடியில்” நூலின் ஆசிரியர்?","a":"ஜூல்ஸ் வெர்ன்"},{"n":147,"c":"இயல் 4","q":"ஜூல்ஸ் வெர்ன் எந்நாட்டவர்?","a":"பிரான்ஸ்"},{"n":148,"c":"இயல் 4","q":"ஆழ்கடலின் அடியில் கதையில் வரும் நீர்மூழ்கிக் கப்பல்?","a":"நாட்டிலஸ்"},{"n":149,"c":"இயல் 4","q":"நாட்டிலஸ் கப்பலின் தலைவர்?","a":"கேப்டன் நெமோ"},{"n":150,"c":"இயல் 4","q":"ஜூல்ஸ் வெர்ன் எவ்வாறு அழைக்கப்படுகிறார்?","a":"அறிவியல் புனைகதையின் தந்தை"},{"n":151,"c":"இயல் 4","q":"இலக்கிய வகைச் சொற்கள் எத்தனை?","a":"4"},{"n":152,"c":"இயல் 4","q":"இலக்கிய வகைச் சொற்கள் யாவை?","a":"இயற்சொல், திரிசொல், திசைச்சொல், வடசொல்"},{"n":153,"c":"இயல் 4","q":"இயற்சொல் என்றால் என்ன?","a":"எளிதில் பொருள் விளங்கும் சொல் (எ.கா: மரம், மலை)"},{"n":154,"c":"இயல் 4","q":"திரிசொல் என்றால் என்ன?","a":"கற்றோர்க்கு மட்டுமே பொருள் விளங்கும் சொல்"},{"n":155,"c":"இயல் 4","q":"ஒரு பொருள் குறித்த பல திரிசொற்களுக்கு எடுத்துக்காட்டு?","a":"வங்கம், அம்பி, நாவாய் (கப்பல்)"},{"n":156,"c":"இயல் 4","q":"திசைச்சொல் என்றால் என்ன?","a":"தமிழ் நாட்டைச் சூழ்ந்த பிற நாடுகளிலிருந்து வந்து தமிழில் வழங்கும் சொல்"},{"n":157,"c":"இயல் 4","q":"வடசொல் என்றால் என்ன?","a":"வடமொழியிலிருந்து தமிழுக்கு வந்த சொல் (எ.கா: கமலம்)"},{"n":158,"c":"இயல் 4","q":"“கேணி” என்பது எவ்வகைச் சொல்?","a":"திசைச்சொல்"},{"n":159,"c":"இயல் 4","q":"“மரம்” என்பது எவ்வகைச் சொல்?","a":"இயற்சொல்"},{"n":160,"c":"இயல் 4","q":"“கமலம்” என்பது எவ்வகைச் சொல்?","a":"வடசொல்"},{"n":161,"c":"இயல் 4","q":"கலங்கரை விளக்கம் பாடலில் பாடப்படும் பொருள்?","a":"கடலில் செல்லும் கப்பல்களுக்கு வழிகாட்டும் விளக்கு"},{"n":162,"c":"இயல் 5","q":"இரண்டாம் பருவம் இயல் 2-இன் தலைப்பு?","a":"ஓதுவது ஒழியேல்"},{"n":163,"c":"இயல் 5","q":"இயல் 5-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"இன்பத்தமிழ்க் கல்வி, அழியாச் செல்வம்"},{"n":164,"c":"இயல் 5","q":"இயல் 5-இன் உரைநடைப் பாடம்?","a":"வாழ்விக்கும் கல்வி"},{"n":165,"c":"இயல் 5","q":"இயல் 5-இன் துணைப்பாடம்?","a":"பள்ளி மறுதிறப்பு"},{"n":166,"c":"இயல் 5","q":"இயல் 5-இன் இலக்கணப் பகுதி?","a":"ஓரெழுத்து ஒருமொழி, பகுபதம், பகாப்பதம்"},{"n":167,"c":"இயல் 5","q":"“ஓதுவது ஒழியேல்” என்னும் தொடர் இடம்பெறும் நூல்?","a":"ஆத்திசூடி (ஔவையார்)"},{"n":168,"c":"இயல் 5","q":"இன்பத்தமிழ்க் கல்வி பாடலின் ஆசிரியர்?","a":"பாரதிதாசன்"},{"n":169,"c":"இயல் 5","q":"பாரதிதாசனின் இயற்பெயர்?","a":"கனகசுப்புரத்தினம்"},{"n":170,"c":"இயல் 5","q":"“கழனி” என்பதன் பொருள்?","a":"வயல்"},{"n":171,"c":"இயல் 5","q":"“நிகர்” என்பதன் பொருள்?","a":"சமம்"},{"n":172,"c":"இயல் 5","q":"“பரிதி” என்பதன் பொருள்?","a":"கதிரவன்"},{"n":173,"c":"இயல் 5","q":"“முகில்” என்பதன் பொருள்?","a":"மேகம்"},{"n":174,"c":"இயல் 5","q":"“வெற்பு” என்பதன் பொருள்?","a":"மலை"},{"n":175,"c":"இயல் 5","q":"“அழியாச் செல்வம்” பாடல் இடம்பெறும் நூல்?","a":"நாலடியார்"},{"n":176,"c":"இயல் 5","q":"நாலடியாரின் வேறு பெயர்கள் இரண்டு?","a":"நாலடி நானூறு, வேளாண் வேதம்"},{"n":177,"c":"இயல் 5","q":"நாலடியார் எத்தனை பால்களாகப் பகுக்கப்பட்டுள்ளது?","a":"3 (அறம், பொருள், இன்பம்)"},{"n":178,"c":"இயல் 5","q":"கல்வி எவ்வாறு அழியாச் செல்வமாகக் கூறப்படுகிறது?","a":"பிறரால் கொள்ளப்படாது; கொடுத்தாலும் குறையாது; அரசராலும் கவர முடியாது"},{"n":179,"c":"இயல் 5","q":"ஓரெழுத்து ஒருமொழிகள் எத்தனை?","a":"42"},{"n":180,"c":"இயல் 5","q":"“ஆ” என்னும் ஓரெழுத்து ஒருமொழியின் பொருள்?","a":"பசு"},{"n":181,"c":"இயல் 5","q":"“ஈ” என்பதன் பொருள்?","a":"கொடு, பறவை"},{"n":182,"c":"இயல் 5","q":"“கா” என்பதன் பொருள்?","a":"சோலை, காப்பாற்று"},{"n":183,"c":"இயல் 5","q":"“கை” என்பதன் பொருள்?","a":"உறுப்பு (கரம்)"},{"n":184,"c":"இயல் 5","q":"“கோ” என்பதன் பொருள்?","a":"அரசன்"},{"n":185,"c":"இயல் 5","q":"“தீ” என்பதன் பொருள்?","a":"நெருப்பு"},{"n":186,"c":"இயல் 5","q":"“நா” என்பதன் பொருள்?","a":"நாக்கு"},{"n":187,"c":"இயல் 5","q":"“பூ” என்பதன் பொருள்?","a":"மலர்"},{"n":188,"c":"இயல் 5","q":"“மா” என்பதன் பொருள்?","a":"மாமரம், பெரிய"},{"n":189,"c":"இயல் 5","q":"“மீ” என்பதன் பொருள்?","a":"மேலே, ஆகாயம்"},{"n":190,"c":"இயல் 5","q":"“வீ” என்பதன் பொருள்?","a":"மலர்"},{"n":191,"c":"இயல் 5","q":"“வா” என்பதன் பொருள்?","a":"அழைத்தல் (வருக)"},{"n":192,"c":"இயல் 5","q":"“நொ” என்பதன் பொருள்?","a":"துன்பம்"},{"n":193,"c":"இயல் 5","q":"“ஐ” என்பதன் பொருள்?","a":"தலைவன், அழகு"},{"n":194,"c":"இயல் 5","q":"“ஏ” என்பதன் பொருள்?","a":"அம்பு"},{"n":195,"c":"இயல் 5","q":"“ஊ” என்பதன் பொருள்?","a":"இறைச்சி, தசை"},{"n":196,"c":"இயல் 5","q":"“தே” என்பதன் பொருள்?","a":"கடவுள்"},{"n":197,"c":"இயல் 5","q":"பகுபதம் என்றால் என்ன?","a":"பகுதி, விகுதி முதலிய உறுப்புகளாகப் பிரிக்கக்கூடிய சொல்"},{"n":198,"c":"இயல் 5","q":"பகாப்பதம் என்றால் என்ன?","a":"உறுப்புகளாகப் பிரிக்க இயலாத சொல்"},{"n":199,"c":"இயல் 5","q":"பகுபத உறுப்புகள் ஆறு யாவை?","a":"பகுதி, விகுதி, இடைநிலை, சாரியை, சந்தி, விகாரம்"},{"n":200,"c":"இயல் 5","q":"“நடந்தான்” – பிரித்து எழுதுக.","a":"நட + த்(ந்) + த் + ஆன்"},{"n":201,"c":"இயல் 5","q":"“பாடினாள்” – பிரித்து எழுதுக.","a":"பாடு + இன் + ஆள்"},{"n":202,"c":"இயல் 5","q":"“உண்டான்” – பிரித்து எழுதுக.","a":"உண் + ட் + ஆன்"},{"n":203,"c":"இயல் 5","q":"“வந்தனர்” – பிரித்து எழுதுக.","a":"வா(வ) + த்(ந்) + த் + அன் + அர்"},{"n":204,"c":"இயல் 5","q":"“மரம்” – பகுபதமா? பகாப்பதமா?","a":"பகாப்பதம்"},{"n":205,"c":"இயல் 5","q":"“படித்தான்” – பகுபதமா? பகாப்பதமா?","a":"பகுபதம்"},{"n":206,"c":"இயல் 5","q":"பகுபதங்கள் எத்தனை வகைப்படும்?","a":"2 (பெயர்ப்பகுபதம், வினைப்பகுபதம்)"},{"n":207,"c":"இயல் 5","q":"“பொன்னன்” – எவ்வகைப் பகுபதம்?","a":"பெயர்ப்பகுபதம்"},{"n":208,"c":"இயல் 5","q":"“செய்தான்” – எவ்வகைப் பகுபதம்?","a":"வினைப்பகுபதம்"},{"n":209,"c":"இயல் 6","q":"இரண்டாம் பருவம் இயல் 3-இன் தலைப்பு?","a":"கலை வண்ணம்"},{"n":210,"c":"இயல் 6","q":"இயல் 6-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"ஒரு வேண்டுகோள், கீரைப்பாத்தியும் குதிரையும்"},{"n":211,"c":"இயல் 6","q":"இயல் 6-இன் உரைநடைப் பாடம்?","a":"பேசும் ஓவியங்கள்"},{"n":212,"c":"இயல் 6","q":"இயல் 6-இன் துணைப்பாடம்?","a":"தமிழ் ஒளிர் இடங்கள்"},{"n":213,"c":"இயல் 6","q":"இயல் 6-இன் இலக்கணப் பகுதி?","a":"தொழிற்பெயர்"},{"n":214,"c":"இயல் 6","q":"“கீரைப்பாத்தியும் குதிரையும்” பாடலின் ஆசிரியர்?","a":"காளமேகப்புலவர்"},{"n":215,"c":"இயல் 6","q":"கீரைப்பாத்தியும் குதிரையும் எவ்வகைப் பாடல்?","a":"இரட்டுற மொழிதல் (சிலேடை)"},{"n":216,"c":"இயல் 6","q":"இரட்டுற மொழிதல் என்றால் என்ன?","a":"ஒரே பாடலில் இரு பொருள் தோன்றப் பாடுவது"},{"n":217,"c":"இயல் 6","q":"“வண்கீரை” என்பதன் பொருள்?","a":"வளமான கீரை"},{"n":218,"c":"இயல் 6","q":"“முட்டப்போய்” என்பதன் பொருள்?","a":"முழுதாகச் சென்று"},{"n":219,"c":"இயல் 6","q":"“மறித்தல்” என்பதன் பொருள்?","a":"தடுத்தல்"},{"n":220,"c":"இயல் 6","q":"“பரி” என்பதன் பொருள்?","a":"குதிரை"},{"n":221,"c":"இயல் 6","q":"காளமேகப்புலவர் எவ்வகைக் கவிஞர் எனப்படுகிறார்?","a":"ஆசுகவி"},{"n":222,"c":"இயல் 6","q":"சிலேடை பாடுவதில் வல்லவர் யார்?","a":"காளமேகப்புலவர்"},{"n":223,"c":"இயல் 6","q":"ஓவியம் என்பதற்கான வேறு தமிழ்ச் சொற்கள்?","a":"சித்திரம், படம், ஓவு"},{"n":224,"c":"இயல் 6","q":"குகை ஓவியங்களுக்குப் புகழ்பெற்ற புதுக்கோட்டை ஊர்?","a":"சித்தன்னவாசல்"},{"n":225,"c":"இயல் 6","q":"சித்தன்னவாசல் ஓவியங்கள் எம்மாவட்டத்தில் உள்ளன?","a":"புதுக்கோட்டை"},{"n":226,"c":"இயல் 6","q":"சித்தன்னவாசல் ஓவியங்கள் எச்சமயத்தாருடன் தொடர்புடையவை?","a":"சமணம்"},{"n":227,"c":"இயல் 6","q":"சித்தன்னவாசல் ஓவியங்களில் சிறப்பாக வரையப்பட்டது?","a":"தாமரைக் குளம்"},{"n":228,"c":"இயல் 6","q":"சோழர் கால ஓவியங்கள் உள்ள கோயில்?","a":"தஞ்சைப் பெரிய கோயில்"},{"n":229,"c":"இயல் 6","q":"மதுரை மீனாட்சியம்மன் கோயில் ஓவியங்கள் எக்கால ஓவியங்கள்?","a":"நாயக்கர் கால ஓவியங்கள்"},{"n":230,"c":"இயல் 6","q":"தொழிற்பெயர் என்றால் என்ன?","a":"ஒரு தொழிலின் பெயராக வரும் பெயர்ச்சொல்"},{"n":231,"c":"இயல் 6","q":"தொழிற்பெயர் விகுதிகள் மூன்று?","a":"தல், அல், கை"},{"n":232,"c":"இயல் 6","q":"“படித்தல்” – எவ்வகைப் பெயர்?","a":"தொழிற்பெயர்"},{"n":233,"c":"இயல் 6","q":"“நடை” – எவ்வகைப் பெயர்?","a":"தொழிற்பெயர்"},{"n":234,"c":"இயல் 6","q":"“ஆட்டம்” – எவ்வகைப் பெயர்?","a":"தொழிற்பெயர்"},{"n":235,"c":"இயல் 6","q":"“அழுகை” – எவ்வகைப் பெயர்?","a":"தொழிற்பெயர் (கை விகுதி)"},{"n":236,"c":"இயல் 6","q":"“பாடல்” – எவ்வகைப் பெயர்?","a":"தொழிற்பெயர் (அல் விகுதி)"},{"n":237,"c":"இயல் 6","q":"“செய்தல்” – பகுதி, விகுதி பிரிக்க.","a":"செய் + தல்"},{"n":238,"c":"இயல் 6","q":"“நடத்தல்” – பகுதி, விகுதி பிரிக்க.","a":"நட + தல்"},{"n":239,"c":"இயல் 6","q":"கீரைப்பாத்தியும் குதிரையும் பாடலில் இரு பொருள்கள் எவை?","a":"கீரைப்பாத்தி, குதிரை"},{"n":240,"c":"இயல் 7","q":"மூன்றாம் பருவம் இயல் 1-இன் தலைப்பு?","a":"நயத்தகு நாகரிகம்"},{"n":241,"c":"இயல் 7","q":"இயல் 7-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"விருந்தோம்பல், வயலும் வாழ்வும்"},{"n":242,"c":"இயல் 7","q":"இயல் 7-இன் உரைநடைப் பாடம்?","a":"திக்கெல்லாம் புகழுறும் திருநெல்வேலி"},{"n":243,"c":"இயல் 7","q":"இயல் 7-இன் துணைப்பாடம்?","a":"திருநெல்வேலிச் சீமையும் கவிகளும்"},{"n":244,"c":"இயல் 7","q":"இயல் 7-இன் இலக்கணப் பகுதி?","a":"அணி இலக்கணம்"},{"n":245,"c":"இயல் 7","q":"விருந்தோம்பல் எத்தனையாவது திருக்குறள் அதிகாரம்?","a":"9ஆம் அதிகாரம்"},{"n":246,"c":"இயல் 7","q":"விருந்தோம்பல் எப்பாலில் உள்ளது?","a":"அறத்துப்பால் (இல்லறவியல்)"},{"n":247,"c":"இயல் 7","q":"“விருந்து” என்பதன் பொருள்?","a":"புதியவர் (புதிதாக வந்தவர்)"},{"n":248,"c":"இயல் 7","q":"“ஓம்பல்” என்பதன் பொருள்?","a":"பேணுதல், காத்தல்"},{"n":249,"c":"இயல் 7","q":"திருநெல்வேலியில் ஓடும் ஆறு?","a":"தாமிரபரணி"},{"n":250,"c":"இயல் 7","q":"தாமிரபரணியின் பழைய பெயர்?","a":"பொருநை"},{"n":251,"c":"இயல் 7","q":"திருநெல்வேலியின் பழைய பெயர்களுள் ஒன்று?","a":"நெல்வேலி, வேணுவனம்"},{"n":252,"c":"இயல் 7","q":"திருநெல்வேலியின் புகழ்பெற்ற கோயில்?","a":"நெல்லையப்பர் கோயில்"},{"n":253,"c":"இயல் 7","q":"திருநெல்வேலிப் பகுதி எவ்வாறு அழைக்கப்பட்டது?","a":"தென்பாண்டி நாடு"},{"n":254,"c":"இயல் 7","q":"திருநெல்வேலி எதற்குப் புகழ்பெற்றது?","a":"அல்வா"},{"n":255,"c":"இயல் 7","q":"குற்றாலக் குறவஞ்சியின் ஆசிரியர்?","a":"திரிகூடராசப்பக் கவிராயர்"},{"n":256,"c":"இயல் 7","q":"குமரகுருபரர் பிறந்த ஊர்?","a":"ஸ்ரீவைகுண்டம்"},{"n":257,"c":"இயல் 7","q":"சீறாப்புராணம் பாடிய உமறுப்புலவரின் ஊர்?","a":"எட்டயபுரம்"},{"n":258,"c":"இயல் 7","q":"இடையன்குடியில் தொண்டாற்றிய அயல்நாட்டு அறிஞர்?","a":"கால்டுவெல்"},{"n":259,"c":"இயல் 7","q":"திருநெல்வேலி மாவட்டத்தில் பிறந்த மகாகவி?","a":"பாரதியார் (எட்டயபுரம்)"},{"n":260,"c":"இயல் 7","q":"அணி என்பதன் பொருள்?","a":"அழகு"},{"n":261,"c":"இயல் 7","q":"அணி எத்தனை வகைப்படும்?","a":"பல வகைப்படும் (உவமை, உருவகம் முதலியன)"},{"n":262,"c":"இயல் 7","q":"உவமை அணியின் உறுப்புகள்?","a":"உவமானம், உவமேயம், உவம உருபு, பொதுத்தன்மை"},{"n":263,"c":"இயல் 7","q":"“தாமரை போன்ற முகம்” – உவமேயம் எது?","a":"முகம்"},{"n":264,"c":"இயல் 7","q":"“தாமரை போன்ற முகம்” – உவமானம் எது?","a":"தாமரை"},{"n":265,"c":"இயல் 7","q":"“தாமரை போன்ற முகம்” – உவம உருபு?","a":"போன்ற"},{"n":266,"c":"இயல் 7","q":"“தாமரை போன்ற முகம்” – பொதுத்தன்மை?","a":"அழகு (மலர்ச்சி)"},{"n":267,"c":"இயல் 7","q":"உவம உருபுகள் எவை?","a":"போல, போன்ற, புரைய, ஒப்ப, அன்ன, நிகர"},{"n":268,"c":"இயல் 7","q":"உவமையும் உவமேயமும் வேறுபாடின்றிக் கூறுவது?","a":"உருவக அணி"},{"n":269,"c":"இயல் 7","q":"“முகத்தாமரை” – அணி?","a":"உருவக அணி"},{"n":270,"c":"இயல் 7","q":"“வாழ்க்கைக் கடல்” – அணி?","a":"உருவக அணி"},{"n":271,"c":"இயல் 7","q":"“தேன் போன்ற மொழி” – அணி?","a":"உவமை அணி"},{"n":272,"c":"இயல் 8","q":"மூன்றாம் பருவம் இயல் 2-இன் தலைப்பு?","a":"ஒப்புரவு ஒழுகு"},{"n":273,"c":"இயல் 8","q":"இயல் 8-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"புதுமை விளக்கு, அறம் என்னும் கதிர்"},{"n":274,"c":"இயல் 8","q":"இயல் 8-இன் உரைநடைப் பாடம்?","a":"ஒப்புரவு நெறி"},{"n":275,"c":"இயல் 8","q":"இயல் 8-இன் துணைப்பாடம்?","a":"உண்மை ஒளி"},{"n":276,"c":"இயல் 8","q":"இயல் 8-இன் இலக்கணப் பகுதி?","a":"அணி இலக்கணம்"},{"n":277,"c":"இயல் 8","q":"இயல் 8-இன் வாழ்வியல் பகுதி?","a":"திருக்குறள்"},{"n":278,"c":"இயல் 8","q":"ஒப்புரவறிதல் எத்தனையாவது திருக்குறள் அதிகாரம்?","a":"22ஆம் அதிகாரம்"},{"n":279,"c":"இயல் 8","q":"ஒப்புரவு என்பதன் பொருள்?","a":"உலகத்தோடு ஒத்து வாழ்தல், பிறருக்கு உதவுதல்"},{"n":280,"c":"இயல் 8","q":"ஒப்புரவறிதல் எப்பாலில் உள்ளது?","a":"அறத்துப்பால் (இல்லறவியல்)"},{"n":281,"c":"இயல் 8","q":"ஈகை எத்தனையாவது திருக்குறள் அதிகாரம்?","a":"23ஆம் அதிகாரம்"},{"n":282,"c":"இயல் 8","q":"புகழ் எத்தனையாவது திருக்குறள் அதிகாரம்?","a":"24ஆம் அதிகாரம்"},{"n":283,"c":"இயல் 8","q":"அருளுடைமை எத்தனையாவது திருக்குறள் அதிகாரம்?","a":"25ஆம் அதிகாரம்"},{"n":284,"c":"இயல் 8","q":"ஊருணி நீர் நிறைந்தற்று – உவமை எதனைக் குறிக்கும்?","a":"பிறருக்குப் பயன்படும் செல்வம் (ஒப்புரவாளனின் செல்வம்)"},{"n":285,"c":"இயல் 8","q":"உயிர்களிடம் அன்பு செலுத்துவதைக் கூறும் அதிகாரம்?","a":"அருளுடைமை"},{"n":286,"c":"இயல் 8","q":"இயல்பாக நிகழும் நிகழ்ச்சியில் கவிஞர் தம் குறிப்பை ஏற்றிக் கூறுவது?","a":"தற்குறிப்பேற்ற அணி"},{"n":287,"c":"இயல் 8","q":"புகழ்வது போல இகழ்வது?","a":"வஞ்சப்புகழ்ச்சி அணி"},{"n":288,"c":"இயல் 8","q":"ஒரு சொல் இரு பொருள் தர அமைவது?","a":"சிலேடை அணி"},{"n":289,"c":"இயல் 8","q":"இரு பொருள்களின் வேறுபாட்டைக் கூறுவது?","a":"வேற்றுமை அணி"},{"n":290,"c":"இயல் 8","q":"கூற வந்ததை நேரடியாகக் கூறாமல் வேறொன்றின் மேல் வைத்துக் கூறுவது?","a":"பிறிதுமொழிதல் அணி"},{"n":291,"c":"இயல் 8","q":"திருக்குறள் ‘கொடை’ பற்றிய அதிகாரம்?","a":"ஈகை"},{"n":292,"c":"இயல் 8","q":"“இன்னா செய்யாமை” எத்தனையாவது அதிகாரம்?","a":"32ஆம் அதிகாரம்"},{"n":293,"c":"இயல் 9","q":"மூன்றாம் பருவம் இயல் 3-இன் தலைப்பு?","a":"மானுடம் வெல்லும்"},{"n":294,"c":"இயல் 9","q":"இயல் 9-இன் கவிதைப்பேழைப் பாடங்கள்?","a":"மலைப்பொழிவு, தன்னை அறிதல்"},{"n":295,"c":"இயல் 9","q":"இயல் 9-இன் உரைநடைப் பாடம்?", :"சீத்தலைச் சாத்தனார்"},{"n":343,"c":"நூல்–ஆசிரியர்","q":"பாஞ்சாலி சபதம் – ஆசிரியர்?","a":"பாரதியார்"},{"n":344,"c":"நூல்–ஆசிரியர்","q":"குயில் பாட்டு – ஆசிரியர்?","a":"பாரதியார்"},{"n":345,"c":"நூல்–ஆசிரியர்","q":"பாண்டியன் பரிசு – ஆசிரியர்?","a":"பாரதிதாசன்"},{"n":346,"c":"நூல்–ஆசிரியர்","q":"குடும்ப விளக்கு – ஆசிரியர்?","a":"பாரதிதாசன்"},{"n":347,"c":"நூல்–ஆசிரியர்","q":"தமிழன் இதயம் – ஆசிரியர்?","a":"நாமக்கல் கவிஞர்"},{"n":348,"c":"நூல்–ஆசிரியர்","q":"மலரும் மாலையும் – ஆசிரியர்?","a":"கவிமணி தேசிகவிநாயகம் பிள்ளை"},{"n":349,"c":"நூல்–ஆசிரியர்","q":"திராவிட மொழிகளின் ஒப்பிலக்கணம் – ஆசிரியர்?","a":"கால்டுவெல்"},{"n":350,"c":"நூல்–ஆசிரியர்","q":"சதுரகராதி – ஆசிரியர்?","a":"வீரமாமுனிவர்"},{"n":351,"c":"திருக்குறள்","q":"திருக்குறளின் 1ஆம் அதிகாரம் எது?","a":"கடவுள் வாழ்த்து"},{"n":352,"c":"திருக்குறள்","q":"திருக்குறளின் 2ஆம் அதிகாரம் எது?","a":"வான்சிறப்பு"},{"n":353,"c":"திருக்குறள்","q":"திருக்குறளின் 3ஆம் அதிகாரம் எது?","a":"நீத்தார் பெருமை"},{"n":354,"c":"திருக்குறள்","q":"திருக்குறளின் 4ஆம் அதிகாரம் எது?","a":"அறன் வலியுறுத்தல்"},{"n":355,"c":"திருக்குறள்","q":"திருக்குறளின் 5ஆம் அதிகாரம் எது?","a":"இல்வாழ்க்கை"},{"n":356,"c":"திருக்குறள்","q":"திருக்குறளின் 8ஆம் அதிகாரம் எது?","a":"அன்புடைமை"},{"n":357,"c":"திருக்குறள்","q":"திருக்குறளின் 9ஆம் அதிகாரம் எது?","a":"விருந்தோம்பல்"},{"n":358,"c":"திருக்குறள்","q":"திருக்குறளின் 10ஆம் அதிகாரம் எது?","a":"இனியவை கூறல்"},{"n":359,"c":"திருக்குறள்","q":"திருக்குறளின் 11ஆம் அதிகாரம் எது?","a":"செய்ந்நன்றி அறிதல்"},{"n":360,"c":"திருக்குறள்","q":"திருக்குறளின் 12ஆம் அதிகாரம் எது?","a":"நடுவு நிலைமை"},{"n":361,"c":"திருக்குறள்","q":"திருக்குறளின் 13ஆம் அதிகாரம் எது?","a":"அடக்கமுடைமை"},{"n":362,"c":"திருக்குறள்","q":"திருக்குறளின் 14ஆம் அதிகாரம் எது?","a":"ஒழுக்கமுடைமை"},{"n":363,"c":"திருக்குறள்","q":"திருக்குறளின் 16ஆம் அதிகாரம் எது?","a":"பொறையுடைமை"},{"n":364,"c":"திருக்குறள்","q":"திருக்குறளின் 26ஆம் அதிகாரம் எது?","a":"புலால் மறுத்தல்"},{"n":365,"c":"திருக்குறள்","q":"திருக்குறளின் 30ஆம் அதிகாரம் எது?","a":"வாய்மை"},{"n":366,"c":"திருக்குறள்","q":"திருக்குறளின் 33ஆம் அதிகாரம் எது?","a":"கொல்லாமை"},{"n":367,"c":"திருக்குறள்","q":"திருக்குறளின் 34ஆம் அதிகாரம் எது?","a":"நிலையாமை"},{"n":368,"c":"திருக்குறள்","q":"திருக்குறளின் 35ஆம் அதிகாரம் எது?","a":"துறவு"},{"n":369,"c":"திருக்குறள்","q":"திருக்குறளின் 38ஆம் அதிகாரம் எது?","a":"ஊழ்"},{"n":370,"c":"திருக்குறள்","q":"திருக்குறளின் 40ஆம் அதிகாரம் எது?","a":"கல்வி"},{"n":371,"c":"திருக்குறள்","q":"திருக்குறளின் ஆசிரியர் யார்?","a":"திருவள்ளுவர்"},{"n":372,"c":"திருக்குறள்","q":"திருக்குறளில் எத்தனை அதிகாரங்கள் உள்ளன?","a":"133"},{"n":373,"c":"திருக்குறள்","q":"திருக்குறளின் மொத்தக் குறள்கள் எத்தனை?","a":"1330"},{"n":374,"c":"திருக்குறள்","q":"திருக்குறளின் மூன்று பால்கள் யாவை?","a":"அறத்துப்பால், பொருட்பால், காமத்துப்பால்"},{"n":375,"c":"திருக்குறள்","q":"திருக்குறள் எந்தப் பாவகையால் ஆனது?","a":"குறள் வெண்பா"},{"n":376,"c":"திருக்குறள்","q":"திருவள்ளுவர் ஆண்டைக் கணக்கிட கி.பி. ஆண்டுடன் கூட்ட வேண்டியது?","a":"31"},{"n":377,"c":"இலக்கணப் பயிற்சி","q":"பகுபத உறுப்புகள் எத்தனை?","a":"6"},{"n":378,"c":"இலக்கணப் பயிற்சி","q":"பகுபத உறுப்புகள் யாவை?","a":"பகுதி, விகுதி, இடைநிலை, சாரியை, சந்தி, விகாரம்"},{"n":379,"c":"இலக்கணப் பயிற்சி","q":"பகுதி என்பது?","a":"சொல்லின் முதலில் நின்று பொருள் தரும் உறுப்பு"},{"n":380,"c":"இலக்கணப் பயிற்சி","q":"விகுதி என்பது?","a":"சொல்லின் இறுதியில் நின்று திணை, பால், எண், இடம் காட்டும் உறுப்பு"},{"n":381,"c":"இலக்கணப் பயிற்சி","q":"இடைநிலை என்பது?","a":"பகுதிக்கும் விகுதிக்கும் இடையே நின்று காலம் காட்டும் உறுப்பு"},{"n":382,"c":"இலக்கணப் பயிற்சி","q":"“நடந்தான்” – பகுபத உறுப்புகள்?","a":"நட + த்(ந்) + த் + ஆன் (நட – பகுதி, த் – சந்தி, ந் – விகாரம், த் – இறந்தகால இடைநிலை, ஆன் – விகுதி)"},{"n":383,"c":"இலக்கணப் பயிற்சி","q":"“வாழ்ந்தனர்” – பகுபத உறுப்புகள்?","a":"வாழ் + த்(ந்) + த் + அன் + அர்"},{"n":384,"c":"இலக்கணப் பயிற்சி","q":"“உண்டான்” – பகுபத உறுப்பு பிரிப்பு?","a":"உண் + ட் + ஆன் (ட் – இறந்தகால இடைநிலை)"},{"n":385,"c":"இலக்கணப் பயிற்சி","q":"இறந்தகால இடைநிலைகள் எவை?","a":"த், ட், ற், இன்"},{"n":386,"c":"இலக்கணப் பயிற்சி","q":"நிகழ்கால இடைநிலைகள் எவை?","a":"கிறு, கின்று, ஆநின்று"},{"n":387,"c":"இலக்கணப் பயிற்சி","q":"எதிர்கால இடைநிலைகள் எவை?","a":"ப், வ்"},{"n":388,"c":"இலக்கணப் பயிற்சி","q":"“செய்வான்” – பிரிக்க.","a":"செய் + வ் + ஆன் (வ் – எதிர்கால இடைநிலை)"},{"n":389,"c":"இலக்கணப் பயிற்சி","q":"“பாடுகிறாள்” – பிரிக்க.","a":"பாடு + கிறு + ஆள்"},{"n":390,"c":"இலக்கணப் பயிற்சி","q":"வினைமுற்று என்றால் என்ன?","a":"பொருள் முற்றுப்பெற்று நிற்கும் வினைச்சொல்"},{"n":391,"c":"இலக்கணப் பயிற்சி","q":"பெயரெச்சம் என்றால் என்ன?","a":"எச்சமாக நின்று பெயரைக் கொண்டு முடியும் வினை (எ.கா: வந்த பையன்)"},{"n":392,"c":"இலக்கணப் பயிற்சி","q":"வினையெச்சம் என்றால் என்ன?","a":"எச்சமாக நின்று வினையைக் கொண்டு முடியும் வினை (எ.கா: வந்து போனான்)"},{"n":393,"c":"இலக்கணப் பயிற்சி","q":"வினைச்சொல் எத்தனை வகைப்படும்?","a":"தெரிநிலை வினை, குறிப்பு வினை"},{"n":394,"c":"இலக்கணப் பயிற்சி","q":"காலம் காட்டும் வினை?","a":"தெரிநிலை வினை"},{"n":395,"c":"இலக்கணப் பயிற்சி","q":"காலம் காட்டாமல் பண்பு முதலியன காட்டும் வினை?","a":"குறிப்பு வினை"},{"n":396,"c":"இலக்கணப் பயிற்சி","q":"தன்வினை என்றால் என்ன?","a":"எழுவாய் தானே செய்யும் வினை (எ.கா: கதவு திறந்தது)"},{"n":397,"c":"இலக்கணப் பயிற்சி","q":"பிறவினை என்றால் என்ன?","a":"எழுவாய் பிறரைக் கொண்டு செய்விக்கும் வினை (எ.கா: கதவைத் திறந்தான்)"},{"n":398,"c":"இலக்கணப் பயிற்சி","q":"செய்வினை என்றால் என்ன?","a":"எழுவாய் செயலைச் செய்யும் வாக்கியம் (ராமன் பாடம் படித்தான்)"},{"n":399,"c":"இலக்கணப் பயிற்சி","q":"செயப்பாட்டு வினை என்றால் என்ன?","a":"செயப்படுபொருள் எழுவாயாக வரும் வாக்கியம் (பாடம் படிக்கப்பட்டது)"},{"n":400,"c":"இலக்கணப் பயிற்சி","q":"பெயர்ச்சொற்கள் எத்தனை வகை?","a":"6"},{"n":401,"c":"இலக்கணப் பயிற்சி","q":"“வெண்மை” என்பது எவ்வகைப் பெயர்?","a":"பண்புப்பெயர்"},{"n":402,"c":"இலக்கணப் பயிற்சி","q":"“ஆடல்” என்பது எவ்வகைப் பெயர்?","a":"தொழிற்பெயர்"},{"n":403,"c":"இலக்கணப் பயிற்சி","q":"“மதுரை” என்பது எவ்வகைப் பெயர்?","a":"இடப்பெயர்"},{"n":404,"c":"இலக்கணப் பயிற்சி","q":"“கண்” என்பது எவ்வகைப் பெயர்?","a":"சினைப்பெயர்"},{"n":405,"c":"இலக்கணப் பயிற்சி","q":" // ---------- APP ----------
const $ = s => document.querySelector(s);
const tabs = $("#tabs"), content = $("#content"), search = $("#search");
let active = SECTIONS[0].id;

function renderTabs(){
  const all = [...SECTIONS.map(s => [s.id, s.name]), ["qa","500 வினா-விடை"], ["quiz","பயிற்சி வினாக்கள்"]];
  tabs.innerHTML = "";
  all.forEach(([id,name]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name;
    b.setAttribute("aria-pressed", String(id === active && !search.value.trim()));
    b.onclick = () => { active = id; search.value = ""; render(); };
    tabs.appendChild(b);
  });
}

function topicHTML(t, open, q){
  let html = t.html;
  if(q){ // highlight text only, not tags
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
    html = html.replace(/>([^<]+)</g, (m, txt) => ">" + txt.replace(re, "<mark>$1</mark>") + "<");
  }
  return `<details ${open ? "open" : ""}><summary>${t.t}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  let score = 0, done = 0;
  content.innerHTML = `<h2>பயிற்சி வினாக்கள்</h2><div class="quiz" id="qz"></div><div class="score" id="score" aria-live="polite"></div>`;
  const qz = $("#qz");
  QUIZ.forEach((item, i) => {
    const box = document.createElement("div"); box.className = "q";
    box.innerHTML = `<div>${i+1}. ${item.q}</div><div class="opts"></div>`;
    const opts = box.querySelector(".opts");
    item.o.forEach((txt, j) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = txt;
      b.onclick = () => {
        if(opts.dataset.done) return;
        opts.dataset.done = 1; done++;
        const btns = opts.children;
        btns[item.a].classList.add("ok");
        if(j === item.a) score++; else b.classList.add("bad");
        if(done === QUIZ.length) $("#score").textContent = `உங்கள் மதிப்பெண்: ${score} / ${QUIZ.length}`;
      };
      opts.appendChild(b);
    });
    qz.appendChild(box);
  });
}

let qaPage=0, qaCat="all", qaText="", qaAll=false;
const PER=25;
function renderQA(focusSearch){
  const cats=[...new Set(QA.map(x=>x.c))];
  const t=qaText.toLowerCase();
  const list=QA.filter(x=>(qaCat==="all"||x.c===qaCat)&&(!t||(x.q+" "+x.a).toLowerCase().includes(t)));
  const pages=Math.max(1,Math.ceil(list.length/PER));
  qaPage=Math.min(qaPage,pages-1);
  const slice=list.slice(qaPage*PER,(qaPage+1)*PER);
  content.innerHTML=`<h2>500 வினா-விடை</h2>
  <div class="qa-bar">
    <select id="qaCat" aria-label="பிரிவு"><option value="all">அனைத்துப் பிரிவுகள் (${QA.length})</option>${cats.map(c=>`<option value="${c}" ${c===qaCat?"selected":""}>${c} (${QA.filter(x=>x.c===c).length})</option>`).join("")}</select>
    <input id="qaText" type="search" placeholder="இப்பிரிவில் தேடுக…" aria-label="வினா தேடல்">
    <button id="qaToggle" type="button">${qaAll?"விடைகளை மறை":"விடைகளைக் காட்டு"}</button>
  </div>
  <p class="meta">${list.length} வினாக்கள் · பக்கம் ${qaPage+1} / ${pages}</p>
  ${slice.length?slice.map(x=>`<details class="qa" ${qaAll?"open":""}><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join(""):'<p class="empty">வினாக்கள் இல்லை.</p>'}
  <div class="pager"><button id="qaPrev" type="button" ${qaPage===0?"disabled":""}>« முந்தையது</button><button id="qaNext" type="button" ${qaPage>=pages-1?"disabled":""}>அடுத்தது »</button></div>`;
  const ti=$("#qaText"); ti.value=qaText;
  if(focusSearch){ ti.focus(); ti.setSelectionRange(ti.value.length,ti.value.length); }
  $("#qaCat").onchange=e=>{qaCat=e.target.value;qaPage=0;renderQA();};
  ti.oninput=e=>{qaText=e.target.value;qaPage=0;renderQA(true);};
  $("#qaToggle").onclick=()=>{qaAll=!qaAll;renderQA();};
  $("#qaPrev").onclick=()=>{qaPage--;renderQA();window.scrollTo(0,0);};
  $("#qaNext").onclick=()=>{qaPage++;renderQA();window.scrollTo(0,0);};
}

function render(){
  renderTabs();
  const q = search.value.trim();
  if(q){
    const hits = [];
    SECTIONS.forEach(s => s.topics.forEach(t => {
      const plain = (t.t + " " + t.html.replace(/<[^>]+>/g," ")).toLowerCase();
      if(plain.includes(q.toLowerCase())) hits.push(t);
    }));
    const qh = QA.filter(x => (x.q + " " + x.a).toLowerCase().includes(q.toLowerCase())).slice(0, 40);
    const qhtml = qh.map(x => `<details class="qa"><summary>${x.n}. ${x.q}</summary><div class="body"><b>விடை:</b> ${x.a}</div></details>`).join("");
    content.innerHTML = `<h2>தேடல் முடிவுகள்</h2>` + ((hits.length || qh.length) ? hits.map(t => topicHTML(t, true, q)).join("") + (qh.length ? `<h2>வினா-விடை</h2>` + qhtml : "") : `<p class="empty">முடிவுகள் இல்லை. வேறு சொல்லில் தேடுக.</p>`);
    return;
  }
  if(active === "qa") return renderQA();
  if(active === "quiz") return renderQuiz();
  const s = SECTIONS.find(x => x.id === active);
  content.innerHTML = `<h2>${s.name}</h2>` + s.topics.map((t,i) => topicHTML(t, i === 0)).join("");
}

search.addEventListener("input", render);
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0e1714";
  const next = dark ? "light" : "dark";
  root.dataset.theme = next;
  try{ localStorage.setItem("skg-theme", next); }catch(e){}
};
try{ const t = localStorage.getItem("skg-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#yr").textContent = new Date().getFullYear();
render();
</script>
